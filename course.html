<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><title>Основной курс · MIRAÉ</title></head><body>
<div id="topbar"></div>
<header class="band"><div class="in"><small id="sub"></small><h1 class="ko" id="ct"></h1><p>Основной курс идёт по учебнику, методику потом настроим под себя</p></div></header>
<main><div id="list" class="grid"></div></main>
<script src="data/course.js"></script><script src="data/materials.js"></script><script src="data/l12-jiyo.js"></script><script src="data/l11-adaju.js"></script><script src="data/p12-jiyo-1.js"></script><script src="js/config.js"></script><script src="js/common.js"></script>
<script>
function draw(){
  KR.topbar('course');var C=COURSE;
  document.getElementById('ct').textContent=C.title;document.getElementById('sub').textContent=C.subtitle;
  var row=function(l){
    if(!l.id)return '<div class="card lcard lock"><div class="no">'+l.no+'</div><div class="mid"><b>'+l.no+'과</b><div class="muted">Скоро</div></div><span class="badge">🔒</span></div>';
    if(!KR.can('lesson-'+l.id))return '<div class="card lcard lock"><div class="no">'+l.no+'</div><div class="mid"><b>'+l.no+'과 · <span class="ko">'+l.title+'</span></b><div class="muted">'+(KR.ctx.ok?'Не назначено. Преподаватель откроет доступ.':'Нет связи с сервером')+'</div></div><span class="badge">🔒</span></div>';
    var p=KR.progress(l.id);
    return '<div class="card"><div class="lcard"><div class="no">'+l.no+'</div><div class="mid"><b>'+l.no+'과 · <span class="ko">'+l.title+'</span></b><div class="muted">'+p.n+' из '+p.tot+' блоков</div>'+KR.bar(p.pct)+'</div></div><div class="done-row"><a class="btn pri" href="lesson.html?l='+l.id+'">Открыть урок</a><a class="btn" href="practice.html">🔁 Доп. упражнения</a></div></div>';
  };
  var C2=window.COURSE2;
  var head=function(t){return '<h2 class="sec" style="grid-column:1/-1;margin:14px 4px 0">'+t+'</h2>'};
  document.getElementById('list').innerHTML=(C2?head('1급'):'')+C.lessons.map(row).join('')+(C2?head('2급')+C2.lessons.map(row).join(''):'');
}
if(KR.require()){KR.topbar('course');KR.load().then(draw)}
</script></body></html>
