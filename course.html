<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Курс · MIRAÉ</title>
<meta name="theme-color" content="#0B1535">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="topbar"></div>
<header class="band course-hero"><div class="in"><small id="sub"></small><h1 id="ct"></h1><p id="cp"></p><div id="cta" class="hero-cta"></div></div></header>
<main class="course"><div id="list"></div></main>
<script src="data/course.js"></script><script src="data/materials.js"></script><script src="data/hangul.js"></script><script src="data/clt-a1.js"></script><script src="data/l12-jiyo.js"></script><script src="data/l11-adaju.js"></script><script src="data/p12-jiyo-1.js"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/assistant.js"></script>
<script>
/* Программа показана как путь: части и главы на одной линии. Раздел зависит от языка (переключатель в шапке).
   Корейский: уроки 서울대 한국어+ с прогрессом по блокам. Английский: материалы программы из каталога,
   ученик сам отмечает пройденные. Состояния главы: soon — урока ещё нет; lock — не назначено; open — доступна;
   now — текущая; done — пройдена.
   Задел под сюжет: если у урока в data/course.js есть поле scene, его текст показывается в карточке урока.
   Уроки — карточки с миниатюрой (img/thumb-*.svg, рисует tools/art.py) и статусом; кнопка в шапке ведёт к последнему уроку. */
var esc=KR.esc;
// ---------- программа: список частей с главами ----------
function programKo(){
  var C=COURSE,C2=window.COURSE2;
  var ch=function(l){
    var x={key:l.id||('soon-'+l.no),tag:l.tag||l.no+'과',title:l.title,ko:!l.ru,scene:l.scene};
    if(l.mat){   // глава-материал из каталога (materials/...): доступ и «пройдено» как у материалов
      var m=(window.MATERIALS||[]).filter(function(q){return q.id===l.mat})[0]; if(!m){x.state='soon';return x}
      x.key=m.id; if(!KR.can(m.id)){x.state='lock';return x}
      var d=KR.taken().indexOf(m.id)>=0;x.n=d?1:0;x.tot=1;x.pct=d?100:0;x.state=d?'done':'open';x.href=m.path;x.go=d?'Повторить':'Открыть';
      x.extra='<button data-take="'+esc(m.id)+'" aria-pressed="'+d+'">'+(d?KR.icon('check',16)+' Пройдено':'Отметить пройденным')+'</button>';
      return x;
    }
    if(!l.id){x.state='soon';return x}
    if(!KR.can('lesson-'+l.id)){x.state='lock';return x}
    var p=KR.progress(l.id);x.n=p.n;x.tot=p.tot;x.pct=p.pct;x.P=p.P;x.state=p.pct>=100?'done':'open';
    x.meta=p.n+' из '+p.tot+' блоков';x.href='lesson.html?l='+l.id;x.go=p.pct>=100?'Повторить':p.n?'Продолжить':'Начать';
    x.extra=l.hangul?'<a class="btn" href="materials/korean/ko-hangul-games/">'+KR.icon('spark',16)+'Игры</a>':'<a class="btn" href="practice.html">'+KR.icon('repeat',16)+'Доп. упражнения</a>';
    return x;
  };
  var parts=[{t:C.title.split(' · ')[1]||'',ko:true,items:C.lessons.map(ch)}];
  var C0=window.COURSE0;   // хангыль идёт первой частью, если ученику назначено хотя бы одно занятие (преподаватель видит всегда)
  if(C0&&C0.lessons.some(function(l){return KR.can('lesson-'+l.id)}))parts.unshift({t:'한글',ko:true,items:C0.lessons.map(function(l){return ch(Object.assign({hangul:true},l))})});
  var C3=window.COURSE3;   // CLT-синтез · A1: идёт после хангыля, если назначен хотя бы один урок (преподаватель видит всегда)
  if(C3&&C3.lessons.some(function(l){return KR.can('lesson-'+l.id)}))parts.splice(C0&&parts[0].t==='한글'?1:0,0,{t:'CLT · A1',items:C3.lessons.map(function(l){return ch(Object.assign({ru:true},l))})});
  if(C2)parts.push({t:C2.title.split(' · ')[1]||'',ko:true,items:C2.lessons.map(ch)});
  return {sub:C.subtitle,title:C2?C.title.split(' · ')[0]:C.title,ko:true,note:'Основной курс идёт по учебнику, методику потом настроим под себя',unit:'блоков',parts:parts};
}
function programEn(){
  var done=KR.taken();
  var items=MATERIALS.filter(function(m){return m.section==='english'&&m.kind!=='class'}).map(function(m){
    var x={key:m.id,tag:((window.KINDS||{})[m.kind]||'')+(m.level?' · '+m.level:''),title:m.title,mat:m.id};
    if(!KR.can(m.id)){x.state='lock';return x}
    var d=done.indexOf(m.id)>=0;x.n=d?1:0;x.tot=1;x.state=d?'done':'open';x.href=m.path;x.go='Открыть';
    var a=KR.assignedInfo(m.id);x.meta=a&&(a.due||a.note)?((a.due?'срок '+a.due:'')+(a.due&&a.note?' · ':'')+(a.note||'')):'';
    x.extra='<button data-take="'+esc(m.id)+'" aria-pressed="'+d+'">'+(d?KR.icon('check',16)+' Пройдено':'Отметить пройденным')+'</button>';
    return x;
  });
  return {sub:'Программа',title:(window.SECTIONS||{}).english||'English',note:'Тренажёры, домашние задания и проверочные по программе. Пройденное отмечай сам.',unit:'материалов',parts:[{t:'IELTS',items:items}]};
}
// миниатюра урока: фрагмент пейзажа раздела, по кругу из пяти
function thumb(k){return 'img/thumb-'+(KR.lang()==='en'?'en':'ko')+'-'+(k%5+1)+'.svg'}
// последний урок, к которому ученик возвращался: по времени последнего пройденного блока
function lastTouched(all){
  var best=null,bt=0;
  all.forEach(function(x){if(x.state!=='open'&&x.state!=='done')return;var P=x.P||{};
    Object.keys(P).forEach(function(k){var t=+(P[k]&&P[k].t)||0;if(t>bt&&t<1e13){bt=t;best=x}})});
  return best;
}
function draw(){
  KR.topbar('course');
  var cta=document.getElementById('cta');cta.innerHTML='';
  // преподаватель ещё не открыл ученику ни одного курса: показываем это прямо, без программы чужого языка
  if(KR.noCourses()){
    var c0=document.getElementById('ct');c0.textContent='Курс';c0.className='';
    document.getElementById('sub').textContent='MIRAÉ · школа языков';document.getElementById('cp').textContent='Здесь появится программа твоего языка.';
    document.getElementById('list').innerHTML=KR.noCoursesCard();return;
  }
  var P=KR.lang()==='en'?programEn():programKo();
  // Ученик видит только то, что ему открыл преподаватель: закрытые и ещё не готовые уроки не показываем.
  // Преподаватель видит всю программу: так удобнее назначать.
  if(!(KR.ctx&&KR.ctx.teacher)){
    P.parts=P.parts.map(function(p){return Object.assign({},p,{items:p.items.filter(function(x){return x.state==='open'||x.state==='done'})})})
      .filter(function(p){return p.items.length});
    if(P.ko&&P.parts.length===1&&P.parts[0].t==='한글'&&window.COURSE0){   // открыт только хангыль: это курс «Хангыль с нуля»
      P.title=COURSE0.title;P.sub=COURSE0.subtitle;P.note='Буквы, слоги и первые слова. Новые занятия открывает преподаватель.'}
  }
  var ct=document.getElementById('ct');ct.textContent=P.title;ct.className=P.ko?'ko':'';
  document.getElementById('sub').textContent=P.sub;document.getElementById('cp').textContent=P.note;
  var all=[];P.parts.forEach(function(p){all=all.concat(p.items)});
  all.forEach(function(x,k){x.k=k});
  var now=all.filter(function(x){return x.state==='open'})[0];
  var last=lastTouched(all)||now;
  var n=0,t=0,avail=0;all.forEach(function(x){if(x.state==='open'||x.state==='done'){n+=x.n;t+=x.tot;avail++}});
  var pct=t?Math.round(n/t*100):0,i=0;
  // статус урока словами, как в макете: пройден, в процессе, доступен, будет доступен, скоро
  var status=function(x){
    if(x.state==='soon')return ['soon','spark','Скоро'];
    if(x.state==='lock')return ['lock','lock','Будет доступен'];
    if(x.state==='done')return ['done','check','Пройден'];
    if(x.n)return ['now','spark','В процессе'];
    return ['open','arrow',x===now?'Следующий':'Доступен'];
  };
  var item=function(x){
    var st=status(x),cls=(x===now?'now ':'')+'st-'+st[0];
    var title='<span'+(x.ko?' class="ko" lang="ko"':'')+'>'+esc(x.title||'')+'</span>';
    var art='<img src="'+thumb(x.k)+'" alt="" loading="lazy" width="320" height="200">';
    var chip='<span class="chip">'+KR.icon(st[1],14)+st[2]+'</span>';
    var h='<li class="lsn '+cls+'" style="--i:'+(i++)+'">';
    if(x.state==='soon'||x.state==='lock'){
      return h+'<div class="lsn-art">'+art+chip+'</div><div class="lsn-body"><span class="tag">'+esc(x.tag)+'</span>'+(x.title?'<h3'+(x.ko?' class="ko"':'')+'>'+title+'</h3>':'')+
        '<p class="muted">'+(x.state==='soon'?'Урок готовится.':KR.ctx.ok?'Откроется, когда преподаватель назначит.':'Нет связи с сервером.')+'</p></div></li>';
    }
    return h+'<a class="lsn-art" href="'+esc(x.href)+'" tabindex="-1" aria-hidden="true">'+art+chip+'</a><div class="lsn-body"><span class="tag">'+esc(x.tag)+'</span>'+
      '<h3'+(x.ko?' class="ko"':'')+'><a href="'+esc(x.href)+'">'+title+'</a></h3>'+
      (x.scene?'<p class="scene">'+esc(x.scene)+'</p>':'')+
      (x.meta?'<div class="muted">'+esc(x.meta)+'</div>':'')+(x.tot>1?KR.bar(x.pct||0):'')+
      '<div class="done-row"><a class="btn pri" href="'+esc(x.href)+'">'+x.go+KR.icon('arrow',16)+'</a>'+(x.extra||'')+'</div></div></li>';
  };
  // кнопка в шапке ведёт туда, где ученик остановился
  if(last)cta.innerHTML='<a class="btn pri big" href="'+esc(last.href)+'">'+(last.n?'Продолжить обучение':'Начать обучение')+KR.icon('arrow',18)+'</a>';
  var h='<section class="journey card glass fr" aria-label="Общий прогресс">'+KR.ring(pct,92)+'<div class="mid"><h3>'+(avail&&pct>=100?'Путь пройден':'Твой путь')+'</h3><div class="muted">'+
    (avail?'Пройдено '+n+' из '+t+' '+P.unit+' · открыто уроков: '+avail:(KR.ctx.ok?'Преподаватель ещё не открыл тебе материалы этого раздела. Когда откроет, они появятся здесь.':'Нет связи с сервером: программа не загружена.'))+'</div></div>'+
    (last?'<a class="last" href="'+esc(last.href)+'"><img src="'+thumb(last.k)+'" alt="" width="320" height="200"><span class="last-tx"><small>'+(last.n?'Последний урок':'Следующий урок')+'</small>'+
      '<b'+(last.ko?' class="ko" lang="ko"':'')+'>'+esc(last.title)+'</b><span class="muted">'+esc(last.tag)+(last.tot>1?' · '+last.n+' из '+last.tot:'')+'</span></span>'+
      '<span class="btn pri">'+(last.n?'Продолжить':'Начать')+KR.icon('arrow',16)+'</span></a>':'')+'</section>';
  P.parts.forEach(function(p,k){h+='<h2 class="path-part"'+(k?'':' id="lessons"')+'><small>Часть '+(k+1)+'</small><span'+(p.ko?' class="ko" lang="ko"':'')+'>'+esc(p.t)+'</span></h2><ol class="lgrid">'+p.items.map(item).join('')+'</ol>'});
  document.getElementById('list').innerHTML=h;
}
// английская программа: ученик сам отмечает пройденный материал
document.addEventListener('click',function(e){
  var b=e.target.closest('button[data-take]');if(!b)return;
  var id=b.dataset.take,a=KR.taken().slice(),k=a.indexOf(id);if(k>=0)a.splice(k,1);else a.push(id);
  KR.setTaken(a);draw();
});
KR.onLang=draw;
if(KR.require()){KR.topbar('course');KR.load().then(draw)}
</script>
</body>
</html>
