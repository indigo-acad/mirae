<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Корейский · слова · урок 3</title>
<style>
:root{--bg:#faf7ef;--fg:#1b2a4a;--ac:#3b3a8f;--gd:#b8921a;--cd:#fff;--bd:#d6d2c4;--ok:#2e7d32;--no:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#10162a;--fg:#eee9dc;--ac:#9a98f2;--gd:#e0b93c;--cd:#1b2440;--bd:#33405f;--ok:#388e3c;--no:#d84343}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:640px;padding:44px 16px 16px;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}
a{color:var(--ac)}h1{font-size:1.3em;margin:.4em 0}h3{margin:1.1em 0 .4em;color:var(--ac)}
.m{opacity:.75;font-size:.92em}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1}
button{font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--fg)}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
input{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--fg)}

.r span{text-align:right;opacity:.85}
.hide .r:not(.sh) span{visibility:hidden}
.n{color:var(--gd);font-style:normal;font-weight:700;margin-left:6px}
.o{display:block;width:100%;margin:6px 0;text-align:left}
.o.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.o.no{background:var(--no);color:#fff;border-color:var(--no)}
.q{font-size:1.25em;margin:10px 0}
pre{white-space:pre-wrap;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px}

<h1>🇰🇷 Группа 2724 · 어휘 · урок 3</h1>
<p class="m">Новые слова урока и работа над ошибками проверки 21.11.</p>
<input id="nm" placeholder="Как тебя зовут?">
<div class="tabs"><button data-t="w">📚 Слова и ошибки</button><button data-t="g">🎮 Игры</button></div>
<div id="v"></div>
<script>
const W=`Общие
이체|денежный перевод (со счёта на счёт)
이제|сейчас, теперь
대신|вместо, взамен
동안|в течение
결석하다|отсутствовать (пропускать занятия)
허락|разрешение, позволение
박|ночь
Спина, мышцы, травмы
허리를 삐끗하다|сорвать спину, потянуть спину
손목을 삐끗하다|вывихнуть или потянуть запястье
목을 삐끗하다|потянуть шею (при резком повороте или неудобном сне)
인대|связка
인대가 늘어나다|растянуть связки|2
뭉치다|зажимать, затекать, сводить
어깨가 뭉치다|плечи забились
근육이 뭉치다|мышцы забились / затекли / спазмировались
화상|ожог
멍|синяк
멍이 들다|появился синяк, получить синяк
까지다|содрать кожу
발을 헛디디다|оступиться
정신을 잃다|терять сознание
쏟다|проливать, разливать
반창고|лейкопластырь|1
파스|пластырь для снятия боли
삐끗하다 и 뭉치다 в переносном смысле
서랍이 삐끗하다|ящик перекосился и плохо закрывается
일이 삐끗하다|дело пошло наперекосяк, случилась осечка
머리카락이 뭉치다|волосы спутались в колтун
Происшествия и помощь
끼이다|застрять, защемить
감전사고|происшествие с электричеством
접촉 사고|незначительное столкновение (ДТП)
구급차|скорая помощь
구조대|служба спасения
구조 요청|просьба о спасении
구조하다|спасать, оказывать помощь
신고하다|подавать заявление (о происшествии)
신청하다|подавать заявку
알려주다|давать знать, сообщать
주의사항|меры предосторожности
역무실|офис работников станции
축구장|футбольный стадион
Страховка
보험|страхование
보험으로 처리하다|покрыть страховкой
보험금|страховое возмещение
합의하다|согласовывать, договариваться
합의금|компенсация`;
const E=`Из проверки 21.11 · чаще всего
승객|пассажир|3
들이받다|врезаться (во что-то)|3
떨어지다|падать (само); провалиться|3
응급실|отделение скорой помощи|2
지키다|соблюдать; защищать|2
어기다|нарушать|2
데다|обжечься|2
베이다|порезаться|2
치이다|попасть под машину|2
바르다|мазать, наносить|2
부딪히다|удариться, столкнуться|2
Из проверки 21.11 · остальные
떨어뜨리다|уронить (что-то)|1
붕대를 감다|забинтовать|1
부러지다|сломаться (о кости)|1
과속|превышение скорости|1
근무 시간|рабочее время|1
야단맞다|быть отруганным|1
문에 기대다|прислоняться к двери|1
소원을 빌다|загадать желание|1
갇히다|быть запертым|1
벗어나다|избавиться, выбраться|1
소방|тушение пожара|1
응급 처치|первая медицинская помощь|1
벽|стена|1
넘다|превышать (넘어지다 — упасть)|1
굽다|жарить на огне, гриле (ㅂ-неправильный)|1
-에 달려 있다|зависеть от…|1`;
const S=`나무에서 사과가 ___.|떨어졌어요/떨어뜨렸어요|0|Падает само → 떨어지다
손에서 휴대폰을 ___.|떨어졌어요/떨어뜨렸어요|1|Уронить что-то (을/를) → 떨어뜨리다
도서관에서는 규칙을 잘 ___세요.|지키/어기|0|지키다 — соблюдать
친구가 또 약속을 ___.|지켰어요/어겼어요|1|어기다 — нарушать
신호를 ___ 사고가 났어요.|지켜서/어겨서|1|신호를 어기다 — нарушить сигнал
다리미에 손가락을 ___.|데었어요/베였어요|0|데다 — обжечься
유리에 손을 ___.|데었어요/베였어요|1|베이다 — порезаться
횡단보도에서 차에 ___.|치였어요/들이받았어요|0|치이다 — попасть под машину
운전자가 가로등을 ___.|치였어요/들이받았어요|1|들이받다 — врезаться (во что-то)
넘어져서 머리를 ___.|부딪혔어요/데었어요|0|부딪히다 — удариться
상처에 연고를 ___.|발랐어요/감았어요|0|연고를 바르다 — намазать мазь
다리에 붕대를 ___.|발랐어요/감았어요|1|붕대를 감다 — забинтовать
파티에 온 손님이 100명이 ___.|넘었어요/넘어졌어요|0|넘다 — превышать; 넘어지다 — упасть
캠핑장에서 고기를 ___.|구웠어요/굽었어요|0|굽다 → 구웠어요 (ㅂ-неправильный)
모든 것은 너의 노력에 ___.|달려 있어/떨어져 있어|0|-에 달려 있다 — зависеть от…
넘어져서 다리가 ___.|부러졌어요/늘어났어요|0|부러지다 — сломаться; 인대가 늘어나다 — растянуть связки`;

const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
const parse=t=>{const g=[];t.trim().split('\n').forEach(l=>{if(l.includes('|')){const[k,r,n]=l.split('|');g.at(-1).w.push({k,r,n:+n||0})}else g.push({t:l,w:[]})});return g};
const GW=parse(W),GE=parse(E);
const all=[...new Map([...GW,...GE].flatMap(g=>g.w).map(x=>[x.k,x])).values()];
const ew=all.filter(x=>x.n);
const SI=()=>S.trim().split('\n').map(l=>{const[q,o,a,h]=l.split('|');return{q,o:o.split('/'),a:+a,h}});
const nm=()=>$('#nm').value.trim();
try{$('#nm').value=localStorage.getItem('nm2724')||''}catch(e){}
try{const m=location.hash.match(/^#auto=(.+)$/);
  if(m){const a=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(a.n){$('#nm').value=a.n;localStorage.setItem('nm2724',a.n)}}
  else if(!$('#nm').value){const u=localStorage.getItem('kr_user');if(u)$('#nm').value=u}}catch(e){}
$('#nm').oninput=()=>{try{localStorage.setItem('nm2724',nm())}catch(e){}};
const rows=g=>g.map(x=>`<h3>${x.t}</h3>`+x.w.map(w=>`<div class="r"><b>${w.k}${w.n?`<i class="n">×${w.n}</i>`:''}</b><span>${w.r}</span></div>`).join('')).join('');
const wd=p=>sh(p).slice(0,15).map(w=>{const o=sh([w.r,...sh(p.filter(x=>x.r!==w.r)).slice(0,3).map(x=>x.r)]);return{q:w.k,w:w.k,o,a:o.indexOf(w.r),h:`${w.k} — ${w.r}`}});

const CK='g2724_3_lesson_v1';
const lessonDone=k=>{const n=nm();if(!n)return;try{let s=JSON.parse(localStorage.getItem(CK)||'null');if(!s||(s.name||'').toLowerCase()!==n.toLowerCase())s={name:n,vocab:{}};s.vocab[k]=1;localStorage.setItem(CK,JSON.stringify(s))}catch(e){}};
function run(el,it,ti){
  let i=0,s=0,bad=[];
  const go=()=>{
    if(i==it.length){
      const p=Math.round(100*s/it.length),t=`🧩 2724 · урок 3 · ${ti}\n👤 ${nm()||'—'}\n📅 ${new Date().toLocaleDateString('ru-RU')}\n✅ ${s}/${it.length} (${p}%)`+(bad.length?`\n❌ ${bad.join(' · ')}`:'');
      lessonDone(ti);
      el.innerHTML=`<h3>${s}/${it.length} · ${p}%</h3><pre>${t}</pre><button id="cp" class="pri">Скопировать результат</button> <button id="rs">Ещё раз</button>`;
      $('#cp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(t);
      $('#rs').onclick=()=>run(el,sh(it),ti);
      return}
    const x=it[i];
    el.innerHTML=`<p class="m">${i+1}/${it.length}</p><div class="q">${x.q}</div>`+x.o.map((o,j)=>`<button class="o" data-j="${j}">${o}</button>`).join('')+`<p id="h" class="m"></p>`;
    el.querySelectorAll('.o').forEach(b=>b.onclick=()=>{
      if($('#nx'))return;
      const j=+b.dataset.j;
      el.querySelectorAll('.o')[x.a].classList.add('ok');
      if(j==x.a)s++;else{b.classList.add('no');bad.push(x.w||x.o[x.a])}
      $('#h').innerHTML=x.h+`<br><button id="nx" class="pri">Дальше →</button>`;
      $('#nx').onclick=()=>{i++;go()}});
  };
  go();
}

const GAMES=[{k:'g:w',id:'p1',n:'Все слова',t:'слова',items:()=>wd(all)},{k:'g:e',id:'p2',n:'Только ошибки',t:'слова-ошибки',items:()=>wd(ew)},{k:'g:s',id:'p3',n:'Предложения',t:'предложения',items:SI}];
window.MIRAE_PARTS=[{g:'Игры',t:GAMES.map(x=>({k:x.k,n:x.n}))}];
if(window.MIRAE_PICK)MIRAE_PICK.keep(GAMES,x=>x.k);
function show(t){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
  const v=$('#v');
  if(t=='w'){
    v.innerHTML=`<p class="m">×N — сколько учениц из трёх ошиблись в этом слове на проверке 21.11.</p><button id="hd">Скрыть переводы</button> <span class="m">тап по слову — показать</span><div id="l">${rows([...GW,...GE])}</div>`;
    $('#hd').onclick=()=>$('#l').classList.toggle('hide');
    $('#l').onclick=e=>{const r=e.target.closest('.r');if(r)r.classList.toggle('sh')};
  }
  if(t=='g'){
    v.innerHTML=GAMES.map(x=>`<button id="${x.id}">${x.n}</button>`).join(' ')+`<div id="q"></div>`;
    GAMES.forEach(x=>$('#'+x.id).onclick=()=>run($('#q'),x.items(),x.t));
  }
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.t));
if(window.MIRAE_PICK){document.querySelector('[data-t="w"]').style.display='none';show('g')}else show('w');
</script></body></html>
