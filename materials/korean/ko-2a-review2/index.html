<style>

<script>
/*DATA-START*/
const GRAMMARS=["-는/(으)ㄴ/인 것 같다","명보다","-(으)ㄴ 명","명(으)로","-는데요/(으)ㄴ데요/인데요","-(으)ㄹ 거예요 (догадка)","‘르’ 불규칙","-(으)면 되다","명마다","-(으)ㄹ게요","-기 전에","-(으)ㄴ 후에"];

/* ---------- 발음 ---------- */
const PRON_RULES=[
 {t:"1. Двойной 받침 ㄼ",x:"Перед гласной читаем оба: ㄹ остаётся, ㅂ переходит в следующий слог. Перед согласной — только ㄹ, а ㄱ, ㄷ, ㅅ, ㅈ после него становятся напряжёнными.",ex:["짧아요 [짤바요]","넓어요 [널버요]","얇고 [얄꼬]","짧지 않아요 [짤찌 아나요]"]},
 {t:"2. Интонация вопроса",x:"Есть вопросительное слово (어디, 언제, 뭐, 얼마) — конец вопроса ↘ понижаем. Вопрос «да/нет» — ↗ повышаем.",ex:["우체국이 어디에 있어요? ↘","소포를 언제 보낼 거예요? ↘","소포 보낼 거예요? ↗"]},
 {t:"3. -(으)ㄹ + ㄱ → [ㄲ]",x:"После окончания -(으)ㄹ звук ㄱ читается напряжённо. Пишем 게요, 거예요 — читаем [께요], [꺼예요].",ex:["제가 버릴게요 [버릴께요]","청소기를 돌릴게요 [돌릴께요]","모레 도착할 거예요 [도차칼꺼예요]"]}
];
const PRON=[
 {q:"얇고 читается как…",o:["[얄꼬]","[얍꼬]","[얄고]","[야꼬]"],a:0,n:"Перед согласной читаем ㄹ, а ㄱ → ㄲ."},
 {q:"넓어요 читается как…",o:["[널버요]","[너버요]","[널어요]","[넙어요]"],a:0,n:"Перед гласной ㅂ переходит в следующий слог."},
 {q:"«우체국이 어디에 있어요?» — конец вопроса…",o:["↘ понижаем","↗ повышаем"],a:0,n:"Есть 어디 — понижаем."},
 {q:"«택배를 오늘 보낼 거예요?» — конец вопроса…",o:["↘ понижаем","↗ повышаем"],a:1,n:"Вопрос да/нет — повышаем."},
 {q:"버릴게요 читается как…",o:["[버릴께요]","[버릴게요]","[버리께요]","[버릴깨요]"],a:0,n:"-(으)ㄹ + ㄱ → ㄲ."},
 {q:"좋아할 거예요 читается как…",o:["[조아할꺼예요]","[조아할거예요]","[좋아할거에요]","[조아하꺼예요]"],a:0,n:"ㅎ между гласными не читается, а ㄱ после -ㄹ → ㄲ."}
];

/* ---------- 어휘 ---------- */
const VOCAB=[
 {lead:"Выбери слово с тем же смыслом, что подчёркнутое.",q:"가: 은행에 왜 가요?\n나: 통장에서 돈을 좀 <u>찾으려고</u> 가요.",o:["입금하려고","출금하려고","환전하려고","송금하려고"],a:1,n:"돈을 찾다 = 출금하다 (снимать). 입금 — вносить, 환전 — обмен валюты, 송금 — перевод."},
 {q:"가: 어떻게 오셨어요?\n나: 바지가 작아서 큰 사이즈로 <u>바꾸고</u> 싶은데요.",o:["교환하고","환불하고","주문하고","포장하고"],a:0,n:"바꾸다 (товар) = 교환하다. 환불 — вернуть деньги."},
 {q:"가: 이 원피스 어때요?\n나: 저는 <u>단순한</u> 디자인이 좋아요.",o:["화려한","간단한","밝은","짧은"],a:1,n:"단순하다 ≈ 간단하다 — простой."},
 {lead:"Выбери слово с ПРОТИВОПОЛОЖНЫМ смыслом.",q:"가: 이 구두는 굽이 너무 <u>높아요</u>.\n나: 그럼 굽이 ( ) 구두는 어때요?",o:["낮은","단순한","어두운","짧은"],a:0,n:"굽이 높다 ↔ 굽이 낮다."},
 {q:"가: 이 코트는 색깔이 너무 <u>어두운</u> 것 같아요.\n나: 그럼 ( ) 색은 어때요?",o:["밝은","화려한","얇은","가벼운"],a:0,n:"어둡다 ↔ 밝다."},
 {q:"가: 통장에 돈을 <u>넣었어요</u>? (입금)\n나: 아니요, 어제 돈을 다 ( ).",o:["찾았어요","보냈어요","바꿨어요","눌렀어요"],a:0,n:"넣다 (입금) ↔ 찾다 (출금)."},
 {lead:"Выбери подходящее слово.",q:"은행에 들어가면 먼저 번호표를 ( ).",o:["뽑아요","붙여요","눌러요","써요"],a:0,n:"번호표를 뽑다 — взять талончик."},
 {q:"편지를 보내기 전에 봉투에 우표를 ( ).",o:["붙여요","뽑아요","포장해요","서명해요"],a:0,n:"우표를 붙이다 — наклеить марку."},
 {q:"ATM에서 돈을 찾을 때 비밀번호를 ( ).",o:["눌러요","붙여요","뽑아요","넣어요"],a:0,n:"비밀번호를 누르다 — ввести ПИН-код."},
 {q:"통장을 만들려면 ( )이/가 필요해요. 여권을 주세요.",o:["신분증","우표","번호표","장바구니"],a:0,n:"신분증 — удостоверение личности."},
 {q:"지금 사지 않을 물건은 ( )에 넣어 두세요.",o:["장바구니","신청서","봉투","옷장"],a:0,n:"장바구니 — корзина в интернет-магазине."},
 {q:"2만 원 이상 사면 ( )이/가 무료예요.",o:["배송비","할인","환불","요금"],a:0,n:"배송비 — стоимость доставки."},
 {q:"밥을 다 먹었어요. 이제 ( ).",o:["설거지해요","빨래해요","다림질해요","걸레질해요"],a:0,n:"После еды — моем посуду."},
 {q:"옷이 바닥에 많아요. 옷을 옷장에 ( ).",o:["정리해요","버려요","빨아요","닦아요"],a:0,n:"정리하다 — разложить по местам."}
];

/* ---------- 문법 ---------- */
const GRAM_MCQ=[
 {q:"가: 와, 이 케이크 맛있어요!\n나: 제가 어제 ( ) 케이크예요.",o:["만든","만드는","만들","만들고"],a:0,n:"Прошлое перед существительным: 만들다 → 만든."},
 {q:"가: 기차로 갈까요?\n나: 주말이라서 기차가 비행기( ) 더 비쌀 거예요.",o:["보다","마다","로","부터"],a:0,n:"Сравнение — 보다."},
 {q:"이 가방은 좀 ( ) 것 같아요.",o:["무거운","무겁는","무겁은","무거는"],a:0,n:"Прилагательное + -(으)ㄴ 것 같다; ㅂ → 우: 무거운."},
 {q:"직원: 뭘 찾으세요?\n손님: 운동화를 좀 ( ).",o:["사고 싶은데요","사고 싶는데요","사고 싶을게요","사고 싶을까요"],a:0,n:"싶다 ведёт себя как прилагательное → -(으)ㄴ데요."},
 {q:"가: 체크카드를 잃어버렸어요.\n나: 은행에 가서 다시 ( ).",o:["만들면 돼요","만들게요","만들 줄 알아요","만들기 전에"],a:0,n:"Совет «достаточно…» — -(으)면 되다. 만들게요 — это я обещаю."},
 {q:"한국 문화와 러시아 문화는 많이 ( ).",o:["달라요","다르어요","달러요","다라요"],a:0,n:"르 불규칙: 다르다 → 달라요."},
 {q:"밥을 ( ) 약을 드세요.",o:["먹은 후에","먹기 후에","먹은 전에","먹기 마다"],a:0,n:"после — -(으)ㄴ 후에."},
 {q:"이 공항버스는 30분( ) 있어요.",o:["마다","보다","으로","동안"],a:0,n:"каждые 30 минут — 30분마다."},
 {q:"가: 이따가 연락 주세요.\n나: 네, 집에 도착하면 ( ).",o:["전화할게요","전화할까요","전화할 것 같아요","전화하면 돼요"],a:0,n:"Обещание собеседнику — -(으)ㄹ게요."},
 {q:"서울에서 부산까지 KTX( ) 가면 2시간 반 걸려요.",o:["로","으로","에서","마다"],a:0,n:"KTX [케이티엑스] — на гласную → 로."}
];
const GRAM_FIX=[
 {s:"이 바지는 저한테 좀 <u>크는 것 같아요</u>.",a:["큰 것 같아요"],n:"크다 — прилагательное: 큰 것 같아요."},
 {s:"민수 씨는 내일 학교에 안 <u>올게요</u>.",a:["올 거예요","올 거에요"],n:"Про другого — не 게요: 안 올 거예요."},
 {s:"저녁을 <u>먹기 후에</u> 산책해요.",a:["먹은 후에","먹고 나서"],n:"후에 ← -(으)ㄴ: 먹은 후에."},
 {s:"저는 보통 <u>볼펜로</u> 써요.",a:["볼펜으로"],n:"На согласную (кроме ㄹ) — 으로."},
 {s:"제 동생은 노래를 잘 <u>부르어요</u>.",a:["불러요"],n:"르 불규칙: 부르다 → 불러요."},
 {s:"어제 <u>산는</u> 옷이 마음에 들어요.",a:["산"],n:"Прошлое перед существительным: 사다 → 산."},
 {s:"저는 <u>주말마다에</u> 청소해요.",a:["주말마다"],n:"После 마다 частица 에 не нужна."}
];
const GRAM_BUILD=[
 {q:"가: 언제 청소할 거예요?",g:"-(으)ㄴ 후에",w:["수업이","끝난","후에","청소할 거예요."],x:["끝나기"]},
 {q:"가: 지금 뭐 해요? 시간 있어요?",g:"-는데요",w:["지금","빨래를","하는데요."],x:["한데요."]},
 {q:"가: 이 옷 어때요?",g:"-(으)ㄴ 것 같다",w:["색깔이","좀","어두운","것 같아요."],x:["어둡는"]},
 {q:"가: 학교에 어떻게 와요?",g:"(으)로",w:["저는","지하철로","와요."],x:["지하철으로"]},
 {q:"가: 설거지 좀 해 주세요.",g:"-(으)ㄹ게요",w:["네,","제가","지금","할게요."],x:["할까요?"]},
 {q:"가: 빨래를 얼마나 자주 해요?",g:"명마다",w:["일요일마다","빨래를","해요."],x:["일요일보다"]},
 {q:"가: 언제 손을 씻어요?",g:"-기 전에",w:["밥을","먹기","전에","손을 씻어요."],x:["먹은"]},
 {q:"가: 택배를 오늘 보내면 언제 도착해요?",g:"-(으)ㄹ 거예요",w:["아마","모레쯤","도착할 거예요."],x:["도착할게요."]}
];

/* ---------- 말하기 ---------- */
const SPEAK=[

const rich=s=>esc(s).replace(/&lt;(\/?)u&gt;/g,"<$1u>").replace(/\n/g,"<br>");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>String(s).replace(/[\s.,!?~]/g,"");
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));voice=v.find(x=>/Natural|Neural|Online|Google|Yuna|SunHi/i.test(x.name))||v[0]||null;}catch(e){}}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
