 {t:"4단원 · 받침 ‘ㄼ’",x:"받침 ‘ㄼ’ 뒤에 오는 음절이 모음으로 시작하면 ‘ㄹ’은 받침소리로 남고, ‘ㅂ’이 그 음절의 첫소리로 발음됩니다. 자음이 오면 ‘ㄹ’만 발음합니다. 받침 ‘ㄼ’ 뒤의 자음 ‘ㄱ, ㄷ, ㅅ, ㅈ’은 [ㄲ, ㄸ, ㅆ, ㅉ]로 발음합니다.",ru:"Перед гласной: ㄹ остаётся, ㅂ уходит в следующий слог. Перед согласной читаем только ㄹ, а ㄱ, ㄷ, ㅅ, ㅈ после него становятся напряжёнными.",ex:["길이가 짧은 것 같아요. [짤븐]","치마가 짧지 않아요. [짤찌]"],pr:["이 옷은 좀 얇아요.","넓고 편한 침대 있어요?"]},

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich=s=>esc(s).replace(/&lt;(\/?)u&gt;/g,"<$1u>").replace(/\n/g,"<br>");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>String(s).replace(/[\s.,!?~]/g,"");
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));voice=v.find(x=>/Natural|Neural|Online|Google|Yuna|SunHi/i.test(x.name))||v[0]||null;}catch(e){}}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){try{t=String(t).replace(/<[^>]+>/g,"").replace(/\[.*?\]|[↘↗]|\(\s*\)|_+/g," ");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u);}catch(e){}}
const SB=t=>`<button class="say" onclick='say(${JSON.stringify(t).replace(/'/g,"&#39;")})'>🔊</button>`;

function mark(sec,key,ok,tot){ const s=SCORE[sec]||(SCORE[sec]={ok:0,tot:tot,done:new Set()}); s.tot=tot; if(s.done.has(key)) return; s.done.add(key); if(ok) s.ok++; drawTabs(); }

function mcqHTML(sec,list,opt){
  opt=opt||{};
  return list.map((it,i)=>{
    const p=it.ref!==undefined?"":(it.p?`<div class="passage">${it.html||/<span|<table/.test(it.p)?it.p:rich(it.p)}</div>`:"");
    return `${it.lead?`<h3>${esc(it.lead)}</h3>`:""}<div class="item">
     ${p}${it.box?`<div class="box">${esc(it.box)}</div>`:""}
     <div class="q"><span class="qn">${i+1}.</span>${it.sub?esc(it.sub):""}${it.q?rich(it.q):""} ${it.q?SB(it.q):""}</div>
     <div class="opts ${it.o.some(x=>x.length>18)?"one":""}">${it.o.map((o,k)=>`<button onclick="mcq('${sec}',${i},${k},this)">${["①","②","③","④"][k]||""} ${esc(o)}</button>`).join("")}</div>
     <div class="ex hide" id="ex-${sec}-${i}"></div></div>`;}).join("");
}
const LISTS={};
function mcq(sec,i,k,b){
  const it=LISTS[sec][i], box=b.parentNode; if(box.dataset.lock) return; box.dataset.lock=1;
  [...box.children].forEach((x,j)=>{ if(j===it.a) x.classList.add("ok"); else if(j===k) x.classList.add("bad"); });
  const e=$(`ex-${sec}-${i}`); e.classList.remove("hide"); e.innerHTML=(k===it.a?"✅ ":"❌ ")+esc(it.n);
  mark(sec,i,k===it.a,LISTS[sec].length);
}

function buildDraft(){
  let slot=0; const out=WRITE_FRAMES.map(f=>{
    if(typeof f.c[0]==="string"){ return (WV["w"+(slot++)]||"").trim(); }
    let parts=[], t=f.t.replace(/\[\d+\]/g,()=>{ const v=(WV["w"+(slot++)]||"").trim(); parts.push(v); return v||"___"; });
    return parts.some(Boolean)?t.replace(/\s+/g," ").trim():"";
  }).filter(Boolean).join(" ");
  $("wText").value=out; TEXTS.write=out; wCount(); $("wText").focus();
}
function wCount(){
