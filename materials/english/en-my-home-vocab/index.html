*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--indigo),var(--indigo2));background-attachment:fixed;color:var(--ivory);font:16px/1.65 Inter,system-ui,sans-serif;padding:0 15px 60px}
main{max-width:850px;margin:auto}h1,h2{font-family:"Cormorant Garamond",serif;font-weight:600;margin:0}
.hero{position:relative;margin:0 -15px 18px;padding:40px 15px 120px;background:url(../../../img/scene-en.svg) bottom/100% 120px no-repeat}
.hero>div{max-width:850px;margin:auto}
h1{font-size:clamp(38px,8vw,54px);color:var(--gold)}.sub{color:var(--silver);margin:4px 0 0}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}nav a{color:var(--gold);border:1px solid #806e58;border-radius:99px;padding:3px 12px;text-decoration:none;font-size:13px}
.card{background:var(--ivory);color:#1a2040;border-radius:16px;padding:20px;margin:0 0 20px}.card h2{font-size:29px;color:var(--indigo);margin-bottom:8px}.card h3{margin:17px 0 6px;color:var(--indigo2);font-size:17px}
.ex{background:#fff;border-left:3px solid var(--gold);padding:9px 12px;border-radius:6px;margin:9px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.vocab{background:#fff;border:1px solid #e3e0d4;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.vocab svg{width:64px;height:64px;margin-bottom:4px}
.word{font-size:19px;font-weight:600;color:var(--indigo)}.pron{font-size:13px;color:#68708a}.ru{color:#39415d}
.house{background:#fff;border:1px solid #e3e0d4;border-radius:14px;padding:8px;margin:10px 0}.house svg{display:block;width:100%;height:auto}
input[type=text]{font:inherit;border:1px solid #b9b5a4;border-radius:8px;padding:5px 8px;max-width:100%;width:280px;background:#fff;color:#1a2040}
.q{margin:12px 0}.q input{margin:3px 4px}
.qi{display:flex;gap:12px;align-items:center}.qi svg{flex:0 0 52px;width:52px;height:52px;background:#fff;border:1px solid #e3e0d4;border-radius:10px;padding:4px}
label.opt{display:block;padding:7px 10px;border:1px solid #d6d2c2;border-radius:8px;margin:4px 0;cursor:pointer;background:#fff}label.opt.ok{border-color:var(--ok);background:#e6f3ec}label.opt.no{border-color:var(--bad);background:#fbeceb}
input.ok,select.ok{border-color:var(--ok);background:#e6f3ec}input.no,select.no{border-color:var(--bad);background:#fbeceb}.key{font-size:13px;margin-left:7px;color:var(--bad)}.key.g{color:var(--ok)}
select{font:inherit;padding:4px 6px;border-radius:8px;border:1px solid #b9b5a4;background:#fff;color:#1a2040;max-width:100%}
.res{font-weight:600;color:var(--indigo2);margin-top:8px}.blk{border-top:1px dashed #c9c5b3;margin-top:17px;padding-top:4px}
.small{font-size:13px;color:#68708a}
@media(max-width:520px){.card{padding:15px}.card h2{font-size:25px}input[type=text]{width:100%}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

/* разрез дома: подписи (labels=true) или номера для упражнения */
function houseSVG(labels){
 const R=[ // x,y,w,h,label,num
  [190,70,220,60,"attic",1],[190,130,120,80,"bedroom",2],[310,130,100,80,"bathroom",3],
  [190,210,130,80,"living room",4],[320,210,90,80,"kitchen",5],[190,290,220,50,"basement",6],
  [70,200,120,90,"garage",7]];
 let s=`<svg viewBox="0 0 600 360" role="img" aria-label="House"><rect width="600" height="360" fill="#F8F7F2"/>
 <path d="M0 290h600v70H0z" fill="#E7DCC4"/><circle cx="530" cy="60" r="26" fill="${G}" opacity=".5"/>
 <g stroke="${N}" stroke-width="2.5" stroke-linejoin="round">
 <path d="M175 130L300 40l125 90z" fill="#EAD8B4"/><rect x="190" y="130" width="220" height="210" fill="#fff"/>
 <path d="M60 200l65-40 65 40z" fill="#EAD8B4"/><rect x="70" y="200" width="120" height="90" fill="#fff"/>
 <path d="M190 210h220M190 290h220M310 130v80M320 210v80M190 130h220" fill="none"/>
 <path d="M88 220h84v70H88z" fill="${F}"/><path d="M88 240h84M88 260h84" fill="none" stroke-width="1.5"/>
 <rect x="206" y="160" width="60" height="20" rx="4" fill="${F}"/><rect x="206" y="150" width="14" height="10" rx="3" fill="${G}"/>
 <path d="M326 170h70v8c0 8-5 12-12 12h-46c-7 0-12-4-12-12z" fill="${F}"/>
 <rect x="206" y="250" width="56" height="22" rx="6" fill="${F}"/><rect x="214" y="226" width="40" height="18" rx="2" fill="${N}"/>
 <rect x="350" y="248" width="40" height="42" rx="2" fill="${F}"/><path d="M350 260h40" fill="none"/>
 <path d="M206 330h14v-10h14v-10h14" fill="none" stroke="${G}" stroke-width="4"/>
 <circle cx="300" cy="100" r="11" fill="#fff"/>
 <path d="M500 290v-50" fill="none"/><circle cx="500" cy="225" r="32" fill="#CFD8C4"/>
 <path d="M440 290v-22M455 290v-22M470 290v-22M432 274h46" fill="none" stroke-width="2"/></g>`;
 R.forEach(([x,y,w,h,l,n])=>{
  const cx=x+w/2, cy=y+(l==="attic"?h-10:16);
  s+=labels?`<text x="${cx}" y="${cy}" text-anchor="middle" font-family="Inter,sans-serif" font-size="17" font-weight="600" fill="${N}" paint-order="stroke" stroke="#fff" stroke-width="4">${l}</text>`
   :`<circle cx="${cx}" cy="${cy-5}" r="12" fill="${N}"/><text x="${cx}" y="${cy}" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="${G}">${n}</text>`});
 s+=labels?`<text x="500" y="230" text-anchor="middle" font-family="Inter,sans-serif" font-size="17" font-weight="600" fill="${N}">garden</text>`
  :`<circle cx="500" cy="220" r="12" fill="${N}"/><text x="500" y="225" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="${G}">8</text>`;
 return s+`</svg>`;
}

const app=document.getElementById("app"),nav=document.getElementById("nav"),states={};
let exCount=0;
sections.forEach((s,si)=>{
 nav.insertAdjacentHTML("beforeend",`<a href="#s${si}">${si+1}</a>`);
 let out=`<section class="card" id="s${si}"><h2>${s.title}</h2>${s.content||""}`;
 (s.exercises||[]).forEach(ex=>{
  const id="ex"+(exCount++);states[id]={ex,done:{}};
  out+=`<div class="blk"><h3>${ex.name}</h3>${ex.pre||""}`;
  if(ex.type==="text"){
   ex.items.forEach((it,i)=>{
    const inp=`<input type="text" data-ex="${id}" data-i="${i}" autocomplete="off" autocapitalize="none" spellcheck="false">`;
    const sentence=it[0].includes("{}")?it[0].replace("{}",inp):`<b>${it[0]}</b> → ${inp}`;
    const body=`${i+1}. ${sentence}<span class="key" id="${id}_${i}"></span>`;
    out+=it[2]?`<div class="q qi">${ic(it[2])}<div>${body}</div></div>`:`<div class="q">${body}</div>`;
   });
  } else if(ex.type==="choice"){
   ex.items.forEach((it,i)=>{
    out+=`<div class="q"><b>${i+1}. ${it[0]}</b>${it[1].map((o,j)=>`<label class="opt" id="${id}_${i}_${j}"><input type="radio" name="${id}_${i}" data-ex="${id}" data-i="${i}" value="${j}"> ${o}</label>`).join("")}</div>`;
   });
  } else if(ex.type==="match"){
   // варианты показываем в перемешанном порядке: ответ вопроса i стоит на позиции it[2]
   const order=[];ex.items.forEach(x=>order[x[2]]=x[1][0]);
   ex.items.forEach((it,i)=>{
    out+=`<div class="q">${i+1}. ${it[0]}<br><select data-ex="${id}" data-i="${i}"><option value="">— выбери ответ —</option>${order.map((a,p)=>`<option value="${p}">${String.fromCharCode(65+p)}. ${a}</option>`).join("")}</select><span class="key" id="${id}_${i}"></span></div>`;
   });
  }
  out+=`<div class="res" id="${id}_res">Верно: 0 из ${ex.items.length}</div></div>`;
 });
 out+="</section>";app.insertAdjacentHTML("beforeend",out);
});
function norm(s){return s.trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?]+$/,"").replace(/\s+/g," ")}
document.addEventListener("change",ev=>{
 const el=ev.target,id=el.dataset.ex;if(!id)return;
 const st=states[id],i=+el.dataset.i,ex=st.ex,it=ex.items[i];let ok=false;
 if(ex.type==="text"){
  if(!el.value.trim())return;
  ok=it[1].map(norm).includes(norm(el.value));
  el.className=ok?"ok":"no";
  st.tries=st.tries||{};st.tries[i]=(st.tries[i]||0)+1;
  const k=document.getElementById(`${id}_${i}`);
  k.textContent=ok?"✓":(st.tries[i]>=2?"Правильно: "+it[1][0]:"Ещё раз");
  k.className="key"+(ok?" g":"");
 } else if(ex.type==="choice"){
  ok=+el.value===it[2];
  document.getElementById(`${id}_${i}_${el.value}`).classList.add(ok?"ok":"no");
 } else if(ex.type==="match"){
  if(el.value==="")return;
  ok=+el.value===it[2];el.className=ok?"ok":"no";
  const k=document.getElementById(`${id}_${i}`);k.textContent=ok?"✓":"Попробуй ещё";k.className="key"+(ok?" g":"");
 }
 if(ok)st.done[i]=1;
 const n=Object.keys(st.done).length;
 document.getElementById(id+"_res").textContent=`Верно: ${n} из ${ex.items.length}`+(n===ex.items.length?" ✓ Отлично!":"");
});
</script></body></html>
