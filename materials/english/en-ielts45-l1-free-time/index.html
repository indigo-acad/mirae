/* --- MCQ --- */
const MCQ={};
function mcq(id,items,host){
  const html=`${prev(id)}${items.map((it,i)=>`<div class="q" id="${id}-q${i}"><div class="s"><span class="n">${i+1}</span>${it.q.replace("___",'<span class="blank">___</span>')}</div>
    <div class="opts">${it.o.map((o,j)=>`<button onclick="answerMcq('${id}',${i},${j})">${o}</button>`).join("")}</div><div class="why hidden"></div></div>`).join("")}
  <div class="score" id="${id}-score"></div>`;
  host.insertAdjacentHTML("beforeend",html);
  MCQ[id]={items,ans:{}};
}
function answerMcq(id,i,j){
  const M=MCQ[id]; if(M.ans[i]!==undefined) return;
  M.ans[i]=j; const it=M.items[i]; const box=$(`${id}-q${i}`); const bs=box.querySelectorAll(".opts button");
  bs[it.a].classList.add("ok"); if(j!==it.a) bs[j].classList.add("bad");
  const w=box.querySelector(".why"); w.innerHTML=(j===it.a?"✅ ":"❌ ")+(it.why||(j===it.a?"Right!":"Answer: "+it.o[it.a])); w.classList.remove("hidden");
  if(Object.keys(M.ans).length===M.items.length){
    const ok=M.items.filter((x,k)=>M.ans[k]===x.a).length;
    $(`${id}-score`).textContent=`Score: ${ok} / ${M.items.length}`+(ok===M.items.length?" 🔥":"");
    setRes(id,ok,M.items.length,M.items.map((x,k)=>M.ans[k]!==x.a?`${x.q.replace(/<[^>]+>/g,"")} → "${x.o[M.ans[k]].replace(/<[^>]+>/g,"")}" (✓ ${x.o[x.a].replace(/<[^>]+>/g,"")})`:null).filter(Boolean));
  }
}
/* --- gaps: {answer|alt} --- */
const GAPS={};
function gaps(id,text,host,wide){
  let k=0; GAPS[id]=[];
  const t=text.replace(/\{([^}]+)\}/g,(m,a)=>{ const ans=a.split("|"); GAPS[id].push(ans);
    const w=wide?"":` style="width:${Math.max(90,Math.min(260,ans[0].length*11+30))}px"`;
    return `<input class="gap${wide?" wide":""}" id="${id}-g${k++}"${w} autocomplete="off" autocapitalize="off" spellcheck="false">`; });
  host.insertAdjacentHTML("beforeend",`${prev(id)}<div class="gaptext">${t}</div>
  <div class="actions"><button class="primary" onclick="checkGaps('${id}')">Check</button><button id="${id}-show" class="hidden" onclick="document.querySelectorAll('[id^=${id}-g]+.fix').forEach(x=>x.classList.remove('hidden'))">Show answers</button></div>
  <div class="score" id="${id}-score"></div>`);
}
function checkGaps(id){
  const A=GAPS[id]; let ok=0; const wrong=[];
  A.forEach((ans,i)=>{ const inp=$(`${id}-g${i}`); const old=inp.nextElementSibling; if(old&&old.classList.contains("fix")) old.remove();
    inp.classList.remove("ok","bad");
    if(match(inp.value,ans)){ok++;inp.classList.add("ok");}
    else{inp.classList.add("bad");inp.insertAdjacentHTML("afterend",`<span class="fix hidden">${esc(ans[0])}</span>`);wrong.push(`${i+1}) "${inp.value||"—"}" (✓ ${ans[0]})`);} });
  $(`${id}-score`).textContent=`Score: ${ok} / ${A.length}`+(ok===A.length?" 🔥":" · исправьте красные и нажмите Check ещё раз");
  $(`${id}-show`).classList.remove("hidden");
  if(!GAPS[id].done){ GAPS[id].done=1; setRes(id,ok,A.length,wrong); }   // засчитывается первая проверка; исправлять можно сколько угодно
}
/* --- word order --- */
const ORD={};
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function order(id,items,host){
  host.insertAdjacentHTML("beforeend",`${prev(id)}${items.map((o,i)=>`<div class="q"><div class="s"><span class="n">${i+1}</span><span class="built" id="${id}b${i}"></span></div><div class="pool" id="${id}p${i}"></div><div class="why hidden" id="${id}w${i}"></div></div>`).join("")}
  <div class="actions"><button class="primary" onclick="checkOrder('${id}')">Check</button></div><div class="score" id="${id}-score"></div>`);
  ORD[id]={items,st:items.map(o=>({pool:shuffle(o.w.map((w,k)=>({w,k}))),built:[]}))};
  items.forEach((o,i)=>drawOrd(id,i));
}
function drawOrd(id,i){
  const O=ORD[id].st[i];
  $(id+"b"+i).innerHTML=O.built.length?O.built.map((t,j)=>`<button class="tok on" onclick="ordMove('${id}',${i},${j},0)">${t.w}</button>`).join(""):'<span class="muted">…</span>';
  $(id+"p"+i).innerHTML=O.pool.map((t,j)=>`<button class="tok" onclick="ordMove('${id}',${i},${j},1)">${t.w}</button>`).join("");
}
function ordMove(id,i,j,pick){ const O=ORD[id].st[i]; if(pick) O.built.push(O.pool.splice(j,1)[0]); else O.pool.push(O.built.splice(j,1)[0]); drawOrd(id,i); }
function sentence(O){ let s=O.built.map(t=>t.w).join(" ").replace(/ \?$/,"?"); if(!/[?.]$/.test(s)) s+="."; return s.charAt(0).toUpperCase()+s.slice(1); }
function checkOrder(id){
  const D=ORD[id]; const left=D.items.map((o,i)=>D.st[i].pool.length?i+1:0).filter(Boolean);
  if(left.length){ $(id+"-score").textContent="Сначала соберите все предложения: "+left.join(", "); return; }
  let ok=0; const wrong=[];
  D.items.forEach((o,i)=>{ const s=sentence(D.st[i]); const good=match(s,o.a); const w=$(id+"w"+i);
    $(id+"b"+i).className="built "+(good?"good":"wrong");
    if(good) ok++; else wrong.push(`"${s}" (✓ ${o.a[0]})`);
    w.innerHTML=good?"✅ "+o.a[0]:"❌ "+o.a[0]; w.classList.remove("hidden"); });
  $(id+"-score").textContent=`Score: ${ok} / ${D.items.length}`+(ok===D.items.length?" 🔥":"");
  setRes(id,ok,D.items.length,wrong);
}

  card(`<h2>1 · Words: free time &amp; adventure</h2>
  <p>Read and listen. 🔊 — послушать слово. <span class="muted">Сначала просто прочитайте все слова, потом делайте упражнения.</span></p>
  <div class="sub">Leisure activities</div>
  <div class="words">${ACT.map(x=>`<div><button onclick="say('${x[1]}')">🔊</button><span class="emo" style="font-size:22px">${x[0]}</span><div><b>${x[1]}</b><span>${x[2]}</span></div></div>`).join("")}</div>
  <div class="sub">Holidays &amp; sport</div>
  <div class="words">${VOC.map(x=>`<div><button onclick="say('${x[0].replace(/ \(.*\)/,"").replace(/'/g,"")}')">🔊</button><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join("")}</div>
  <div class="tip">💡 Название занятия = глагол + <b>-ing</b>: cycle → cycl<b>ing</b>, hike → hik<b>ing</b>, swim → swim<b>ming</b>. Мы <b>go</b> cycling / go hiking / go sailing.</div>`);
  if(show("w_act")) mcq("w_act",W_ACT,card(`<div class="step">A</div><h2>What activity is it?</h2><p class="muted">Посмотрите на картинку и выберите слово.</p>`));
  if(show("w_mean")) mcq("w_mean",W_MEAN,card(`<div class="step">B</div><h2>What does it mean?</h2><p class="muted">Выберите перевод.</p>`));
  if(show("w_def")) mcq("w_def",W_DEF,card(`<div class="step">C</div><h2>Which word is it?</h2><p class="muted">Прочитайте объяснение по-английски и выберите слово.</p>`));
  if(show("w_gap")) gaps("w_gap",W_GAP,card(`<div class="step">D</div><h2>Fill in the gaps</h2><p class="muted">Word bank: ${W_BANK.map(b=>`<span class="pill">${b}</span>`).join(" ")}</p>`));
}

/* ---- 2. Reading ---- */
function rRead(){
  card(`<h2>2 · IELTS Reading (easy)</h2>
  <p>This is a short IELTS Academic-style text. <span class="muted">Короткий текст в формате IELTS Academic, только проще.</span></p>
  <div class="ru">Как делать: 1) быстро прочитайте текст (1–2 минуты), не переводите каждое слово; 2) прочитайте вопрос и найдите в нём <b>ключевое слово</b>; 3) найдите это место в тексте и прочитайте внимательно.</div>
  <div class="story">${TEXT}</div>`);
  if(show("r_tf")){ const c=card(`<div class="step">Questions 1–5</div><h2>TRUE / FALSE / NOT GIVEN</h2>
  <div class="tip" style="font-size:14.5px"><b>TRUE</b> — в тексте написано то же самое (другими словами).<br><b>FALSE</b> — в тексте написано наоборот.<br><b>NOT GIVEN</b> — в тексте про это ничего нет.</div>`);
    mcq("r_tf",R_TF.map(t=>({q:t.q,o:TF,a:t.a,why:t.why})),c); }
  if(show("r_match")) mcq("r_match",R_MATCH,card(`<div class="step">Questions 6–9</div><h2>Which paragraph, A, B, C or D?</h2>`));
  if(show("r_gap")) gaps("r_gap",R_GAP,card(`<div class="step">Questions 10–12</div><h2>Complete the sentences</h2><p>Write <b>ONE WORD ONLY</b> from the text. <span class="muted">Только одно слово из текста.</span></p>`));
}

/* ---- 3. Listening ---- */
let L4SEL=new Set();
function rListen(){
  card(`<h2>3 · 🎧 Listening</h2>
  <p>Two friends, <b>Deon</b> and <b>Mark</b>, are talking about an adventure holiday.</p>
  <div class="player"><audio id="aud" controls preload="metadata" src="${AUDIO}"></audio>
    <div><button class="sm" onclick="aud(-5)">⏪ 5 sec</button><button class="sm" onclick="rate(.8)">🐢 0.8×</button><button class="sm" onclick="rate(1)">1×</button></div>
    <div class="warn hidden" id="audErr">Аудио пока не загружено. Попросите преподавателя включить запись.</div></div>
  <div class="ru">Слушайте 2 раза: первый раз — просто понять, о чём разговор; второй раз — отвечать на вопросы.</div>`);
  const a=$("aud"); a.addEventListener("error",()=>$("audErr").classList.remove("hidden"));
  if(show("l4")){ L4SEL=new Set();
    card(`<div class="step">Ex 04</div><h2>Which activities do you hear?</h2><p class="muted">Нажмите на все занятия, которые звучат. Три слова — лишние.</p>${prev("l4")}
    <div class="opts" id="l4o">${L4_ALL.map((w,i)=>`<button onclick="l4t(${i},this)">${w}</button>`).join("")}</div>
    <div class="actions"><button class="primary" onclick="checkL4()">Check</button></div><div class="score" id="l4-score"></div>`); }
  if(show("l5")){ const c=card(`<div class="step">Ex 05</div><h2>Choose the correct answer, A, B or C</h2>
    <div class="q"><div class="s"><span class="n">0</span>When will Deon and Mark go on the adventure holiday? <b>A</b> June <b>B</b> July <b>C</b> August → <b>C</b></div></div>
    <div class="minitip"><b>MINI TIP 0.</b> Mark says he can't go on holiday in June or July because he has college → August.</div>
    <div class="minitip"><b>MINI TIP 1.</b> Deon says «a friend told me», which matches «someone he knows». Слушайте <b>смысл</b>, а не те же самые слова.</div>
    <div class="tip" style="font-size:14.5px">💡 В IELTS Listening вы часто слышите <b>все три</b> варианта, но правильный — только один.</div>`);
    mcq("l5",L5,c); }
}
function aud(s){ const a=$("aud"); a.currentTime=Math.max(0,a.currentTime+s); }
function rate(r){ $("aud").playbackRate=r; }
function l4t(i,b){ if(STATE.res.l4&&$("l4o").dataset.locked) return; if(L4SEL.has(i)) L4SEL.delete(i); else L4SEL.add(i); b.classList.toggle("on"); }
function checkL4(){
  const bs=$("l4o").querySelectorAll("button"); let ok=0; const wrong=[];
  L4_ALL.forEach((w,i)=>{ const yes=L4_YES.includes(w), sel=L4SEL.has(i); bs[i].classList.remove("on","ok","bad");
    if(yes===sel) ok++; else wrong.push(yes?`missed: ${w}`:`not in the recording: ${w}`);
    if(yes) bs[i].classList.add("ok"); else if(sel) bs[i].classList.add("bad"); });
  $("l4o").dataset.locked=1;
  $("l4-score").innerHTML=`Score: ${ok} / ${L4_ALL.length}`+`<div class="why">✅ You hear: ${L4_YES.join(", ")}.<br>Not in the recording: shopping, canoeing, reading.</div>`;
  setRes("l4",ok,L4_ALL.length,wrong);
}

/* ---- 4. Present Continuous step by step ---- */
function rPC(){
  card(`<div class="step">Шаг 1</div><h2>Что это такое? 🤔</h2>
  <p><b>Present Continuous</b> = действие происходит <b>прямо сейчас</b>, в процессе.</p>
  <div class="vs"><div>📸 Look! They <b class="pc">are hiking</b>. — Смотри! Они идут в поход (сейчас, на фото).</div>
  <div>📱 I <b class="pc">am reading</b> a book. — Я читаю книгу (сейчас, в эту минуту).</div></div>
  <div class="ru">В русском «я читаю» — одна форма и для «сейчас», и для «вообще». В английском их <b>две</b>:<br>
  <b>I read</b> books. — Я читаю книги (вообще, люблю, часто) → Present Simple.<br>
  <b>I am reading</b> a book. — Я читаю книгу (прямо сейчас) → Present Continuous.</div>
  <p>Слова-подсказки «сейчас»:</p>
  <div class="signals"><span>now</span><span>right now</span><span>at the moment</span><span>today</span><span>this week</span><span>Look!</span><span>Listen!</span></div>`);

  card(`<div class="step">Шаг 2</div><h2>Формула: два кусочка 🧩</h2>
  <div class="formula"><span>am / is / are</span> + <span class="ing">глагол + ing</span></div>
  <div class="warn">⚠️ Оба кусочка <b>обязательны</b>! Нет am/is/are — ошибка. Нет -ing — тоже ошибка.</div>
  <table class="tbl"><tr><th>Кто?</th><th>1-й кусочек</th><th>Пример</th></tr>
  <tr><td><b>I</b></td><td><b>am</b></td><td>I <b>am</b> read<b>ing</b>. (I'm reading)</td></tr>
  <tr><td><b>he / she / it</b><br><span class="muted">один человек или предмет</span></td><td><b>is</b></td><td>She <b>is</b> cook<b>ing</b>. (She's cooking)</td></tr>
  <tr><td><b>we / you / they</b><br><span class="muted">много</span></td><td><b>are</b></td><td>They <b>are</b> play<b>ing</b>. (They're playing)</td></tr></table>
  <div class="tip">💡 Подставляйте местоимение: <b>my mum</b> = she → is · <b>Tom and I</b> = we → are · <b>the children</b> = they → are.</div>`);
  if(show("pc_be")) mcq("pc_be",PC_BE,card(`<div class="step">Тренируем 1</div><h2>am, is or are?</h2><p class="muted">Только первый кусочек.</p>`));

  card(`<div class="step">Шаг 3</div><h2>Как добавить -ing ✍️</h2>
  <table class="tbl"><tr><th>Правило</th><th>Примеры</th></tr>
  <tr><td>1. Обычно просто <b>+ ing</b></td><td>read → reading · play → playing · go → going · wash → washing</td></tr>
  <tr><td>2. На конце <b>-e</b> → убираем e</td><td>make → making · ride → riding · live → living<br><span class="muted">Но: see → seeing, canoe → canoeing</span></td></tr>
  <tr><td>3. Короткое слово: согласная + гласная + согласная → <b>удваиваем</b> последнюю букву</td><td>run → running · swim → swimming · get → getting · begin → beginning</td></tr>
  <tr><td>4. <b>-ie</b> → y</td><td>lie → lying · die → dying</td></tr></table>`);
  if(show("pc_ing")) gaps("pc_ing",PC_ING.map((x,i)=>`<p>${i+1}. ${x[0]} → {${x[1]}}</p>`).join(""),card(`<div class="step">Тренируем 2</div><h2>Write the -ing form</h2><p class="muted">Ex 08 из учебника. Напишите форму с -ing.</p>`));

  card(`<div class="step">Шаг 4</div><h2>Собираем предложение 🧱</h2>
  <div class="formula"><span>Кто?</span> + <span>am / is / are</span> + <span class="ing">глагол-ing</span> + <span>остальное</span></div>
  <div class="vs"><div>I + am + read<b>ing</b> + a book → <b>I am reading a book.</b></div><div>My sister + is + swim<b>ming</b> + in the sea → <b>My sister is swimming in the sea.</b></div></div>
  <p>Короткие формы (так говорят чаще): <span class="pill">I'm</span> <span class="pill">he's</span> <span class="pill">she's</span> <span class="pill">it's</span> <span class="pill">we're</span> <span class="pill">you're</span> <span class="pill">they're</span></p>`);
  if(show("pc_aff")) gaps("pc_aff",PC_AFF,card(`<div class="step">Тренируем 3</div><h2>Complete the sentences</h2><p class="muted">Напишите оба кусочка: <i>is raining</i>, <i>am reading</i>…</p>`));

  card(`<div class="step">Шаг 5</div><h2>Отрицание: просто добавь not ❌</h2>
  <table class="tbl"><tr><th>Полная форма</th><th>Короткая</th></tr>
  <tr><td>I am <b>not</b> sleeping.</td><td>I'm not sleeping.</td></tr>
  <tr><td>She is <b>not</b> working.</td><td>She <b>isn't</b> working.</td></tr>
  <tr><td>They are <b>not</b> listening.</td><td>They <b>aren't</b> listening.</td></tr></table>
  <div class="warn">⚠️ Никаких don't / doesn't! <s>I don't sleeping</s> → I'm not sleeping.</div>`);
  if(show("pc_neg")) gaps("pc_neg",PC_NEG,card(`<div class="step">Тренируем 4</div><h2>Make it negative</h2><p class="muted">Можно полную форму (is not) или короткую (isn't).</p>`));

  card(`<div class="step">Шаг 6</div><h2>Вопрос: меняем местами ❓</h2>
  <div class="vs"><div>You <b>are</b> reading. → <b>Are</b> you reading?</div><div>She <b>is</b> sleeping. → <b>Is</b> she sleeping?</div>
  <div>Вопросительное слово — самое первое: <b>What</b> are you doing? · <b>Where</b> is he going?</div></div>
  <p>Короткий ответ — без глагола: <b>Yes, I am.</b> / <b>No, I'm not.</b> · <b>Yes, she is.</b> / <b>No, she isn't.</b></p>`);
  if(show("pc_q")) order("pc_q",PC_Q,card(`<div class="step">Тренируем 5</div><h2>Make questions</h2><p class="muted">Нажимайте на слова по порядку. Нажмите на слово в предложении, чтобы убрать его.</p>`));
  if(show("pc_short")) mcq("pc_short",PC_SHORT,card(`<div class="step">Тренируем 6</div><h2>Short answers</h2>`));

  card(`<div class="step">Шаг 7</div><h2>Три главные ловушки 🪤</h2>
  <div class="vs"><div>❌ <s>I reading.</s> → нет am → ✅ I <b>am</b> reading.</div><div>❌ <s>I am read.</s> → нет -ing → ✅ I am read<b>ing</b>.</div><div>❌ <s>Do you reading?</s> → вопрос через am/is/are → ✅ <b>Are</b> you reading?</div></div>`);
  if(show("pc_trap")) mcq("pc_trap",PC_TRAP,card(`<div class="step">Тренируем 7</div><h2>Find the correct sentence</h2>`));
  if(show("pc_photo")) gaps("pc_photo",PC_PHOTO,card(`<div class="step">Финал 🏁</div><h2>What's happening in the pictures?</h2><p class="muted">Опишите картинки: что происходит сейчас.</p>`));
}

/* ---- 5. Present Simple or Continuous ---- */
function rPS(){
  card(`<div class="step">Шаг 1</div><h2>Вспоминаем Present Simple 🔁</h2>
  <p><b>Present Simple</b> = обычно, регулярно, всегда; факты.</p>
  <table class="tbl"><tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr>
  <tr><td>+</td><td>I <b>play</b> tennis.</td><td>She <b>plays</b> tennis. <span class="muted">(+s!)</span></td></tr>
  <tr><td>−</td><td>I <b>don't</b> play.</td><td>She <b>doesn't</b> play. <span class="muted">(без s)</span></td></tr>
  <tr><td>?</td><td><b>Do</b> you play?</td><td><b>Does</b> she play?</td></tr></table>
  <div class="sub">Как добавить -s (he / she / it)</div>
  <table class="tbl"><tr><td>Обычно <b>+s</b></td><td>live → lives · run → runs · play → plays</td></tr>
  <tr><td>-sh, -ch, -ss, -x, -o → <b>+es</b></td><td>wash → washes · pass → passes · go → goes · watch → watches</td></tr>
  <tr><td>согласная + y → <b>-ies</b></td><td>carry → carries · cry → cries · study → studies</td></tr>
  <tr><td>гласная + y → просто +s</td><td>play → plays · enjoy → enjoys</td></tr></table>`);
  if(show("ps_s")) gaps("ps_s",PS_S.map((x,i)=>`<p>${i+1}. he / she ${x[0]} → {${x[1]}}</p>`).join(""),card(`<div class="step">Тренируем</div><h2>he / she / it: write the -s form</h2><p class="muted">Ex 08 из учебника, первая колонка.</p>`));

  card(`<div class="step">Шаг 2</div><h2>Главное различие ⚖️</h2>
  <div class="two"><div class="a"><b class="h ps">Present Simple</b>обычно, всегда, регулярно, факт<br><br><i>I <b>walk</b> to college every day.</i><br><i>She <b>usually gets up</b> at 7.</i>
    <div class="signals"><span>always</span><span>usually</span><span>often</span><span>sometimes</span><span>never</span><span>every day</span></div></div>
  <div class="b"><b class="h pc">Present Continuous</b>сейчас, в процессе, временно<br><br><i>Today I'<b>m taking</b> the bus.</i><br><i>Look! She'<b>s running</b>.</i>
    <div class="signals"><span>now</span><span>at the moment</span><span>today</span><span>this week</span><span>Look!</span><span>Listen!</span></div></div></div>
  <div class="ru">Спросите себя: <b>это привычка / факт?</b> → Simple. <b>Это происходит сейчас / временно?</b> → Continuous.<br>
  <i>I usually <b>walk</b> to college, but today I'<b>m taking</b> the bus.</i> — обычно хожу пешком, но сегодня еду на автобусе.</div>
  <div class="tip">📸 Описываете фото или картинку (IELTS Speaking, задания с картинками) → Continuous: <i>In this picture, the boys are riding horses.</i></div>`);
  if(show("ps_rule")) mcq("ps_rule",PS_RULE,card(`<div class="step">Ex 07</div><h2>Complete the rules: simple or continuous?</h2>`));

  if(show("ps_blog")){
    const c=card(`<div class="step">Шаг 3</div><h2>Read the blog 📝</h2>
    <p class="muted">Прочитайте блог. Для каждого выделенного глагола выберите: Present Simple (+ или −) или Present Continuous (+ или −).</p>
    <div class="story">${BLOG}</div>${prev("ps_blog")}
    ${PS_BLOG.map((x,i)=>`<div class="cls" id="bl${i}"><span class="v">${i+1}. ${x[0]}</span>${CLS_OPT.map((o,j)=>`<button onclick="cls(${i},${j})">${o}</button>`).join("")}</div>`).join("")}
    <div class="score" id="ps_blog-score"></div>`);
    CLS={};
  }
  if(show("ps_state")){
    card(`<div class="step">Шаг 4</div><h2>Глаголы-«состояния» 💭</h2>
    <p>Эти глаголы описывают <b>чувства и мысли</b>, а не действия. Им <b>не нужно -ing</b>, даже если «сейчас»:</p>
    <div class="signals"><span>like</span><span>love</span><span>hate</span><span>want</span><span>need</span><span>know</span><span>think (= считаю)</span><span>believe</span><span>understand</span><span>prefer</span></div>
    <div class="vs"><div>❌ <s>I'm liking this song.</s> → ✅ I <b>like</b> this song.</div><div>❌ <s>People are believing…</s> → ✅ People <b>believe</b>…</div></div>
    <div class="warn">Это частая ошибка в IELTS Writing! Проверяйте: like, want, know, think, believe — без -ing.</div>`);
    mcq("ps_state",PS_STATE,card(`<div class="step">Тренируем</div><h2>Choose the correct form</h2>`));
  }
  if(show("ps_qa")) mcq("ps_qa",PS_QA,card(`<div class="step">Шаг 5 · Ex 09</div><h2>Questions: do or be?</h2>
    <div class="two"><div class="a"><b class="h ps">Simple</b><b>Do</b> you usually get up early? — Yes, I <b>do</b>.</div><div class="b"><b class="h pc">Continuous</b><b>Are</b> you enjoying it? — Yes, I <b>am</b>.</div></div>
    <p class="muted">Подберите ответ A–D к каждому вопросу, потом закончите правила 5–6.</p>`));
  if(show("ps_mix")) mcq("ps_mix",PS_MIX,card(`<div class="step">Шаг 6</div><h2>Simple or Continuous? 🎯</h2><p class="muted">Ищите слова-подсказки!</p>`));
  if(show("ps_write")) gaps("ps_write",PS_WRITE,card(`<div class="step">Шаг 7 · Ex 11</div><h2>Write the questions</h2><p class="muted">Напишите вопрос полностью. Потом задайте эти вопросы партнёру или преподавателю и ответьте на них.</p>`),true);
}
let CLS={};
function cls(i,j){
  if(CLS[i]!==undefined) return; CLS[i]=j; const a=PS_BLOG[i][1]; const bs=$("bl"+i).querySelectorAll("button");
  bs[a].classList.add("ok"); if(j!==a) bs[j].classList.add("bad");
  if(Object.keys(CLS).length===PS_BLOG.length){
    const ok=PS_BLOG.filter((x,k)=>CLS[k]===x[1]).length;
    $("ps_blog-score").textContent=`Score: ${ok} / ${PS_BLOG.length}`+(ok===PS_BLOG.length?" 🔥":"");
    setRes("ps_blog",ok,PS_BLOG.length,PS_BLOG.map((x,k)=>CLS[k]!==x[1]?`${x[0]} → ${CLS_OPT[CLS[k]]} (✓ ${CLS_OPT[x[1]]})`:null).filter(Boolean));
  }
}

/* ---- 6. Book ---- */
function rBook(){
  card(`<h2>📘 Coursebook &amp; workbook</h2><p class="muted">Упражнения из учебника и рабочей тетради. Ставьте глагол в Present Simple или Present Continuous.</p>`);
  if(show("b10")) gaps("b10",B10,card(`<div class="step">Ex 10</div><h2>Conversations</h2><p class="muted">Complete the sentences using the verbs in brackets in the correct form.</p>`));
  if(show("b3")) gaps("b3",B3,card(`<div class="step">Ex 3</div><h2>Present simple or present continuous?</h2>`));
  if(show("b4")) gaps("b4",B4,card(`<div class="step">Ex 4</div><h2>IELTS mistakes ⚠️</h2><p>IELTS candidates often make mistakes with these tenses. Find and correct them.</p>`));
  if(show("wb1")) gaps("wb1",WB1,card(`<div class="step">Workbook · Ex 1</div><h2>Find the mistake</h2>`));
  if(show("wb2")) gaps("wb2",WB2,card(`<div class="step">Workbook · Ex 2</div><h2>Life in Buenos Aires</h2><p class="muted">Word bank: ${WB2_BANK.map(b=>`<span class="pill">${b}</span>`).join(" ")}</p>`));
}

/* ---- Send ---- */
function rSend(){
  const rows=ALL_EX().map(k=>{ const r=STATE.res[k]; return `<tr><td>${NAMES[k]}</td><td style="text-align:right">${r?`<b>${r.score} / ${r.total}</b>`:'<span class="muted">not done</span>'}</td></tr>`; }).join("");
  card(`<h2>🚀 Send to your teacher</h2>
  <table class="res">${rows}</table>
  <div class="actions"><button class="primary" id="sendBtn" onclick="sendResults()">Send results 📩</button>
  <button class="sm" onclick="if(confirm('Start again from zero?')){STATE={name:STATE.name,res:{},done:{}};save();go(TABS[0].id)}">Reset</button></div>
  <div class="feedback" id="sendFb"></div><textarea id="copyBox" class="hidden" readonly style="min-height:200px"></textarea>`);
}
function buildReport(){
  let t=`🏕 <b>${TITLE}</b>\n👤 <b>${esc(STATE.name)}</b>\n🕒 ${new Date().toLocaleString("ru-RU")}\n`; let tot=0,max=0;
  ALL_EX().forEach(k=>{ const r=STATE.res[k]; if(!r){t+=`\n▫️ ${NAMES[k]}: —`;return;}
    tot+=r.score; max+=r.total; t+=`\n${r.score===r.total?"✅":"🔸"} <b>${NAMES[k]}: ${r.score}/${r.total}</b>`; r.wrong.forEach(w=>t+=`\n   • ${esc(w)}`); });
  t+=`\n\n<b>Total: ${tot}/${max}</b>`;
  return t;
}
function chunks(text){ const out=[]; let c=""; text.split("\n").forEach(l=>{ if((c+"\n"+l).length>3800){out.push(c);c=l;} else c=c?c+"\n"+l:l; }); if(c)out.push(c); return out; }
async function sendResults(){
  const text=buildReport(); $("sendBtn").disabled=true; $("sendFb").textContent="Sending…";
  try{ for(const part of chunks(text)){ const r=await fetch("https://api.telegram.org/bot"+TG_TOKEN+"/sendMessage",{method:"POST",body:new URLSearchParams({chat_id:TG_CHAT_ID,text:part,parse_mode:"HTML"})}); const j=await r.json(); if(!j.ok) throw new Error(j.description); }
    $("sendFb").textContent="✅ Sent! Well done!"; $("sendBtn").disabled=false; }
  catch(e){ $("sendBtn").disabled=false; $("sendFb").textContent="Couldn't send ("+e.message+"). Copy the text and send it to your teacher:"; const b=$("copyBox"); b.value=plain(text); b.classList.remove("hidden"); b.select(); }
}

load(); if(STATE.name) $("nameInput").value=STATE.name;
$("nameInput").addEventListener("keydown",e=>{ if(e.key==="Enter") start(); });
if(window.MIRAE&&MIRAE.user){ $("nameInput").value=MIRAE.user; start(); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"){ clearTimeout(liveTm); saveLive(); } });
addEventListener("pagehide",()=>saveLive());
</script>
