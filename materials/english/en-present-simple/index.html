<script>
const NV=["нужен: глагола нет","не нужен: глагол уже есть"];
const STEPS=[
{t:"Шаг 1. am / is / are",
h:`<p>В английском в каждом предложении нужен глагол. В русском мы говорим «Я студент» без глагола, а в английском нужно <b>to be</b> («быть»).</p>
<table><tr><th>Кто</th><th>Глагол</th><th>Пример</th></tr>
<tr><td>I</td><td><b>am</b></td><td>I am a student.</td></tr>
<tr><td>he / she / it</td><td><b>is</b></td><td>She is from Italy.</td></tr>
<tr><td>you / we / they</td><td><b>are</b></td><td>They are friends.</td></tr></table>
<div class="ex"><span class="tag">Запомните</span><b>Если в предложении уже есть обычный глагол</b> (live, work, study, like), am / is / are не ставим: <span class="good">I live here.</span> <span class="bad">I am live here.</span><br><b>Если другого глагола нет</b> (мы говорим, кто человек, какой он или где он), ставим am / is / are: <span class="good">I am a student. · She is tired. · They are at home.</span></div>
<h3>Отрицание: добавляем not</h3>
<div class="ex">I am <b>not</b> a student. · He is <b>not</b> (isn’t) a student. · They are <b>not</b> (aren’t) students.</div>
<h3>Вопрос: меняем местами</h3>
<div class="ex">You are a student. → <b>Are you</b> a student?<br>She is a doctor. → <b>Is she</b> a doctor?</div>
<p>Ответ: <b>Yes, I am. / No, she isn’t.</b></p>`,
ex:[
{n:"Практика 1.1: вставьте am, is или are",g:[
["I {} a student.",["am"]],["She {} from Italy.",["is"]],["We {} friends.",["are"]],["My parents {} at home.",["are"]],
["It {} cold today.",["is"]],["You {} late.",["are"]],["Giorgio {} a student.",["is"]],["Anna and Tom {} teachers.",["are"]]]},
{n:"Практика 1.2: сделайте отрицание или вопрос",g:[
["I am a student. → I {} a student. (not)",["am not"]],["She is tired. → She {} tired. (not)",["is not","isn't"]],
["They are at home. → They {} at home. (not)",["are not","aren't"]],["You are a student. → {} you a student?",["are"]],
["He is a doctor. → {} he a doctor?",["is"]],["Where {} the accommodation?",["is"]]]}]},
{t:"Шаг 2. Другие глаголы: live, work, want",
h:`<p>Это обычные глаголы действия. Глагол уже есть, поэтому <b>am / is / are не нужны</b>.</p>
<table><tr><th>Кто</th><th>Глагол</th><th>Пример</th></tr>
<tr><td>I / you / we / they</td><td>live</td><td>I live with my parents.</td></tr>
<tr><td>he / she / it</td><td>live<b>s</b></td><td>She lives in Rome.</td></tr></table>
<h3>Как добавлять -s</h3>
<ul><li>обычно +s: work → <b>works</b>, want → <b>wants</b></li>
<li>-ch, -sh, -s, -x, -o → +es: watch → <b>watches</b>, go → <b>goes</b></li>
<li>согласная + y → -ies: study → <b>studies</b></li>
<li>have → <b>has</b></li></ul>`,
ex:[{n:"Практика 2.1: поставьте глагол в нужную форму",g:[
["I {} with my parents. (live)",["live"]],["He {} in Rome. (live)",["lives"]],["She {} English. (study)",["studies"]],
["We {} to study. (want)",["want"]],["My brother {} in a shop. (work)",["works"]],["They {} Italian. (speak)",["speak"]],
["Giorgio {} TV. (watch)",["watches"]],["The teacher {} home at five. (go)",["goes"]]]}]},
{t:"Шаг 3. do / does / don’t / doesn’t",
h:`<p>С обычными глаголами отрицание и вопрос делаются через <b>do</b> или <b>does</b>.</p>
<table><tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td>−</td><td>I <b>don’t</b> live here.</td><td>She <b>doesn’t</b> live here.</td></tr>
<tr><td>?</td><td><b>Do</b> you live here?</td><td><b>Does</b> she live here?</td></tr></table>
<div class="ex"><span class="tag">Главное</span>После does / doesn’t глагол <b>без -s</b>: <span class="good">Does she live…?</span> <span class="bad">Does she lives…?</span><br>-s уже стоит в does.</div>
<h3>Порядок с вопросительным словом</h3>
<div class="ex">Where <b>do</b> you <b>live</b>? · What <b>does</b> he <b>want</b> to study?</div>`,
ex:[
{n:"Практика 3.1: do, does, don’t или doesn’t",g:[
["{} you live with your parents?",["do"]],["{} he want to study?",["does"]],["She {} live in London.",["doesn't","does not"]],
["I {} speak French.",["don't","do not"]],["{} your sister work?",["does"]],["They {} like coffee.",["don't","do not"]]]},
{n:"Практика 3.2: выберите правильную форму глагола",m:[
["Does she … here?",["live","lives"],0],["He doesn’t … on Sunday.",["works","work"],1],["Do they … English?",["speaks","speak"],1],["What does Giorgio …?",["want","wants"],0]]}]},
{t:"Шаг 4. Be или Do? Почему нельзя «I am live»",
h:`<div class="ex"><span class="tag">Проверка</span>Найдите глагол в предложении.<br><b>Глагол есть</b> (live, work, play, like…) → am / is / are <b>не ставим</b>: <span class="good">I live here.</span><br><b>Глагола нет</b> → am / is / are <b>обязательны</b>: <span class="good">I am a student.</span></div>
<p>Профессия, возраст, страна, чувства (student, 20, from Italy, tired) глаголами не являются, поэтому с ними нужен be.</p>
<p><b>Простое правило:</b> если в предложении уже есть обычный глагол (live, work, play, like), нельзя добавлять am / is / are. Если обычного глагола нет, am / is / are нужны, чтобы связать человека с профессией, состоянием или местом: <b>She is a teacher. / She is happy. / She is at home.</b></p>
<p><b>Важно:</b> can тоже само образует вопрос и отрицание, поэтому рядом с can не добавляем am / is / are или do / does: <b>Can you swim? · I can’t swim.</b></p>
<table><tr><th>Какой глагол</th><th>Что используем</th></tr>
<tr><td><b>to be</b> (am / is / are)</td><td>вопрос и отрицание делаем самим be, без do<br><span class="good">Are you a student?</span> <span class="bad">Do you a student?</span></td></tr>
<tr><td>другой глагол (live, work, want)</td><td>нужен do / does<br><span class="good">Do you live here?</span> <span class="bad">Are you live here?</span></td></tr></table>
<div class="ex"><span class="tag">Почему</span><span class="bad">I am live in Rome.</span> Здесь два глагола: <b>am</b> и <b>live</b>. Нужен один: <span class="good">I live in Rome.</span> Или: <span class="good">I am in Rome.</span></div>`,
ex:[
{n:"Практика 4.1: выберите верное предложение",m:[
["",["I am live in Rome.","I live in Rome."],1],["",["Are you a student?","Do you a student?"],0],
["",["Does he is a teacher?","Is he a teacher?"],1],["",["Do you live with your parents?","Are you live with your parents?"],0],
["",["She doesn’t live here.","She isn’t live here."],0],["",["He is not a doctor.","He doesn’t a doctor."],0]]},
{n:"Практика 4.2: am / is / are или do / does?",g:[
["{} you a student?",["are"]],["{} you live here?",["do"]],["Where {} the accommodation?",["is"]],["Where {} you live?",["do"]],
["What {} she want to study?",["does"]],["He {} not a teacher.",["is"]],["I {} not like tea.",["do"]],["They {} my friends.",["are"]]]},
{n:"Практика 4.3: нужен ли am / is / are?",m:[
["They happy.",NV,0],["They play football.",NV,1],["She at home.",NV,0],["She likes music.",NV,1],["We study English.",NV,1],["My brother a doctor.",NV,0]]},
{n:"Практика 4.4: выберите правильный вариант",m:[
["",["I am work in a café.","I work in a café."],1],
["",["He is hungry.","He hungry."],0],
["",["We are live in Stockholm.","We live in Stockholm."],1],
["",["My sister is a student.","My sister does a student."],0],
["",["They are at university.","They do at university."],0],
["",["She likes music.","She is likes music."],0]]}]},
{t:"Шаг 5. can: «могу, умею»",
h:`<p><b>can</b> значит «могу, умею». Это вспомогательный глагол, поэтому am / is / are и do / does рядом с ним <b>не нужны</b>.</p>
<table><tr><th></th><th>Схема</th><th>Пример</th></tr>
<tr><td>+</td><td>подлежащее + can + глагол</td><td>I can speak English.<br>She can speak English.</td></tr>
<tr><td>−</td><td>can’t / cannot + глагол</td><td>He can’t swim.</td></tr>
<tr><td>?</td><td>Can + подлежащее + глагол?</td><td>Can you speak English?</td></tr></table>
<p>Ответ: <b>Yes, I can. / No, I can’t.</b></p>
<div class="ex"><span class="tag">Главное</span>can одинаковый для всех, без -s. Следующий глагол стоит без to и без -s.<br><span class="good">She can speak.</span> <span class="bad">She cans speak. · She can speaks. · Do you can speak? · I am can swim.</span></div>`,
ex:[
{n:"Практика 5.1: can, can’t или глагол",g:[
["I {} speak English very well. (can)",["can"]],["He {} swim. (not can)",["can't","cannot"]],["{} you speak English?",["can"]],
["She can {} the guitar. (play)",["play"]],["We {} use Wi-Fi on campus. (can)",["can"]],["Can he {} to the party? (come)",["come"]],["They {} drive. (not can)",["can't","cannot"]]]},
{n:"Практика 5.2: выберите верное предложение",m:[
["",["She cans speak French.","She can speak French."],1],["",["Do you can swim?","Can you swim?"],1],["",["He can’t drive.","He can’t to drive."],0],
["",["I am can swim.","I can swim."],1],["",["She can speaks English.","She can speak English."],1]]},
{n:"Практика 5.3: составьте вопрос или отрицание с can",g:[
["{} you play the piano? (вопрос)",["can"]],
["He {} speak Spanish. (отрицание)",["can't","cannot"]],
["{} your sister drive? (вопрос)",["can"]],
["We {} come tomorrow. (отрицание)",["can't","cannot"]],
["My friends {} cook very well. (can)",["can"]],
["She can {} very fast. (run)",["run"]]]}]},
{t:"Шаг 6. Когда используем Present Simple",
h:`<table><tr><th>Для чего</th><th>Пример</th></tr>
<tr><td>Привычки, регулярные действия</td><td>I drink tea every morning.</td></tr>
<tr><td>Факты, которые всегда верны</td><td>Water boils at 100°C.</td></tr>
<tr><td>Постоянная ситуация</td><td>I live with my parents.</td></tr>
<tr><td>Расписание</td><td>The lesson starts at six.</td></tr></table>
<h3>Слова-подсказки</h3>
<p>always · usually · often · sometimes · never · every day · on Mondays</p>
<div class="ex">После <b>be</b>: She is <b>always</b> late.<br>Перед другим глаголом: I <b>usually</b> get up at seven.</div>
<p>Если действие идёт прямо сейчас («Смотри, он бежит»), нужно другое время, Present Continuous. Его мы пройдём позже.</p>`,
ex:[{n:"Практика 6.1: что выражает предложение?",m:[
["Water boils at 100°C.",["привычка","факт","расписание"],1],["My lesson starts at 6 p.m.",["привычка","факт","расписание"],2],["I drink tea every morning.",["привычка","факт","расписание"],0]]},
{n:"Практика 6.2: где стоит always / usually",m:[
["",["She is always late.","She always is late."],0],["",["I get usually up at seven.","I usually get up at seven."],1]]}]},
{t:"Шаг 7. Всё вместе",
h:`<p>Диалог Giorgio и Andrew Taylor из учебника. В каждом пропуске решите: <b>be</b> или <b>do / does</b>, и нужна ли форма с -s.</p>`,
ex:[{n:"Практика 7.1: смешанные задания",g:[
["{} you a student?",["are"]],["I {} with my parents. (live)",["live"]],["Where {} the accommodation?",["is"]],["What {} you want to study?",["do"]],
["Anna {} live alone. (negative)",["doesn't","does not"]],["{} Giorgio speak English?",["does"]],["My parents {} at home.",["are"]],
["He {} Business. (study)",["studies"]],["I {} tired. (not)",["am not"]],["She {} to live in the UK. (not / want)",["doesn't want","does not want"]]]},
{n:"Практика 7.2 (учебник, упр. 16): диалог Giorgio и Andrew Taylor",
p:`<p>Выберите для каждого пропуска реплику A–H. Одна реплика уже дана как пример. Как в тесте, <b>ответов больше, чем пропусков</b>: две реплики лишние, выбирайте лучшую по смыслу. Обратите внимание на can: you can bring, you can study.</p>
<div class="q">Andrew: “Do you have another question you want to ask me?”<br>Giorgio <b>1</b>: <b>D</b> (пример)</div>`,
s:["Oh, great. Do the rooms on campus also have TVs?","Really? I like the idea of having a roommate.","It’s important to me to have a shower in the room.","Yes. Is the Wi-Fi connection better on campus or in the private house?","Yes, but I prefer to study alone. Oh, I don’t know what to choose.","Yes, that’s a good idea. They always give me good advice.","Oh, that’s good to know. I really like playing online games, you see.","My room in my parents’ house is on the second floor."],
x:[["I think the house has superfast broadband. The Wi-Fi is sometimes very busy and slow on campus.","You also have a TV in the private room, so you can connect your computer and play games on the TV.","G"],
["You also have a TV in the private room, so you can connect your computer and play games on the TV.","No, but you or your roommate can bring one.","A"],
["No, but you or your roommate can bring one.","Yes, it’s good because you can study together.","B"],
["Yes, it’s good because you can study together.","Would you like to discuss everything with your parents?","E"],
["Would you like to discuss everything with your parents?","OK. Let me email you some information. You can contact me again after you read it.","F"]]},
{n:"Практика 7.3 (учебник, упр. 06): перепишите предложения в вопросительной форме",g:[
["Сделайте вопрос: It is okay to come to your house this evening. → {}",["Is it okay to come to your house this evening?"]],
["Сделайте вопрос: You can check that the windows are all closed before we go out. → {}",["Can you check that the windows are all closed before we go out?"]],
["Сделайте вопрос: You are in the living room next to the kitchen. → {}",["Are you in the living room next to the kitchen?"]],
["Сделайте вопрос: You want to sit in the garden. → {}",["Do you want to sit in the garden?"]],
["Сделайте вопрос: The apartments in the UK are very different from the apartments in your country. → {}",["Are the apartments in the UK very different from the apartments in your country?"]]]},
{n:"Практика 7.4 (учебник, упр. 07): найдите ошибку и перепишите правильно. Если ошибки нет, напишите correct",g:[
["1. In my country, people live usually in apartments and not houses. → {}",["In my country, people usually live in apartments and not houses."]],
["2. My uncle keeps his car always in the garage because it is very expensive. → {}",["My uncle always keeps his car in the garage because it is very expensive."]],
["3. Our sink sometimes makes a very strange noise. → {}",["correct"]],
["4. I have a housemate but I don’t see very often him – he is always studying. → {}",["I have a housemate but I don’t see him very often – he is always studying."]],
["5. In your country, do people usually celebrate their 18th birthday with a party? → {}",["correct"]],
["6. Do you prefer to do your homework in your bedroom? → {}",["correct"]]]},
{n:"Практика 7.5 (учебник, упр. 08): расставьте слова в правильном порядке",p:`<p>В первом наборе не хватает слова <b>do</b>: добавьте его сами.</p>`,g:[
["does / he / washing / never / up / the → {}",["Does he never do the washing up?"]],
["me / advice / you / some / give / can / ? → {}",["Can you give me some advice?"]],
["eight / house / leave / morning / the / I / in / always / at / my / o’clock → {}",["I always leave my house at eight o’clock in the morning."]],
["off / time / your / does / what / alarm / go / usually / ? → {}",["What time does your alarm usually go off?"]],
["often / dinner / house / my / comes / to / cousin / for / my → {}",["My cousin often comes to my house for dinner."]],
["live / future / do / the / where / to / in / want / you / ? → {}",["Where do you want to live in the future?"]],
["live / how / you / do / with / people / many / ? → {}",["How many people do you live with?"]],
["on / campus / live / you / do / university / the → {}",["Do you live on the university campus?"]]]}],
f:`<div class="blk"><h3>Практика 7.6: расскажите о себе (устно или письменно)</h3>
<p>Составьте 5 предложений: 2 с <b>am / is / are</b> и 3 с другим глаголом.</p>
<div class="ex">I am Giorgio. I am from Italy. I live with my parents. I study Business. I don’t speak French.</div>
<ul><li>В предложениях с be нет лишнего глагола?</li><li>Для he / she есть -s?</li><li>После don’t / doesn’t глагол без -s?</li></ul>
<p>Это тот же ответ, который просят на IELTS Speaking Part 1: “Do you work or study?”</p></div>`}
];

const cN="#1E2A56",cG="#D4AF7C",cF="#EFE3CC",cS="#F3DFC8",cI="#F8F7F2";
const svgW=(inner)=>`<svg viewBox="0 0 640 220" role="img" aria-hidden="true"><rect width="640" height="220" fill="${cI}"/><g stroke="${cN}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" font-family="Inter,sans-serif">${inner}</g></svg>`;

 return `<path d="M${x-32} ${y+100}q0-58 32-58t32 58z" fill="${body}"/>`
