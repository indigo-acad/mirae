/* ---------- CHART DATA ---------- */
const PIE_YOUNG=[47,50,3], PIE_TEEN=[35,61,4];
const PIE_LBL=["Very happy","Fairly happy","Unhappy"], PIE_COL=["#4b3f7a","#a996d8","#e2dbf3"];
const AGES_BAR=["15–24","25–34","35–44","45–54","55–64","65–74","75+"];
const HEALTH=[12,20,24,32,42,46,45], MONEY=[55,52,38,36,22,18,6];
const AGES_LINE=["15–20","21–30","31–40","41–50","51–60","61–70"];
const MALE=[5.5,5.2,5.1,5.0,5.2,5.6], FEMALE=[5.3,5.2,5.1,5.0,5.2,5.6];

function pieSVG(title,v){
  const cx=110,cy=105,r=85; let a=-Math.PI/2, s="";
  v.forEach((p,i)=>{ const b=a+2*Math.PI*p/100, big=p>50?1:0;
    s+=`<path d="M${cx},${cy} L${cx+r*Math.cos(a)},${cy+r*Math.sin(a)} A${r},${r} 0 ${big} 1 ${cx+r*Math.cos(b)},${cy+r*Math.sin(b)} Z" fill="${PIE_COL[i]}" stroke="#fff" stroke-width="2"/>`;
    const m=(a+b)/2, small=p<8, rr=small?r+13:r*.58;
    s+=`<text x="${cx+rr*Math.cos(m)}" y="${cy+rr*Math.sin(m)+5}" text-anchor="middle" font-size="15" font-weight="700" fill="${small||i===2?"#333":i===1?"#1a1440":"#fff"}">${p}%</text>`;
    a=b; });
  return `<svg viewBox="0 0 220 232" style="max-width:250px;width:100%"><text x="110" y="12" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2040">${title}</text><g transform="translate(0,28)">${s}</g></svg>`;
}
function pieLegend(){ return `<div class="legend">${PIE_LBL.map((l,i)=>`<span><i style="background:${PIE_COL[i]}"></i>${l}</span>`).join("")}</div>`; }
function piesHTML(){ return `<div class="chart"><div class="pies">${pieSVG("Parents with very young children",PIE_YOUNG)}${pieSVG("Parents with teenage children",PIE_TEEN)}</div>${pieLegend()}</div>`; }

function barSVG(){
  const W=640,H=310,L=48,B=250,T=20,max=60,gw=(W-L-10)/7, y=v=>B-(B-T)*v/max; let s="";
  for(let v=0;v<=60;v+=10) s+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e5ee"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="16" fill="#666">${v}%</text>`;
  AGES_BAR.forEach((g,i)=>{ const x=L+i*gw+gw*.15, bw=gw*.33;
    s+=`<rect x="${x}" y="${y(HEALTH[i])}" width="${bw}" height="${B-y(HEALTH[i])}" fill="#2f8fc8"/><rect x="${x+bw}" y="${y(MONEY[i])}" width="${bw}" height="${B-y(MONEY[i])}" fill="#c4458f"/>`;
    s+=`<text x="${x+bw}" y="${B+22}" text-anchor="middle" font-size="17" font-weight="600" fill="#333">${g}</text>`; });
  s+=`<text x="${L+(W-L)/2}" y="${B+48}" text-anchor="middle" font-size="17" fill="#333">age</text>`;
  return `<div class="chart"><div class="ct">What would make you happiest?</div><svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>
  <div class="legend"><span><i style="background:#2f8fc8"></i>health</span><span><i style="background:#c4458f"></i>money</span><span class="muted" style="font-size:12px">Source: British Household Panel Survey</span></div></div>`;
}
function lineSVG(){
  const W=640,H=310,L=48,B=250,T=20,lo=4.9,hi=5.7,gw=(W-L-60)/5, y=v=>B-(B-T)*(v-lo)/(hi-lo), x=i=>L+20+i*gw; let s="";
  for(let k=0;k<=8;k++){ const v=lo+k*.1; s+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e5ee"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="16" fill="#666">${v.toFixed(1)}</text>`; }
  AGES_LINE.forEach((g,i)=>s+=`<text x="${x(i)}" y="${B+22}" text-anchor="middle" font-size="17" font-weight="600" fill="#333">${g}</text>`);
  s+=`<polyline points="${FEMALE.map((v,i)=>x(i)+","+y(v)).join(" ")}" fill="none" stroke="#c4458f" stroke-width="3"/>`;
  s+=`<polyline points="${MALE.map((v,i)=>x(i)+","+y(v)).join(" ")}" fill="none" stroke="#2f6fe4" stroke-width="3" stroke-dasharray="${"0"}"/>`;
  s+=`<text x="${L+6}" y="${T+14}" font-size="16" fill="#666">score on a 1–7 scale</text><text x="${L+(W-L)/2}" y="${B+48}" text-anchor="middle" font-size="17" fill="#333">Age</text>`;
  return `<div class="chart"><div class="ct">How satisfied are you with your life?</div><svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>

/* --- MCQ --- */
const MCQ={};
function mcq(id,items,host){
  const html=`${prev(id)}${items.map((it,i)=>`<div class="q" id="${id}-q${i}"><div class="s"><span class="n">${i+1}</span>${it.q.replace("___",'<span class="blank">___</span>')}</div>
    <div class="opts">${it.o.map((o,j)=>`<button onclick="answerMcq('${id}',${i},${j})">${o}</button>`).join("")}</div><div class="why hidden"></div></div>`).join("")}
  <div class="score" id="${id}-score"></div>`;
  host.insertAdjacentHTML("beforeend",html);
  MCQ[id]={items,ans:{}};
}
function answerMcq(id,i,j){
  const M=MCQ[id]; if(M.ans[i]!==undefined) return;
  M.ans[i]=j; const it=M.items[i]; const box=$(`${id}-q${i}`); const bs=box.querySelectorAll(".opts button");
  bs[it.a].classList.add("ok"); if(j!==it.a) bs[j].classList.add("bad");
  const w=box.querySelector(".why"); w.innerHTML=(j===it.a?"✅ ":"❌ ")+(it.why||(j===it.a?"Right!":"Answer: "+it.o[it.a])); w.classList.remove("hidden");
  if(Object.keys(M.ans).length===M.items.length){
    const ok=M.items.filter((x,k)=>M.ans[k]===x.a).length;
    $(`${id}-score`).textContent=`Score: ${ok} / ${M.items.length}`+(ok===M.items.length?" 🔥":"");
    setRes(id,ok,M.items.length,M.items.map((x,k)=>M.ans[k]!==x.a?`${x.q.replace(/<[^>]+>/g,"")} → "${x.o[M.ans[k]].replace(/<[^>]+>/g,"")}" (✓ ${x.o[x.a].replace(/<[^>]+>/g,"")})`:null).filter(Boolean));
  }
}
/* --- gaps: {answer|alt} --- */
const GAPS={};
function gaps(id,text,host,wide){
  let k=0; GAPS[id]=[];
  const t=text.replace(/\{([^}]+)\}/g,(m,a)=>{ const ans=a.split("|"); GAPS[id].push(ans);
    const w=wide?"":` style="width:${Math.max(90,Math.min(260,ans[0].length*11+30))}px"`;
    return `<input class="gap${wide?" wide":""}" id="${id}-g${k++}"${w} autocomplete="off" autocapitalize="off" spellcheck="false">`; });
  host.insertAdjacentHTML("beforeend",`${prev(id)}<div class="gaptext">${t}</div>
  <div class="actions"><button class="primary" onclick="checkGaps('${id}')">Check</button><button id="${id}-show" class="hidden" onclick="document.querySelectorAll('[id^=${id}-g]+.fix').forEach(x=>x.classList.remove('hidden'))">Show answers</button></div>
  <div class="score" id="${id}-score"></div>`);
}
function checkGaps(id){
  const A=GAPS[id]; let ok=0; const wrong=[];
  A.forEach((ans,i)=>{ const inp=$(`${id}-g${i}`); const old=inp.nextElementSibling; if(old&&old.classList.contains("fix")) old.remove();
    inp.classList.remove("ok","bad");
    if(match(inp.value,ans)){ok++;inp.classList.add("ok");}
    else{inp.classList.add("bad");inp.insertAdjacentHTML("afterend",`<span class="fix hidden">${esc(ans[0])}</span>`);wrong.push(`${i+1}) "${inp.value||"—"}" (✓ ${ans[0]})`);} });
  $(`${id}-score`).textContent=`Score: ${ok} / ${A.length}`+(ok===A.length?" 🔥":" · исправьте красные и нажмите Check ещё раз");
  $(`${id}-show`).classList.remove("hidden");
  if(!GAPS[id].done){ GAPS[id].done=1; setRes(id,ok,A.length,wrong); }   // засчитывается первая проверка; исправлять можно сколько угодно
}
/* --- word order --- */
const ORD={};
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function order(id,items,host){
  host.insertAdjacentHTML("beforeend",`${prev(id)}${items.map((o,i)=>`<div class="q"><div class="s"><span class="n">${i+1}</span><span class="built" id="${id}b${i}"></span></div><div class="pool" id="${id}p${i}"></div><div class="why hidden" id="${id}w${i}"></div></div>`).join("")}
  <div class="actions"><button class="primary" onclick="checkOrder('${id}')">Check</button></div><div class="score" id="${id}-score"></div>`);
  ORD[id]={items,st:items.map(o=>({pool:shuffle(o.w.map((w,k)=>({w,k}))),built:[]}))};
  items.forEach((o,i)=>drawOrd(id,i));
}
function drawOrd(id,i){
  const O=ORD[id].st[i];
  $(id+"b"+i).innerHTML=O.built.length?O.built.map((t,j)=>`<button class="tok on" onclick="ordMove('${id}',${i},${j},0)">${t.w}</button>`).join(""):'<span class="muted">…</span>';
  $(id+"p"+i).innerHTML=O.pool.map((t,j)=>`<button class="tok" onclick="ordMove('${id}',${i},${j},1)">${t.w}</button>`).join("");
}
function ordMove(id,i,j,pick){ const O=ORD[id].st[i]; if(pick) O.built.push(O.pool.splice(j,1)[0]); else O.pool.push(O.built.splice(j,1)[0]); drawOrd(id,i); }
function sentence(O){ let s=O.built.map(t=>t.w).join(" ").replace(/ \?$/,"?"); if(!/[?.]$/.test(s)) s+="."; return s.charAt(0).toUpperCase()+s.slice(1); }
function checkOrder(id){
  const D=ORD[id]; const left=D.items.map((o,i)=>D.st[i].pool.length?i+1:0).filter(Boolean);
  if(left.length){ $(id+"-score").textContent="Сначала соберите все предложения: "+left.join(", "); return; }
  let ok=0; const wrong=[];
  D.items.forEach((o,i)=>{ const s=sentence(D.st[i]); const good=match(s,o.a); const w=$(id+"w"+i);
    $(id+"b"+i).className="built "+(good?"good":"wrong");
    if(good) ok++; else wrong.push(`"${s}" (✓ ${o.a[0]})`);
    w.innerHTML=good?"✅ "+o.a[0]:"❌ "+o.a[0]; w.classList.remove("hidden"); });
  $(id+"-score").textContent=`Score: ${ok} / ${D.items.length}`+(ok===D.items.length?" 🔥":"");
  setRes(id,ok,D.items.length,wrong);
}

function wcount(id,min){ const t=$(id+"-t").value, n=wc(t); $(id+"-wc").innerHTML=`Words: <b>${n}</b> / ${min}`+(n>=min?" ✅":"");
  STATE.drafts=STATE.drafts||{}; STATE.drafts[id]=t; try{localStorage.setItem(KEY,JSON.stringify(STATE))}catch(e){} }
function saveWrite(id,min){ const t=$(id+"-t").value.trim(), n=wc(t); if(n<20){ $(id+"-fb").textContent="Напишите хотя бы несколько предложений 🙂"; return; }
  setRes(id,n>=min?1:0,1,["("+n+" words) "+t]); $(id+"-fb").textContent=n>=min?"✅ Saved! Преподаватель увидит текст.":"Saved, но пока меньше "+min+" слов — можно дописать и сохранить ещё раз."; }

/* ---- 1. Charts & words ---- */
function rCharts(){
  card(`<h2>1 · Charts &amp; words</h2>
  <p>In IELTS Writing Task 1 you describe a chart in <b>150+ words</b> and <b>20 minutes</b>. Very often there are <b>two charts</b>, and you must <b>compare</b> them.</p>
  <div class="ru">Задание всегда одно и то же: <i>«Summarise the information by selecting and reporting the main features, and make comparisons where relevant.»</i><br>
  = Опишите <b>главное</b> (не каждую цифру!) и <b>сравните</b>. Своё мнение и причины — <b>не нужны</b>.</div>
  <div class="sub">Types of charts</div>
  <div class="two"><div class="a" style="background:#f2eefb"><b class="h">🥧 pie chart</b>части целого (100%)</div><div class="b" style="background:#eaf4fb"><b class="h">📊 bar chart</b>сравнение групп</div>
  <div class="a" style="background:#fdeef5"><b class="h">📈 line graph</b>изменение (по годам, по возрасту)</div><div class="b" style="background:#f1f1f1"><b class="h">▦ table</b>цифры в таблице</div></div>
  <div class="sub">Key words</div>
  <div class="words">${VOC.map(x=>`<div><button onclick="say('${x[0].replace(/ \/.*$/,"")}')">🔊</button><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join("")}</div>`);
  if(show("c_type")) mcq("c_type",C_TYPE,card(`<div class="step">A</div><h2>What type of chart is it?</h2>`));
  if(show("c_mean")) mcq("c_mean",C_MEAN,card(`<div class="step">B</div><h2>What does it mean?</h2>`));
  if(show("c_num")){ card(`<div class="step">Шаг</div><h2>Numbers → words 🔢</h2>
    <p>Хороший ответ не повторяет только «47%, 35%, 61%». Цифры можно назвать <b>словами</b> — это даёт баллы за лексику.</p>
    <table class="tbl"><tr><th>%</th><th>Как сказать</th></tr>
    <tr><td>75%</td><td>three quarters</td></tr><tr><td>60%</td><td>three fifths</td></tr><tr><td>50%</td><td>half</td></tr>
    <tr><td>33%</td><td>a third</td></tr><tr><td>25%</td><td>a quarter</td></tr><tr><td>20%</td><td>a fifth</td></tr></table>
    <div class="signals"><span>almost / nearly half = 47–49%</span><span>just over half = 51–55%</span><span>about / around a third</span><span>the majority = больше 50%</span><span>a very small proportion = 1–5%</span></div>`);
    mcq("c_num",C_NUM,card(`<div class="step">C</div><h2>Say it in words</h2>`)); }
}

/* ---- 2. Pie charts ---- */
function rPie(){
  card(`<h2>2 · Two pie charts: compare</h2>
  <p class="muted">Coursebook, Writing Task 1, ex 1–3 (Relationships).</p>${piesHTML()}
  <div class="ru">Перед тем как писать — 3 вопроса:<br>1) <b>Что</b> сравниваем? (какие группы)<br>2) Где самая <b>большая разница</b>?<br>3) Что <b>похоже</b>?</div>`);
  if(show("p_title")) mcq("p_title",P_TITLE,card(`<div class="step">Ex 1</div><h2>Which is the best title?</h2>`));
  if(show("p_diff")) mcq("p_diff",P_DIFF,card(`<div class="step">Ex 2</div><h2>Main differences: Yes or No?</h2><p class="muted">Which of the following are main differences between the two charts? <b>Main</b> = большая, важная разница.</p>`));
  if(show("p_over")) mcq("p_over",P_OVER,card(`<div class="step">Ex 3</div><h2>Which overview is the best?</h2>
    <div class="tip" style="font-size:14.5px">💡 <b>Overview</b> — 1–2 предложения о самом главном: главная разница + главное сходство. Без мелких цифр. Это самая важная часть Task 1!</div>`));
  if(show("p_tf")) mcq("p_tf",P_TF,card(`<div class="step">Check</div><h2>True, false or not in the chart?</h2><p class="muted">Пишем только то, что видно на диаграмме.</p>`));
}

/* ---- 3. Comparing ---- */
function rCmp(){
  card(`<h2>3 · The language of comparing ⚖️</h2>
  <table class="tbl"><tr><th>Что</th><th>Как</th></tr>
  <tr><td>больше / меньше (цифра)</td><td>61% is <b>higher than</b> 50%. · 35% is <b>lower than</b> 47%.</td></tr>
  <tr><td>больше / меньше (людей)</td><td><b>More</b> parents… · <b>Fewer</b> parents… <span class="muted">(people — считаем → fewer)</span></td></tr>
  <tr><td>самый</td><td><b>the highest</b> figure · <b>the lowest</b> figure · <b>the most</b> popular · <b>the least</b> satisfied</td></tr>
  <tr><td>длинные слова</td><td><b>more popular than</b> · <b>more important than</b></td></tr>
  <tr><td>в 2 раза</td><td><b>twice as high as</b> · <b>twice as many</b> people <b>as</b>…</td></tr>
  <tr><td>одинаково</td><td>almost <b>the same</b> · very <b>similar</b> · in both groups</td></tr></table>
  <div class="sub">Linking words for comparing</div>
  <div class="vs"><div>47% are very happy, <b>compared with</b> 35%.</div>
  <div>Young people choose money, <b>whereas / while</b> older people choose health. <span class="muted">(внутри одного предложения, с запятой)</span></div>
  <div>Most parents are happy. <b>However</b>, fewer parents of teenagers are very happy. <span class="muted">(начало нового предложения)</span></div>
  <div><b>In contrast</b>, more parents of teenagers are fairly happy.</div></div>
  <div class="warn">⚠️ <b>The percentage / the figure / the proportion</b> — это одно → <b>is</b>, <b>falls</b>, <b>rises</b>. ❌ <s>The percentage of parents are…</s> ✅ The percentage of parents <b>is</b>…</div>`);
  if(show("cmp_choose")) mcq("cmp_choose",CMP_CHOOSE,card(`<div class="step">A</div><h2>Choose the correct word</h2>`));
  if(show("cmp_gap")) gaps("cmp_gap",CMP_GAP,card(`<div class="step">B</div><h2>Compare the pie charts</h2>${piesHTML()}<p class="muted">Word bank: ${CMP_BANK.map(b=>`<span class="pill">${b}</span>`).join(" ")}</p>`));
  if(show("cmp_order")) order("cmp_order",CMP_ORDER,card(`<div class="step">C</div><h2>Put the words in order</h2><p class="muted">Нажимайте на слова по порядку. Нажмите на слово в предложении, чтобы убрать его.</p>`));
}

/* ---- 4. Bar + line ---- */
function rBL(){
  card(`<h2>4 · Two different charts: a line graph + a bar chart</h2>
  <div class="story" style="font-family:Inter,sans-serif;font-size:15.5px"><i>The graph below and the chart show the answers people gave about the extent to which they are satisfied with their lives and what they think would make them happiest.<br>
  Summarise the information by selecting and reporting the main features, and make comparisons where relevant.</i></div>
  ${lineSVG()}${barSVG()}
  <div class="ru">Когда диаграммы <b>разные</b>: опишите каждую в своём абзаце (Body 1 — line graph, Body 2 — bar chart), а в overview свяжите их.</div>`);
  if(show("bl_read")) mcq("bl_read",BL_READ,card(`<div class="step">Шаг 1</div><h2>Read the charts first 👀</h2><p class="muted">Сначала просто поймите, что на графиках.</p>`));
  if(show("bl_trend")){ card(`<div class="step">Шаг 2</div><h2>Describing a line: up, down, top, bottom 📈</h2>
    <table class="tbl"><tr><th></th><th>Глагол</th><th>Существительное</th></tr>
    <tr><td>↗</td><td>rise · increase · grow</td><td>a rise · an increase</td></tr>
    <tr><td>↘</td><td>fall · decrease · drop</td><td>a fall · a decrease</td></tr>
    <tr><td>⬆️ top</td><td colspan="2">reach a peak (of 5.6) · is the highest</td></tr>
    <tr><td>⬇️ bottom</td><td colspan="2">reach its lowest point (5.0) · is the lowest</td></tr>
    <tr><td>→</td><td colspan="2">stay the same · remain stable</td></tr></table>
    <p>Как: <b>sharply</b> (резко) · <b>steadily</b> (постепенно) · <b>slightly</b> (немного)</p>
    <div class="tip">💡 Здесь по оси — <b>возраст</b>, а не годы, поэтому пишем в <b>Present Simple</b>: <i>satisfaction falls…, it rises…</i> Если по оси годы в прошлом (2010, 2015…) — Past Simple: <i>it fell, it rose</i>.</div>`);
    gaps("bl_trend",BL_TREND,card(`<div class="step">Тренируем</div><h2>Complete the sentences</h2><p class="muted">Present Simple: falls / rises / reaches…</p>`)); }
  if(show("bl_intro")) mcq("bl_intro",BL_INTRO,card(`<div class="step">Шаг 3</div><h2>Introduction: say it in your own words</h2>
    <div class="formula"><span>The line graph / bar chart</span> + <span>shows / illustrates</span> + <span class="ing">what? who? when?</span></div>`));
  if(show("bl_over")) mcq("bl_over",BL_OVER,card(`<div class="step">Шаг 4</div><h2>Overview: the big picture</h2>
    <div class="formula"><span>Overall,</span> + <span class="ing">главная тенденция 1</span> + <span>and / whereas</span> + <span class="ing">главная тенденция 2</span></div>`));
  if(show("bl_model")) gaps("bl_model",BL_MODEL,card(`<div class="step">Шаг 5</div><h2>Model answer (≈ 190 words)</h2>
    <p class="muted">Вставьте слова. Посмотрите на план: Introduction → Overview → Body 1 (line graph) → Body 2 (bar chart).</p>
    <p class="muted">Word bank: ${BL_BANK.map(b=>`<span class="pill">${b}</span>`).join(" ")}</p>`),false);
}

/* ---- 5. Write ---- */
function rWrite(){
  card(`<h2>5 · ✍️ Now you write</h2>
  <p>Опишите <b>две круговые диаграммы</b> (parents with very young / teenage children). Сначала — по шаблону, потом — сами.</p>${piesHTML()}
  <div class="formula"><span>1 Introduction</span> → <span>2 Overview</span> → <span class="ing">3 Body 1</span> → <span class="ing">4 Body 2</span></div>`);
  if(show("w_frame")) gaps("w_frame",W_FRAME,card(`<div class="step">A · с помощью</div><h2>Writing frame</h2><p class="muted">Заполните пропуски. Это скелет вашего ответа.</p>`));
  if(show("w_free")){ const c=card(`<div class="step">B · сами</div><h2>Write your answer (150+ words)</h2>
    <p class="muted">Можно опираться на шаблон, но меняйте слова. Время — 20 минут ⏱️. Текст сохраняется сам, пока вы пишете.</p>
    <div class="sub">Useful phrases</div><div class="signals">${W_PHRASES.map(p=>`<span>${p}</span>`).join("")}</div>
    <div class="sub">Checklist ✅</div><div class="vs">${W_CHECK.map(c=>`<div>☐ ${c}</div>`).join("")}</div>`);
    writeBox("w_free",c,150); }
}

/* ---- Send ---- */
function rSend(){
  const rows=ALL_EX().map(k=>{ const r=STATE.res[k]; return `<tr><td>${NAMES[k]}</td><td style="text-align:right">${r?`<b>${r.score} / ${r.total}</b>`:'<span class="muted">not done</span>'}</td></tr>`; }).join("");
  card(`<h2>🚀 Send to your teacher</h2>
  <table class="res">${rows}</table>
  <div class="actions"><button class="primary" id="sendBtn" onclick="sendResults()">Send results 📩</button>
  <button class="sm" onclick="if(confirm('Start again from zero?')){STATE={name:STATE.name,res:{},done:{}};save();go(TABS[0].id)}">Reset</button></div>
  <div class="feedback" id="sendFb"></div><textarea id="copyBox" class="hidden" readonly style="min-height:200px"></textarea>`);
}
function buildReport(){
  let t=`📊 <b>${TITLE}</b>\n👤 <b>${esc(STATE.name)}</b>\n🕒 ${new Date().toLocaleString("ru-RU")}\n`; let tot=0,max=0;
  ALL_EX().forEach(k=>{ const r=STATE.res[k]; if(!r){t+=`\n▫️ ${NAMES[k]}: —`;return;}
    tot+=r.score; max+=r.total; t+=`\n${r.score===r.total?"✅":"🔸"} <b>${NAMES[k]}: ${r.score}/${r.total}</b>`; r.wrong.forEach(w=>t+=`\n   • ${esc(w)}`); });
  t+=`\n\n<b>Total: ${tot}/${max}</b>`;
  return t;
}
function chunks(text){ const out=[]; let c=""; text.split("\n").forEach(l=>{ if((c+"\n"+l).length>3800){out.push(c);c=l;} else c=c?c+"\n"+l:l; }); if(c)out.push(c); return out; }
async function sendResults(){
  const text=buildReport(); $("sendBtn").disabled=true; $("sendFb").textContent="Sending…";
  try{ for(const part of chunks(text)){ const r=await fetch("https://api.telegram.org/bot"+TG_TOKEN+"/sendMessage",{method:"POST",body:new URLSearchParams({chat_id:TG_CHAT_ID,text:part,parse_mode:"HTML"})}); const j=await r.json(); if(!j.ok) throw new Error(j.description); }
    $("sendFb").textContent="✅ Sent! Well done!"; $("sendBtn").disabled=false; }
  catch(e){ $("sendBtn").disabled=false; $("sendFb").textContent="Couldn't send ("+e.message+"). Copy the text and send it to your teacher:"; const b=$("copyBox"); b.value=plain(text); b.classList.remove("hidden"); b.select(); }
}

load(); if(STATE.name) $("nameInput").value=STATE.name;
$("nameInput").addEventListener("keydown",e=>{ if(e.key==="Enter") start(); });
if(window.MIRAE&&MIRAE.user){ $("nameInput").value=MIRAE.user; start(); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"){ clearTimeout(liveTm); saveLive(); } });
addEventListener("pagehide",()=>saveLive());
</script>
