/* normalise typed answers: case, spaces, apostrophes, contractions */
function norm(s){
  s=" "+String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"]/g," ")+" ";
  s=s.replace(/n't /g," not ").replace(/ can not /g," cannot ").replace(/ could not /g," could not ")
     .replace(/(\w)'d /g,"$1 had ").replace(/ wo not /g," will not ");
  return s.replace(/\s+/g," ").trim();
}
function match(val,answers){ const v=norm(val); return answers.some(a=>norm(a)===v); }

const CHOOSE = [
  {q:"I ___ a series on Netflix when my mum called me for dinner.",o:["watched","was watching","had watched"],a:1,why:"Long action in progress (background) + short action that interrupts it (called)."},
  {q:"When we got to the cinema, the film ___. We missed the first 20 minutes!",o:["already started","was already starting","had already started"],a:2,why:"The film started BEFORE we got there → flashback → Past Perfect."},
  {q:"She opened the app, ___ a pizza and waited.",o:["ordered","was ordering","had ordered"],a:0,why:"A chain of actions, one after another → Past Simple."},
  {q:"While Tom ___, his brother was playing video games.",o:["studied","was studying","had studied"],a:1,why:"Two long actions at the same time → Past Continuous + Past Continuous."},
  {q:"I couldn't log in because I ___ my password.",o:["had forgotten","was forgetting","have forgotten"],a:0,why:"Forgetting happened before 'couldn't log in' → Past Perfect."},
  {q:"When I woke up, the sun ___ and the birds were singing.",o:["shone","was shining","had shone"],a:1,why:"Setting the scene → Past Continuous."},
  {q:"Lisa ___ her phone when she was running for the bus.",o:["was dropping","dropped","had dropped"],a:1,why:"Short action that happened in the middle of a longer one → Past Simple."},
  {q:"By the time the police arrived, the thief ___.",o:["escaped","was escaping","had escaped"],a:2,why:"'By the time' = it was already finished → Past Perfect."},
  {q:"I ___ sushi before I went to Japan, so everything was new to me.",o:["never tried","had never tried","was never trying"],a:1,why:"Experience up to a moment in the past → had never + V3."},
  {q:"What ___ at 10 pm last night? I called you three times!",o:["did you do","were you doing","had you done"],a:1,why:"Action in progress at a specific time in the past → Past Continuous."},
  {q:"As soon as the teacher left the room, everyone ___ talking.",o:["had started","was starting","started"],a:2,why:"'As soon as' = one action right after another → Past Simple."},
  {q:"I ___ a lot of homework, so I didn't go out with my friends.",o:["had","was having","had had"],a:0,why:"State/fact, no time difference needed → Past Simple. (Have = possess → no -ing!)"}

  {q:"When I arrived at the party, Jake <b>had left</b>.",o:["Jake left after I arrived","Jake was already gone","Jake was at the door, leaving"],a:1,why:"Past Perfect = it happened earlier. I didn't see him."},
  {q:"When I arrived at the party, Jake <b>was leaving</b>.",o:["Jake left after I arrived","Jake was already gone","Jake was at the door, leaving"],a:2,why:"Past Continuous = in the middle of the action."},

/* ---- MCQ engine ---- */
function rMcq(id,title,intro,items,host){
  const html=`${title?`<h2>${title}</h2><p class="muted">${intro}</p>`:""}
  ${items.map((it,i)=>`<div class="q" id="${id}-q${i}"><div class="s"><span class="n">${i+1}</span>${it.q.replace("___",'<span class="blank">___</span>')}</div>
    <div class="opts">${it.o.map((o,j)=>`<button onclick="answerMcq('${id}',${i},${j})">${o}</button>`).join("")}</div><div class="why hidden"></div></div>`).join("")}
  <div class="score" id="${id}-score"></div>`;
  if(host) host.insertAdjacentHTML("beforeend",html); else card(html);
  MCQ[id]={items,ans:{}};
}
const MCQ={};
function answerMcq(id,i,j){
  const M=MCQ[id]; if(M.ans[i]!==undefined) return;
  M.ans[i]=j; const it=M.items[i]; const box=$(`${id}-q${i}`); const bs=box.querySelectorAll(".opts button");
  bs[it.a].classList.add("ok"); if(j!==it.a) bs[j].classList.add("bad");
  if(it.why){ const w=box.querySelector(".why"); w.innerHTML=(j===it.a?"✅ ":"❌ ")+it.why; w.classList.remove("hidden"); }
  const n=Object.keys(M.ans).length;
  if(n===M.items.length){
    const ok=M.items.filter((x,k)=>M.ans[k]===x.a).length;
    $(`${id}-score`).textContent=`Score: ${ok} / ${M.items.length}`+(ok===M.items.length?" 🔥":"");
    STATE.res[id]={score:ok,total:M.items.length,wrong:M.items.map((x,k)=>M.ans[k]!==x.a?`${x.q.replace(/<[^>]+>/g,"")} → chose "${x.o[M.ans[k]]}" (✓ ${x.o[x.a]})`:null).filter(Boolean)};
    save(); bookOrMark(id);
  }
}
function bookOrMark(id){ if(id.startsWith("book")) checkBookDone(); else markDone(id); }

/* ---- Gap engine: {ans|alt} (hint) ---- */
function gapHTML(id,text){
  let k=0; GAPS[id]=[];
  return text.replace(/\{([^}]+)\}/g,(m,a)=>{ GAPS[id].push(a.split("|")); return `<input class="gap" id="${id}-g${k++}" autocomplete="off" autocapitalize="off" spellcheck="false">`; });
}
const GAPS={};
function checkGaps(id){
  const A=GAPS[id]; let ok=0; const wrong=[];
  A.forEach((ans,i)=>{
    const inp=$(`${id}-g${i}`); const old=inp.nextElementSibling; if(old&&old.classList.contains("fix")) old.remove();
    inp.classList.remove("ok","bad");
    if(match(inp.value,ans)){ ok++; inp.classList.add("ok"); }
    else { inp.classList.add("bad"); inp.insertAdjacentHTML("afterend",`<span class="fix hidden">${esc(ans[0])}</span>`); wrong.push(`${i+1}) "${inp.value||"—"}" (✓ ${ans[0]})`); }
  });
  $(`${id}-score`).textContent=`Score: ${ok} / ${A.length}`+(ok===A.length?" 🔥":"");
  $(`${id}-show`).classList.remove("hidden");
  if(!STATE.res[id]){ STATE.res[id]={score:ok,total:A.length,wrong}; save(); }
  bookOrMark(id);
}
function showGaps(id){ document.querySelectorAll(`[id^="${id}-g"]+.fix`).forEach(x=>x.classList.remove("hidden")); }
function gapBlock(id,text){
  return `<div class="gaptext">${gapHTML(id,text)}</div>
  <div class="actions"><button class="primary" onclick="checkGaps('${id}')">Check</button><button id="${id}-show" class="hidden" onclick="showGaps('${id}')">Show answers</button></div>
  <div class="score" id="${id}-score"></div>`;
}

  card(`<h2>✍️ Your story</h2>
  <p class="muted">Choose a topic (or tell a true story of your own). Write 80–150 words.</p>
  <div class="prompts">${PROMPTS.map((p,i)=>`<button class="${STATE.prompt===p?"sel":""}" onclick="pickPrompt(${i},this)">${p}</button>`).join("")}</div>
  <h3>Story plan</h3>
  <ol class="steps">
    <li><b class="pc">🎥 Set the scene.</b> Where were you? What was happening? <i class="muted">It was a hot day. We were waiting for…</i></li>
    <li><b class="ps">⚡ Something happened.</b> <i class="muted">Suddenly…, when…</i></li>
    <li><b class="pp">⏪ Flashback.</b> Explain what had happened before. <i class="muted">I had forgotten…, nobody had told us…</i></li>
    <li><b class="ps">⚡ What happened next + the ending.</b> How did you feel? <i class="muted">In the end…, I'll never forget…</i></li>
  </ol>
  <textarea id="storyBox" placeholder="Start here… e.g. It was a cold Monday morning and I was standing at the bus stop when…" oninput="storyInput()">${esc(STATE.story)}</textarea>
  <div class="meter" id="meter"></div>
  <p class="muted">The counter is just a helper — it can't check grammar perfectly. 🙂</p>
  <div class="card" style="background:#f6f7fa;box-shadow:none;margin-top:16px">
    <h3 style="margin-top:0">🗣 Speaking in class</h3>
    <p>Tell your story to your partner/teacher without reading. Your partner must ask <b>two questions</b>:</p>
    <div class="signals"><span>What were you doing when…?</span><span>Had you ever … before?</span><span>What happened next?</span><span>How did you feel?</span></div>
  </div>`);
  storyInput();
}
function pickPrompt(i,b){ STATE.prompt=PROMPTS[i]; save(); document.querySelectorAll(".prompts button").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); }
function storyStats(t){
  const words=(t.trim().match(/\S+/g)||[]).length;
  const pc=(t.match(/\b(was|were)(n't| not)?\s+\w+ing\b/gi)||[]).length;
  const pp=(t.match(/\b(had(n't| not)?(\s+(already|just|never|ever))?\s+(?!to\b)\w+(ed|en|wn|ne|lt|ft|ht|ght|nt|ld|ok|un|ung|ad|id|ay|een|een|ept|ost|ot|ut|et|it|ade|old|ound|ard)\b|\w+'d\s+(already\s+|just\s+|never\s+)?\w+(ed|en|wn|ne|ft|ght|een|ept|ot|ut)\b)/gi)||[]).length;
  return {words,pc,pp};
}
function storyInput(){
  const b=$("storyBox"); if(!b) return; STATE.story=b.value; save();
  const s=storyStats(b.value);
  $("meter").innerHTML=`<span style="background:#eef0f4">📝 ${s.words} words</span>
    <span class="chip pc" style="font-size:14px">🎥 Past Continuous: ${s.pc}</span>
    <span class="chip pp" style="font-size:14px">⏪ Past Perfect: ${s.pp}</span>`;
  if(s.words>=80 && s.pc>=1 && s.pp>=1) markDone("write");
}

/* ---- Send ---- */
const NAMES={warm:"Warm-up (sorting)",choose:"Choose",meaning:"Meaning",story:"Story gaps",fix:"Fix it",join:"Join",book2a:"Book 2A",book2b:"Book 2B",book135a:"Book p.135 ex 1",book135c:"Book p.135 ex 3"};
function rSend(){
  const rows=Object.keys(NAMES).map(k=>{ const r=STATE.res[k]; return `<tr><td>${NAMES[k]}</td><td style="text-align:right">${r?`<b>${r.score} / ${r.total}</b>`:'<span class="muted">not done</span>'}</td></tr>`; }).join("");
  const s=storyStats(STATE.story||"");
  card(`<h2>🚀 Send to your teacher</h2>
  <table class="res">${rows}<tr><td>Your story</td><td style="text-align:right">${s.words?`<b>${s.words} words</b>`:'<span class="muted">not written</span>'}</td></tr></table>
  <div class="actions"><button class="primary" id="sendBtn" onclick="sendResults()">Send results 📩</button>
  <button class="sm" onclick="if(confirm('Start again from zero?')){STATE={name:STATE.name,res:{},story:'',prompt:'',done:{}};save();go('warm')}">Reset</button></div>
  <div class="feedback" id="sendFb"></div><textarea id="copyBox" class="hidden" readonly></textarea>`);
}
function buildReport(){
  let t=`📒 <b>Narrative Tenses B1</b>\n👤 <b>${esc(STATE.name)}</b>\n🕒 ${new Date().toLocaleString("ru-RU")}\n`;
  let tot=0,max=0;
  Object.keys(NAMES).forEach(k=>{ const r=STATE.res[k]; if(!r){ t+=`\n▫️ ${NAMES[k]}: —`; return; }
    tot+=r.score; max+=r.total; t+=`\n${r.score===r.total?"✅":"🔸"} <b>${NAMES[k]}: ${r.score}/${r.total}</b>`;
    r.wrong.forEach(w=>t+=`\n   • ${esc(w)}`); });
  t+=`\n\n<b>Total: ${tot}/${max}</b>`;
  if(STATE.story && STATE.story.trim()){ const s=storyStats(STATE.story);
    t+=`\n\n✍️ <b>Story</b>${STATE.prompt?" — "+esc(STATE.prompt):""} (${s.words} words, PC ${s.pc}, PP ${s.pp}):\n${esc(STATE.story.trim())}`; }
  return t;
}
function chunks(text){ const out=[]; let cur=""; text.split("\n").forEach(l=>{ if((cur+"\n"+l).length>3800){ out.push(cur); cur=l; } else cur=cur?cur+"\n"+l:l; }); if(cur)out.push(cur); return out; }
async function sendResults(){
  const text=buildReport(); $("sendBtn").disabled=true; $("sendFb").textContent="Sending…";
  try{ for(const part of chunks(text)){ const r=await fetch("https://api.telegram.org/bot"+TG_TOKEN+"/sendMessage",{method:"POST",body:new URLSearchParams({chat_id:TG_CHAT_ID,text:part,parse_mode:"HTML"})}); const j=await r.json(); if(!j.ok) throw new Error(j.description); }
    $("sendFb").textContent="✅ Sent! Well done!"; $("sendBtn").disabled=false; }
  catch(e){ $("sendBtn").disabled=false; $("sendFb").textContent="Couldn't send ("+e.message+"). Copy the text and send it to your teacher:"; const b=$("copyBox"); b.value=text.replace(/<\/?b>/g,""); b.classList.remove("hidden"); b.select(); }
}

load(); if(STATE.name) $("nameInput").value=STATE.name;
if(window.MIRAE&&MIRAE.user){ $("nameInput").value=MIRAE.user; start(); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"){ clearTimeout(liveTm); saveLive(); } });

/* ---------- MIRAÉ: задания для домашки (см. js/bridge.js) ----------
   MIRAE_PARTS — задания тренажёра с ключами для «Задать домашку»; при ?only=… остаются только выбранные. */
/* Блоки внутри вкладок: ключ "b:<вкладка>:<номер>" (Learn — карточки, Choose/Meaning/Fix it/Join — отдельные вопросы).
   Старый ключ "t:<вкладка>" по-прежнему означает вкладку целиком. */
const plain=x=>String(x).replace(/<[^>]+>/g,"").replace(/[\[\]]/g,"").replace(/\s+/g," ").trim();
const cut=(x,n)=>{ x=plain(x); return x.length>n?x.slice(0,n-1)+"…":x; };
const BLOCKS={
  learn:{g:"2 · Learn",n:6,name:i=>["Think like a film director","On the timeline","Form","Top combinations","Signal words","Watch out"][i]},
  choose:{g:"3 · Choose",arr:CHOOSE,name:(x,i)=>(i+1)+". "+cut(x.q,60)},
  meaning:{g:"4 · Meaning",arr:MEANING,name:(x,i)=>(i+1)+". "+cut(x.q,60)},
  fix:{g:"6 · Fix it",arr:FIX,name:(x,i)=>(i+1)+". "+cut(x.s,60)},
  join:{g:"7 · Join",arr:JOIN,name:(x,i)=>(i+1)+". "+cut(x.a,45)+" ("+x.w+")"}
};
Object.keys(BLOCKS).forEach(id=>{ const B=BLOCKS[id]; if(B.arr) B.n=B.arr.length; });
const bkeys=["book2a","book2b","book135a","book135c"];
window.MIRAE_PARTS=[
  {g:"Narrative Tenses",t:TABS.filter(x=>["warm","story","write"].includes(x.id)).map(x=>({k:"t:"+x.id,n:x.t.replace(/^\S+ · /,"")}))}]
  .concat(Object.keys(BLOCKS).map(id=>{ const B=BLOCKS[id]; return {g:B.g,t:Array.from({length:B.n},(_,i)=>({k:"b:"+id+":"+i,n:B.arr?B.name(B.arr[i],i):B.name(i)}))}; }))
  .concat([{g:"Coursebook",t:[{k:"e:book2a",n:"Exercise 2A · Choose the correct word or phrase"},{k:"e:book2b",n:"Exercise 2B · Past Simple, Past Continuous or Past Perfect"},{k:"e:book135a",n:"p. 135 · Ex 1 · Past Simple or Past Continuous"},{k:"e:book135c",n:"p. 135 · Ex 3 · Choose A, B or C"}]}]);
if(window.MIRAE_PICK){ const P=MIRAE_PICK;
  const bOn=(id,i)=>P.has("t:"+id)||P.has("b:"+id+":"+i);
  const tabOn=id=>P.has("t:"+id)||(BLOCKS[id]&&Array.from({length:BLOCKS[id].n},(_,i)=>i).some(i=>P.has("b:"+id+":"+i)));
  P.take(TABS,TABS.map((x,i)=>i).filter(i=>{ const x=TABS[i]; return x.id==="send"||(x.id==="book"?bkeys.some(k=>P.has("e:"+k)):tabOn(x.id)); }));
  Object.keys(BLOCKS).forEach(id=>{ const B=BLOCKS[id]; if(B.arr) P.take(B.arr,B.arr.map((x,i)=>i).filter(i=>bOn(id,i))); });
  Object.keys(NAMES).forEach(k=>{ if(!(bkeys.includes(k)?P.has("e:"+k):tabOn(k))) delete NAMES[k]; });
  cur=TABS[0].id; }

$("nav").addEventListener("wheel",e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ $("nav").scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
addEventListener("pagehide",()=>saveLive());
$("nameInput").addEventListener("keydown",e=>{ if(e.key==="Enter") start(); });
</script>
