const MCQ={};
function rMcq(id,title,intro,items,host){
  const html=`${title?`<h2>${title}</h2><p>${intro}</p>`:""}

  if(host) host.insertAdjacentHTML("beforeend",html); else card(html);

}
function answerMcq(id,i,j){
  const M=MCQ[id]; if(M.ans[i]!==undefined) return;
  M.ans[i]=j; const it=M.items[i]; const box=$(`${id}-q${i}`); const bs=box.querySelectorAll(".opts button");
  bs[it.a].classList.add("ok"); if(j!==it.a) bs[j].classList.add("bad");
  if(it.why){ const w=box.querySelector(".why"); w.innerHTML=(j===it.a?"✅ ":"❌ ")+it.why; w.classList.remove("hidden"); }
  if(Object.keys(M.ans).length===M.items.length){
    const ok=M.items.filter((x,k)=>M.ans[k]===x.a).length;
    $(`${id}-score`).textContent=`Score: ${ok} / ${M.items.length}`+(ok===M.items.length?" 🔥":"");
    setRes(id,ok,M.items.length,M.items.map((x,k)=>M.ans[k]!==x.a?`${x.q.replace(/<[^>]+>/g,"")} → "${x.o[M.ans[k]]}" (✓ ${x.o[x.a]})`:null).filter(Boolean));

const GAPS={};
function gapBlock(id,text){
  let k=0; GAPS[id]=[];

  return `<div class="gaptext">${t}</div>
  <div class="actions"><button class="primary" onclick="checkGaps('${id}')">Check</button><button id="${id}-show" class="hidden" onclick="document.querySelectorAll('[id^=${id}-g]+.fix').forEach(x=>x.classList.remove('hidden'))">Show answers</button></div>
  <div class="score" id="${id}-score"></div>`;
}
function checkGaps(id){
  const A=GAPS[id]; let ok=0; const wrong=[];
  A.forEach((ans,i)=>{ const inp=$(`${id}-g${i}`); const old=inp.nextElementSibling; if(old&&old.classList.contains("fix")) old.remove();

    else{inp.classList.add("bad");inp.insertAdjacentHTML("afterend",`<span class="fix hidden">${esc(ans[0])}</span>`);wrong.push(`${i+1}) "${inp.value||"—"}" (✓ ${ans[0]})`);} });
  $(`${id}-score`).textContent=`Score: ${ok} / ${A.length}`+(ok===A.length?" 🔥":"");
  $(`${id}-show`).classList.remove("hidden");
  setRes(id,ok,A.length,wrong); after(id);
}
function after(id){

}

const ORD={};
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

  <div class="actions"><button class="primary" onclick="checkOrder()">Check</button></div><div class="score" id="order-score"></div>`);
  ORDER.forEach((o,i)=>{ ORD[i]={pool:shuffle(o.w.map((w,k)=>({w,k}))),built:[]}; drawOrd(i); });
}
function drawOrd(i){
  const O=ORD[i];
  $("ob"+i).innerHTML=O.built.length?O.built.map((t,j)=>`<button class="tok on" onclick="ordBack(${i},${j})">${t.w}</button>`).join(""):'<span class="muted">…</span>';
  $("op"+i).innerHTML=O.pool.map((t,j)=>`<button class="tok" onclick="ordPick(${i},${j})">${t.w}</button>`).join("");
}
function ordPick(i,j){ const O=ORD[i]; O.built.push(O.pool.splice(j,1)[0]); drawOrd(i); }
function ordBack(i,j){ const O=ORD[i]; O.pool.push(O.built.splice(j,1)[0]); drawOrd(i); }
function sentence(i){ let s=ORD[i].built.map(t=>t.w).join(" ").replace(/ \?$/,"?"); if(!/[?.]$/.test(s)) s+="."; return s.charAt(0).toUpperCase()+s.slice(1); }
function checkOrder(){

  if(left.length){ $("order-score").textContent="Finish all sentences first: "+left.join(", ")+" · Сначала соберите все предложения"; return; }
  let ok=0; const wrong=[];
  ORDER.forEach((o,i)=>{ const s=sentence(i); const good=ORD[i].pool.length===0&&match(s,o.a); const w=$("ow"+i);

  $("order-score").textContent=`Score: ${ok} / ${ORDER.length}`+(ok===ORDER.length?" 🔥":"");
  setRes("order",ok,ORDER.length,wrong); after("order");
}

function rMe(){
  const T=STATE.texts.me||{};
  card(`<h2>6 · About me ✍️</h2>
  <p>Answer in full sentences. Use a <b>frequency word</b> in each answer and add a <b>reason</b> (because…) where you can.</p>
  <p class="muted">Ответьте полными предложениями — ответы увидит преподаватель.</p>
  ${ME_Q.map((q,i)=>`<div class="q"><div class="s"><span class="n">${i+1}</span>${q}</div><input type="text" id="me${i}" value="${esc(T[i]||"")}" oninput="meInput()" autocomplete="off"><div class="hint" id="meh${i}"></div></div>`).join("")}`);
  meInput();
}
const FREQ=/\b(always|usually|often|sometimes|rarely|seldom|never|hardly ever|every|once|twice|times a|most of the time|from time to time)\b/i;
function meInput(){
  const T={}; let good=0;
  ME_Q.forEach((q,i)=>{ const v=$("me"+i).value; T[i]=v; const h=$("meh"+i); const w=(v.trim().match(/\S+/g)||[]).length;
    if(!v.trim()){h.textContent="";return;}
    const f=FREQ.test(v), r=/\bbecause\b|\bso\b|\bbut\b/i.test(v);
    h.innerHTML=(f?"✅ frequency word":"➕ add a frequency word")+" · "+(w>=6?"✅ full sentence":"➕ make it longer")+(r?" · ⭐ reason":"");
    if(f&&w>=6) good++; });
  STATE.texts.me=T; save();
  if(good>=5) markDone("me");
}

/* ---- 7. Speaking ---- */
let timer=null;
function rSpeak(){
  const S=STATE.texts.speak||{};
  card(`<h2>🎤 IELTS Speaking · Part 1</h2>
  <p>Answer each question <b>aloud</b> in 2–3 sentences (answer + reason + detail). Then write your answer down and compare it with the model. <span class="muted">Сначала вслух, потом письменно.</span></p>
  ${P1.map((p,i)=>`<div class="q"><div class="s"><span class="n">${i+1}</span>${p.q}</div>
    <textarea class="short" id="sp${i}" oninput="spInput()" placeholder="My answer…">${esc(S[i]||"")}</textarea>
    <details><summary>👀 Model answer (Band 6)</summary><div class="why">${p.m}</div></details></div>`).join("")}`);
  card(`<h2>🎤 Part 2 · Cue card</h2>
  <div class="cue"><b>Describe your favourite room in your home.</b><br>You should say:<ul><li>which room it is</li><li>what furniture there is in it</li><li>what you usually do there</li></ul>and explain why you like it.</div>
  <p>You have <b>1 minute</b> to make notes. Then speak for <b>1–2 minutes</b>.</p>
  <div class="actions"><button onclick="runTimer(60,'Prepare')">⏱ 1 min — prepare</button><button onclick="runTimer(120,'Speak')">🎙 2 min — speak</button></div>
  <div class="timer" id="timer"></div>
  <textarea id="cueNotes" oninput="spInput()" placeholder="Notes: room… furniture… I usually… because…">${esc(S.cue||"")}</textarea>
  <div class="tip">💡 Useful: <i>There is a… / There are… · I usually… · I often… because… · The best thing about it is… · I always feel relaxed there.</i></div>`);
  card(`<h2>👥 In class (ex. 23)</h2>
  <p>In pairs, talk about what you <b>usually</b> do on weekdays and describe a typical day at the weekend. Your partner asks <b>two</b> “How often…?” questions.</p>`);
}
function spInput(){
  const S={}; P1.forEach((p,i)=>S[i]=$("sp"+i).value); S.cue=$("cueNotes").value; STATE.texts.speak=S; save();
  if(P1.filter((p,i)=>(S[i]||"").trim().split(/\s+/).length>=8).length>=4) markDone("speak");
}
function runTimer(sec,label){
  clearInterval(timer); let t=sec; const el=$("timer");
  const draw=()=>el.textContent=`${label}: ${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`; draw();
  timer=setInterval(()=>{ t--; draw(); if(t<=0){ clearInterval(timer); el.textContent=label==="Prepare"?"⏰ Time to speak!":"✅ Time's up — well done!"; } },1000);
}

/* ---- Send ---- */
const NAMES={where:"Words: Where…?",collo:"Words: collocations",order:"Word order",right:"Which is right?",b18:"Book 18",b19:"Book 19 (adverbs)",b20:"Book 20 (verbs)",b21:"Book 21",b22:"Book 22",tfng:"Reading T/F/NG",short:"Reading short answers"};
function rSend(){
  const rows=Object.keys(NAMES).map(k=>{ const r=STATE.res[k]; return `<tr><td>${NAMES[k]}</td><td style="text-align:right">${r?`<b>${r.score} / ${r.total}</b>`:'<span class="muted">not done</span>'}</td></tr>`; }).join("");
  card(`<h2>🚀 Send to your teacher</h2>
  <table class="res">${rows}</table>
  <div class="actions"><button class="primary" id="sendBtn" onclick="sendResults()">Send results 📩</button>
  <button class="sm" onclick="if(confirm('Start again from zero?')){STATE={name:STATE.name,res:{},texts:{},done:{}};save();go('words')}">Reset</button></div>
  <div class="feedback" id="sendFb"></div><textarea id="copyBox" class="hidden" readonly></textarea>`);
}
function buildReport(){
  let t=`🏠 <b>${TITLE}</b>\n👤 <b>${esc(STATE.name)}</b>\n🕒 ${new Date().toLocaleString("ru-RU")}\n`; let tot=0,max=0;
  Object.keys(NAMES).forEach(k=>{ const r=STATE.res[k]; if(!r){t+=`\n▫️ ${NAMES[k]}: —`;return;}
    tot+=r.score; max+=r.total; t+=`\n${r.score===r.total?"✅":"🔸"} <b>${NAMES[k]}: ${r.score}/${r.total}</b>`; r.wrong.forEach(w=>t+=`\n   • ${esc(w)}`); });
  t+=`\n\n<b>Total: ${tot}/${max}</b>`;
  const me=STATE.texts.me||{}; const meL=ME_Q.map((q,i)=>me[i]&&me[i].trim()?`${i+1}. ${q}\n   ${esc(me[i].trim())}`:null).filter(Boolean);
  if(meL.length) t+=`\n\n✍️ <b>About me</b>\n`+meL.join("\n");
  const sp=STATE.texts.speak||{}; const spL=P1.map((p,i)=>sp[i]&&sp[i].trim()?`${i+1}. ${p.q}\n   ${esc(sp[i].trim())}`:null).filter(Boolean);
  if(spL.length) t+=`\n\n🎤 <b>Speaking Part 1</b>\n`+spL.join("\n");
  if(sp.cue&&sp.cue.trim()) t+=`\n\n🎤 <b>Part 2 notes (favourite room)</b>\n${esc(sp.cue.trim())}`;
  return t;
}
function chunks(text){ const out=[]; let c=""; text.split("\n").forEach(l=>{ if((c+"\n"+l).length>3800){out.push(c);c=l;} else c=c?c+"\n"+l:l; }); if(c)out.push(c); return out; }
async function sendResults(){
  const text=buildReport(); $("sendBtn").disabled=true; $("sendFb").textContent="Sending…";
  try{ for(const part of chunks(text)){ const r=await fetch("https://api.telegram.org/bot"+TG_TOKEN+"/sendMessage",{method:"POST",body:new URLSearchParams({chat_id:TG_CHAT_ID,text:part,parse_mode:"HTML"})}); const j=await r.json(); if(!j.ok) throw new Error(j.description); }
    $("sendFb").textContent="✅ Sent! Well done!"; $("sendBtn").disabled=false; }
  catch(e){ $("sendBtn").disabled=false; $("sendFb").textContent="Couldn't send ("+e.message+"). Copy the text and send it to your teacher:"; const b=$("copyBox"); b.value=plain(text); b.classList.remove("hidden"); b.select(); }
}

load(); if(STATE.name) $("nameInput").value=STATE.name;
$("nameInput").addEventListener("keydown",e=>{ if(e.key==="Enter") start(); });
if(window.MIRAE&&MIRAE.user){ $("nameInput").value=MIRAE.user; start(); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"){ clearTimeout(liveTm); saveLive(); } });
addEventListener("pagehide",()=>saveLive());
</script>
