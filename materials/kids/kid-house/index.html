<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Домик лисички 🦊🏠</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    background: linear-gradient(#fdf1dc 0%, #fbe3c0 70%, #cfe8a8 70%, #b9dc8c 100%);
    color: #4a2a10; overflow: hidden; touch-action: manipulation;
  }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; padding: 14px; }
  .screen.on { display: flex; }
  h1 { margin: 0; font-size: clamp(26px, 5.5vw, 46px); text-align: center; }
  .btn { border: none; border-radius: 26px; background: #fff; box-shadow: 0 6px 0 #d9a066; color: #4a2a10; cursor: pointer; font-size: 18px; padding: 14px 12px; font-family: inherit; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d9a066; }
  .btn .em { display: block; font-size: 52px; line-height: 1.1; }
  .btn .ko { display: block; font-size: 28px; font-weight: 800; margin: 4px 0; }
  #menu { justify-content: center; gap: 16px; }
  .modes { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 960px; width: 100%; }
  .modes .btn { flex: 1 1 230px; max-width: 290px; }
  .note { font-size: 14px; opacity: .75; text-align: center; max-width: 640px; }
  .bigfox { font-size: clamp(80px, 18vw, 140px); line-height: 1; animation: bob 2s ease-in-out infinite; }
  img.ai { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
  img.ai.hero { width: clamp(150px, 30vw, 240px); height: auto; }
  img.ai.mini { display: inline-block; width: 1.15em; height: 1.15em; margin: 0 -.05em; }
  .fox { width: clamp(64px, 12vw, 104px); height: clamp(64px, 12vw, 104px); }
  .pick .em { width: clamp(78px, 17vw, 140px); height: clamp(78px, 17vw, 140px); }
  .win img.ai { width: 92%; height: 92%; }
  .door img.ai { width: 86%; height: 86%; }
  #winPic img.ai.mini { width: .62em; height: .62em; }

  .top { width: 100%; margin-top: 30px; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 5; }
  .iconbtn { border: none; background: #fff; border-radius: 50%; width: 56px; height: 56px; flex: none; font-size: 28px; box-shadow: 0 4px 0 #d9a066; cursor: pointer; }
  .foxrow { display: flex; align-items: center; gap: 10px; }
  .fox { font-size: clamp(56px, 11vw, 92px); line-height: 1; cursor: pointer; }
  .fox.yes { animation: chomp .5s ease 2; }
  .fox.no { animation: shake .45s ease; }
  .bubble { background: #fff; border-radius: 26px; padding: 8px 20px; font-size: clamp(26px, 5.5vw, 46px); font-weight: 800; box-shadow: 0 4px 0 #d9a066; cursor: pointer; min-width: 110px; text-align: center; }
  .bubble small { display: block; font-size: 15px; font-weight: 400; opacity: .6; }

  /* progress: little ㅁ-windows */
  .wins { display: flex; gap: 6px; }
  .wins i { width: 26px; height: 26px; border: 5px solid #7a4a1c; border-radius: 4px; background: #fff; font-style: normal; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .wins i.on { background: #ffe680; }

  /* ---------- mode 1: the house ---------- */
  .stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .house { position: relative; width: min(86vw, 52vh, 460px); }
  .house.shake { animation: wobble .25s linear 4; }
  .house.fall { animation: fall 1.1s cubic-bezier(.5,0,.8,.4) forwards; }
  .roof { height: calc(min(86vw, 52vh, 460px) * .34); background: #c4531a; clip-path: polygon(50% 0, 100% 100%, 0 100%); margin: 0 -6%; }
  .walls { background: repeating-linear-gradient(#f3b878 0 22px, #e9a862 22px 25px); border: 6px solid #a0622c; border-top: none; border-radius: 0 0 12px 12px; padding: 5% 6% 0; }
  .wgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7%; }
  .win { aspect-ratio: 1; border: 9px solid #6b3d14; border-radius: 6px; background: #bfe3ff; display: flex; align-items: center; justify-content: center; font-size: calc(min(86vw, 52vh, 460px) * .14); line-height: 1; }
  .win.in { background: #fff3c4; animation: pop .45s ease; }
  .doorrow { display: flex; justify-content: center; margin-top: 6%; }
  .door { width: 30%; aspect-ratio: .78; background: #8a4f1d; border-radius: 40% 40% 0 0 / 30% 30% 0 0; position: relative; display: flex; align-items: center; justify-content: center; font-size: calc(min(86vw, 52vh, 460px) * .12); color: #fff; font-weight: 900; }
  .door::after { content: ""; position: absolute; right: 14%; top: 55%; width: 9%; aspect-ratio: 1; border-radius: 50%; background: #ffd35c; }
  .door.knock { animation: knock .18s ease 3; }
  .choices { display: flex; gap: clamp(12px, 3vw, 28px); justify-content: center; margin: 6px 0 8px; z-index: 5; }
  .pick { width: clamp(110px, 24vw, 190px); height: clamp(120px, 26vw, 200px); border: none; border-radius: 28px; background: #fff; box-shadow: 0 6px 0 #d9a066; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: inherit; color: #4a2a10; }
  .pick:active { transform: translateY(4px); box-shadow: 0 2px 0 #d9a066; }
  .pick .em { font-size: clamp(60px, 13vw, 110px); line-height: 1.05; }
  .pick .w { font-size: clamp(18px, 4vw, 28px); font-weight: 800; margin-top: 4px; }
  .pick.wrong { animation: shake .45s ease; opacity: .45; }
  .pick.right { background: #e3f7d8; }
  .hidewords .pick .w { visibility: hidden; }

  /* ---------- mode 2: magic ㅁ ---------- */
  .builder { display: flex; align-items: center; gap: 16px; margin-top: 10px; }
  .slot { width: clamp(130px, 24vw, 220px); height: clamp(130px, 24vw, 220px); background: #fff; border-radius: 30px; box-shadow: 0 6px 0 #d9a066; display: flex; align-items: center; justify-content: center; font-size: clamp(90px, 17vw, 160px); font-weight: 900; }
  .slot.m { color: #6b3d14; }
  .slot.made { background: #fffbe0; animation: pop .45s ease; }
  .plus { font-size: 46px; font-weight: 900; opacity: .6; }
  .keys { display: flex; gap: clamp(12px, 3vw, 28px); margin: 18px 0 10px; }
  .kbtn { width: clamp(100px, 17vw, 150px); height: clamp(100px, 17vw, 150px); border: none; border-radius: 26px; background: #fff; box-shadow: 0 6px 0 #d9a066; font-size: clamp(64px, 11vw, 100px); font-weight: 900; cursor: pointer; color: #c4531a; font-family: inherit; }
  .kbtn.big { width: clamp(150px, 28vw, 230px); height: clamp(150px, 28vw, 230px); font-size: clamp(100px, 18vw, 160px); }
  .kbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d9a066; }
  .kbtn.wrong { animation: shake .45s ease; opacity: .4; }
  .kbtn.right { background: #e3f7d8; animation: pop .45s ease; }
  .ear { font-size: clamp(70px, 14vw, 120px); margin-top: 10px; cursor: pointer; animation: bob 1.6s ease-in-out infinite; }

  /* ---------- mode 3: missing syllable ---------- */
  .pic { font-size: clamp(100px, 22vw, 170px); line-height: 1; cursor: pointer; margin-top: 4px; }
  .pic.eat { animation: chomp .5s ease 2; }
  .word { display: flex; gap: clamp(6px, 2vw, 14px); justify-content: center; margin: 10px 0; }
  .cell { width: clamp(80px, 17vw, 130px); height: clamp(90px, 19vw, 145px); border-radius: 22px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: clamp(56px, 12vw, 96px); font-weight: 900; box-shadow: 0 5px 0 #d9a066; cursor: pointer; }
  .cell.gap { background: #fff8d6; border: 4px dashed #e0a800; box-shadow: none; color: #e0a800; animation: pulse 1.2s ease-in-out infinite; }
  .cell.filled { background: #d9f7d9; color: #1d7a1d; border: none; animation: pop .4s ease; }

  #win { justify-content: center; gap: 14px; text-align: center; }
  #win h2 { font-size: 56px; margin: 0; }
  #winText { font-size: 24px; max-width: 600px; }
  #winWord { font-size: clamp(70px, 16vw, 130px); font-weight: 900; color: #c4531a; cursor: pointer; display: none; }
  .confetti { position: fixed; top: -60px; font-size: 40px; animation: drop linear forwards; pointer-events: none; z-index: 50; }

  @keyframes bob { 50% { transform: translateY(-10px); } }
  @keyframes shake { 20%,60% { transform: translateX(-12px); } 40%,80% { transform: translateX(12px); } }
  @keyframes chomp { 30% { transform: scale(1.2) rotate(-6deg); } 60% { transform: scale(.95) rotate(4deg); } }
  @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.12); } }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  @keyframes knock { 50% { transform: translateX(6px) rotate(2deg); } }
  @keyframes wobble { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  @keyframes fall { 30% { transform: rotate(-6deg); } 100% { transform: translateY(40vh) rotate(18deg) scale(.9); opacity: 0; } }
  @keyframes drop { to { transform: translateY(115vh) rotate(360deg); } }
</style>
</head>

<!-- mode 1 -->
<div id="house" class="screen">
  <div class="top"><button class="iconbtn home">🏠</button>
    <div class="foxrow"><div class="fox" id="fox1"><img class="ai " src="img/fox.webp" alt=""></div><div class="bubble" id="bub1"></div></div>
    <button class="iconbtn again">🔊</button></div>
  <div class="stage">
    <div class="house" id="hs">
      <div class="roof"></div>
      <div class="walls">
        <div class="wgrid" id="wgrid"></div>
        <div class="doorrow"><div class="door" id="door">?</div></div>
      </div>
    </div>
  </div>
  <div class="choices" id="picks"></div>
</div>

<!-- mode 2 -->
<div id="magic" class="screen">
  <div class="top"><button class="iconbtn home">🏠</button>
    <div class="foxrow"><div class="fox" id="fox2"><img class="ai " src="img/fox.webp" alt=""></div><div class="bubble" id="bub2"></div></div>
    <button class="iconbtn again">🔊</button></div>
  <div class="wins" id="wins2"></div>
  <div class="builder" id="builder">
    <div class="slot m" id="cslot">ㅁ</div><div class="plus">+</div><div class="slot" id="vslot">?</div><div class="plus">=</div><div class="slot" id="result"> </div>
  </div>
  <div class="ear" id="ear" style="display:none">👂</div>
  <div class="keys" id="keys"></div>
</div>

<!-- mode 3 -->
<div id="gap" class="screen">
  <div class="top"><button class="iconbtn home">🏠</button>
    <div class="wins" id="wins3"></div>
    <button class="iconbtn again">🔊</button></div>
  <div class="pic" id="pic"></div>
  <div class="word" id="word"></div>
  <div class="keys" id="opts"></div>
</div>

<div id="win" class="screen">
  <div class="bigfox" id="winPic">🦊</div>
  <h2>잘했어!</h2>
  <div id="winWord"></div>
  <div id="winText"></div>
  <button class="btn" id="playAgain" style="font-size:28px;font-weight:800;padding:14px 40px">또! 🔁</button>
  <button class="btn" id="toMenu">🏠 меню</button>
</div>

<script>
/* ---------- MIRAÉ: задания для домашки (каждый режим — отдельное задание) ---------- */
const MODES = [
  { k: "house", em: ["gangaji", "goyangi", "ori"].map(k => `<img class="ai mini" src="img/${k}.webp" alt="">`).join(""), ko: "똑똑! 누구야?", ru: "Кто стучится?" },
  { k: "magic", em: "✨", ko: "ㅁ + ㅏ = 마", ru: "Волшебная ㅁ" },
  { k: "gap",   em: "🌳🍅", ko: "나_", ru: "Пропавший слог" }
];
window.MIRAE_PARTS = [{ g: "Домик лисички", t: MODES.map(m => ({ k: m.k, n: m.ru })) }];
if (window.MIRAE_PICK) MIRAE_PICK.keep(MODES, m => m.k);

/* ---------- audio ---------- */
const player = new Audio(); let queue = [];
function play(list) { queue = list.slice(); next(); }
function next() {
  const id = queue.shift(); if (!id) return;
  if (!AUDIO[id]) return next();
  try { player.pause(); player.src = AUDIO[id]; player.onended = next; const p = player.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}
function stopAudio() { queue = []; try { player.pause(); } catch (e) {} }

const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function shake(el) { const c = el.classList.contains("fox") ? "no" : "wrong"; el.classList.remove(c); void el.offsetWidth; el.classList.add(c); }
function yes(fox) { $(fox).classList.add("yes"); setTimeout(() => $(fox).classList.remove("yes"), 1000); }

let mode = null, again = () => {}, timers = [];
const later = (f, ms) => timers.push(setTimeout(f, ms));
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function renderWins(id, n, total) { $(id).innerHTML = Array.from({ length: total }, (_, i) => `<i class="${i < n ? "on" : ""}">${i < n ? "⭐" : ""}</i>`).join(""); }

function start(m) {
  mode = m; clearTimers(); stopAudio(); document.querySelectorAll(".confetti").forEach(c => c.remove());
  document.body.classList.toggle("hidewords", !$("showWords").checked);
  show(m); ({ house: startHouse, magic: startMagic, gap: startGap })[m]();
}
function win(pic, text, word) {
  show("win"); $("winPic").innerHTML = pic; $("winText").textContent = text;
  const w = $("winWord"); w.style.display = word ? "block" : "none"; w.textContent = word ? word.ko : "";
  w.onclick = () => word && play([word.id]);
  play(word ? ["wa", word.id] : ["wa"]);
  const em = ["⭐", "🦊", "🐶", "🐱", "🦆", "🐮", "🐸", "🐻", "ㅁ"];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement("div"); s.className = "confetti"; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + "vw"; s.style.animationDuration = 2 + Math.random() * 2 + "s"; s.style.animationDelay = Math.random() + "s";
    document.body.appendChild(s); setTimeout(() => s.remove(), 5000);
  }
}

/* ---------- mode 1: who is knocking? ---------- */
const IMG = k => `<img class="ai" src="img/${k}.webp" alt="" draggable="false">`;
/* картинки заранее, чтобы зверь появлялся сразу */
["fox", "gangaji", "goyangi", "ori", "so", "gaeguri", "gom"].forEach(k => { const i = new Image(); i.src = "img/" + k + ".webp"; });
const ANIMALS = [
  { id: "gangaji", em: IMG("gangaji"), ko: "강아지", snd: "멍멍!" },
  { id: "goyangi", em: IMG("goyangi"), ko: "고양이", snd: "야옹!" },
  { id: "ori",     em: IMG("ori"), ko: "오리",   snd: "꽥꽥!" },
  { id: "so",      em: IMG("so"), ko: "소",     snd: "음매!" },
  { id: "gaeguri", em: IMG("gaeguri"), ko: "개구리", snd: "개굴개굴!" }
];
const BEAR = { id: "gom", em: IMG("gom"), ko: "곰", snd: "쿵쿵!" };
const SOUND = { gangaji: "s_meong", goyangi: "s_yaong", ori: "s_kkwaek", so: "s_eumme", gaeguri: "s_gaegul", gom: "s_kungkung" };
let order1 = [], step1 = 0, target1 = null, busy1 = false;
function startHouse() {
  order1 = shuffle(ANIMALS).concat([BEAR]); step1 = 0;
  const hs = $("hs"); hs.classList.remove("fall", "shake"); hs.style.opacity = "";
  $("wgrid").innerHTML = order1.map(() => `<div class="win"></div>`).join("");
  roundHouse();
}
function roundHouse() {
  busy1 = false; target1 = order1[step1];
  $("bub1").innerHTML = "똑똑!<small>누구야?</small>";
  $("door").innerHTML = "?";
  const d = $("door"); d.classList.remove("knock"); void d.offsetWidth; d.classList.add("knock");
  /* the bear is never a wrong option before he comes — he is the surprise at the end */
  const pool = target1 === BEAR ? ANIMALS : ANIMALS.filter(a => a !== target1);
  const opts = shuffle([target1, ...shuffle(pool).slice(0, 2)]);
  $("picks").innerHTML = "";
  opts.forEach(a => {
    const b = document.createElement("button"); b.className = "pick";
    b.innerHTML = `<span class="em">${a.em}</span><span class="w">${a.ko}</span>`;
    b.onclick = () => pickHouse(a, b); $("picks").appendChild(b);
  });
  again = () => play(["ttok", "nugu", SOUND[target1.id]]);
  later(again, 350);
}
function pickHouse(a, el) {
  if (busy1) return;
  if (a !== target1) { shake(el); shake($("fox1")); play(["w_" + a.id, "aniya", SOUND[target1.id]]); return; }
  busy1 = true; el.classList.add("right"); yes("fox1");
  $("door").innerHTML = a.em; $("bub1").innerHTML = a.ko + (a === BEAR ? "이야!" : "야!") + "<small>나야!</small>";
  if (a === BEAR) {
    play(["a_gom", "s_kungkung", "kung", "wahaha"]);
    later(() => { const w = $("wgrid").children[step1]; w.innerHTML = a.em; w.classList.add("in"); $("hs").classList.add("shake"); }, 1600);
    later(() => { $("hs").classList.remove("shake"); $("hs").classList.add("fall"); $("bub1").innerHTML = "쿵!<small>와하하!</small>"; }, 2700);
    later(() => win(["gom", "fox", "gangaji", "goyangi", "ori", "so", "gaeguri"].map(k => `<img class="ai mini" src="img/${k}.webp" alt="">`).join(""), "곰 не поместился, и домик упал — 쿵! Все смеются: 와하하! Построим новый? Нажмите 또!"), 4800);
    return;
  }
  play(["a_" + a.id, "deureowa"]);
  later(() => { const w = $("wgrid").children[step1]; w.innerHTML = a.em; w.classList.add("in"); step1++; roundHouse(); }, 2600);
}

/* ---------- mode 2: magic ㅁ ---------- */
const VM = { "ㅏ": "마", "ㅗ": "모", "ㅜ": "무", "ㅣ": "미" };
const NM = { "ㅏ": "나", "ㅗ": "노", "ㅜ": "누", "ㅣ": "니" };
const GOAL2 = 8; let score2 = 0, target2 = null, busy2 = false, last2 = null;
function startMagic() { score2 = 0; last2 = null; roundMagic(); }
function roundMagic() {
  busy2 = false; renderWins("wins2", score2, GOAL2);
  const easy = score2 < 2, ear = score2 >= 4;     /* rounds 1–4: build ㅁ + vowel; rounds 5–8: ㄴ or ㅁ by ear */
  $("builder").style.display = ear ? "none" : "flex"; $("ear").style.display = ear ? "block" : "none";
  const box = $("keys"); box.innerHTML = "";
  const vowels = Object.keys(VM).filter(v => v !== last2);
  const v = rnd(easy ? vowels.filter(x => x === "ㅏ" || x === "ㅣ") : vowels); last2 = v;
  if (!ear) {
    target2 = v;
    $("vslot").textContent = "?"; $("result").textContent = " ";
    ["vslot", "result"].forEach(id => $(id).classList.remove("made"));
    $("bub2").textContent = VM[v] + "!";
    shuffle(easy ? ["ㅏ", "ㅣ", "ㅜ"] : Object.keys(VM)).forEach(k => {
      const b = document.createElement("button"); b.className = "kbtn"; b.textContent = k;
      b.onclick = () => pickV(k, b); box.appendChild(b);
    });
    again = () => play(["y_" + VM[target2]]);
  } else {
    const isM = Math.random() < .5;
    target2 = isM ? VM[v] : NM[v];
    $("bub2").innerHTML = "나? 마?<small>послушай</small>";
    shuffle([VM[v], NM[v]]).forEach(s => {
      const b = document.createElement("button"); b.className = "kbtn big"; b.textContent = s;
      b.onclick = () => pickEar(s, b); box.appendChild(b);
    });
    again = () => play(["y_" + target2]);
  }
  later(again, 350);
}
function pickV(k, el) {
  if (busy2) return;
  $("vslot").textContent = k; $("result").textContent = VM[k];
  ["vslot", "result"].forEach(id => { const e = $(id); e.classList.remove("made"); void e.offsetWidth; e.classList.add("made"); });
  if (k === target2) { busy2 = true; yes("fox2"); play(["y_" + VM[k], "jalhaesseo"]); score2++; renderWins("wins2", score2, GOAL2); later(score2 >= GOAL2 ? winMagic : roundMagic, 2200); }
  else { shake(el); shake($("fox2")); play(["y_" + VM[k], "aniya", "y_" + VM[target2]]); }   /* hears what was made, then the target */
}
function pickEar(s, el) {
  if (busy2) return;
  if (s === target2) { busy2 = true; el.classList.add("right"); yes("fox2"); play(["y_" + s, "jalhaesseo"]); score2++; renderWins("wins2", score2, GOAL2); later(score2 >= GOAL2 ? winMagic : roundMagic, 2000); }
  else { shake(el); shake($("fox2")); play(["y_" + s, "aniya", "y_" + target2]); }
}
function winMagic() { win("✨ㅁ✨", "ㅁ — окошко! ㅁ + ㅏ = 마, ㅁ + ㅜ = 무. А вместе с ㄴ получается слово:", { ko: "나무", id: "w_namu" }); }

/* ---------- mode 3: missing syllable ---------- */
const WORDS = { namu: { w: "나무", em: "🌳" }, tomato: { w: "토마토", em: "🍅" }, moja: { w: "모자", em: "🧢" } };
const ROUNDS3 = [
  { id: "namu", gap: 1, opts: ["누", "우"] }, { id: "tomato", gap: 1, opts: ["나", "아"] },
  { id: "moja", gap: 0, opts: ["노", "오"] }, { id: "namu", gap: 0, opts: ["마", "아"] },
  { id: "tomato", gap: 1, opts: ["노", "미"] }, { id: "namu", gap: 1, opts: ["모", "미"] }
];
let order3 = [], step3 = 0, cur3 = null, busy3 = false;
function startGap() { order3 = shuffle(ROUNDS3.slice(0, 5)).concat([ROUNDS3[5]]); step3 = 0; roundGap(); }   /* the last word is always 나무 */
function roundGap() {
  busy3 = false; renderWins("wins3", step3, order3.length);
  cur3 = order3[step3]; const W = WORDS[cur3.id], sy = Array.from(W.w); cur3.ans = sy[cur3.gap];
  $("pic").textContent = W.em; $("pic").classList.remove("eat");
  const word = $("word"); word.innerHTML = "";
  sy.forEach((s, i) => {
    const c = document.createElement("div"); c.className = "cell" + (i === cur3.gap ? " gap" : "");
    c.textContent = i === cur3.gap ? "?" : s;
    c.onclick = () => play([AUDIO["y_" + (i === cur3.gap ? cur3.ans : s)] ? "y_" + (i === cur3.gap ? cur3.ans : s) : "w_" + cur3.id]);
    if (i === cur3.gap) c.id = "gapcell"; word.appendChild(c);
  });
  const box = $("opts"); box.innerHTML = "";
  shuffle([cur3.ans, ...cur3.opts]).forEach(o => {
    const b = document.createElement("button"); b.className = "kbtn"; b.textContent = o;
    b.onclick = () => pickGap(o, b); box.appendChild(b);
  });
  again = () => play(["w_" + cur3.id]);
  later(again, 350);
}
function pickGap(o, el) {
  if (busy3) return;
  if (o !== cur3.ans) { shake(el); play(["y_" + o, "aniya"]); return; }
  busy3 = true; el.style.visibility = "hidden";
  const g = $("gapcell"); g.textContent = o; g.className = "cell filled"; $("pic").classList.add("eat");
  play(["y_" + o, "w_" + cur3.id]); step3++; renderWins("wins3", step3, order3.length);
  later(step3 >= order3.length ? () => win("🌳", "Все слоги нашлись! Прочитай вслух:", { ko: "나무", id: "w_namu" }) : roundGap, 3000);
}

/* ---------- menu & wiring ---------- */
MODES.forEach(m => {
  const b = document.createElement("button"); b.className = "btn"; b.dataset.mode = m.k;
  b.innerHTML = `<span class="em">${m.em}</span><span class="ko">${m.ko}</span>${m.ru}`;
  b.onclick = () => { play(["annyeong"]); setTimeout(() => start(m.k), 800); };
  $("modes").appendChild(b);
});
function home() { clearTimers(); stopAudio(); show("menu"); }
document.querySelectorAll(".home").forEach(b => b.onclick = home);
document.querySelectorAll(".again").forEach(b => b.onclick = () => again());
["fox1", "fox2", "bub1", "bub2", "pic", "ear"].forEach(id => $(id).onclick = () => again());
$("door").onclick = () => again();
$("playAgain").onclick = () => start(mode);
$("toMenu").onclick = home;
$("peek").onclick = () => play(["kkakkung"]);
</script>
</body>
</html>
