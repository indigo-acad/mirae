<script src="data/materials.js"></script><script src="data/hangul.js"></script><script src="data/clt-a1.js"></script><script src="data/l12-jiyo.js"></script><script src="data/l11-adaju.js"></script><script src="data/p12-jiyo-1.js"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/words2.js"></script><script src="js/srs.js"></script><script src="js/assistant.js"></script>
<script>
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var MAP={};MATERIALS.forEach(function(m){MAP[m.id]=m});
var cur=null,students=[],assigned=[],filt='all',sel={},signup=null,voc=null,vlang='ko';
var teachers=null;   // список преподавателей для владельца школы; null — на сервере ещё нет supabase/teachers.sql
var wsets=null,SETMAP={};   // словари преподавателя (supabase/vocab2.sql); null — файла на сервере ещё нет
var wp={id:null,words:null};   // слова выбранного словаря: ученику можно дать весь словарь или отмеченные слова
var hws=null;   // домашка ученика (supabase/homework.sql); null — файла на сервере ещё нет
var stw={};     // журнал занятий словами по дням (state.wl, пишет js/vocab.js): новые слова и повторения
var tg={src:'week',lang:'ko',l:'',n:15,k:{tr:1,rev:1,ctx:1,wr:1},min:10};   // тест на начало урока: откуда слова, сколько, какие вопросы
var hwf={lang:'ko',l:'',sel:{},th:{},mats:{},open:false};   // форма «Задать домашку»: язык, урок в списке, отмеченные задания, теория, материалы
function isOwner(){return !!(KR.ctx&&KR.ctx.owner)}
function msg(t,ok){var e=$('#msg');if(e){e.textContent=t;e.className='msg '+(ok?'ok':'bad')}}
function genPin(){var a=new Uint32Array(1);crypto.getRandomValues(a);return String(100000+a[0]%900000)}
function loginFrom(email,login){var l=(login||'').trim()||String(email||'').split('@')[0];return l.toLowerCase().replace(/[^a-z0-9а-яё._-]/g,'').slice(0,40)}
function inviteText(login,pin){var u=location.href.replace(/[^\/]*$/,'')+'auth.html';return 'Привет! Твой личный кабинет в MIRAÉ готов.\nСсылка: '+u+'\nЛогин: '+login+'\nPIN: '+pin+'\nС ними можно войти с любого устройства.'}
function teacherInviteText(login,pin){var u=location.href.replace(/[^\/]*$/,'')+'auth.html';return 'Здравствуйте! Ваш кабинет преподавателя в MIRAÉ готов.\nСсылка: '+u+'\nЛогин: '+login+'\nPIN: '+pin+'\nПосле входа откроется панель «Ученики»: там ваши ученики и задания.'}
function showInvite(id,login,pin,teacher){var t=teacher?teacherInviteText(login,pin):inviteText(login,pin);
  $('#'+id).innerHTML='<p style="margin:10px 0 4px"><b>'+(teacher?'Сообщение преподавателю':'Сообщение ученику')+'</b></p><textarea id="invt" readonly style="width:100%;min-height:110px;box-sizing:border-box;padding:8px;font:inherit">'+esc(t)+'</textarea><div class="done-row"><span class="muted">PIN больше нигде не показывается, скопируй сейчас</span><button class="pri" id="cp">Скопировать</button></div>';
  $('#cp').onclick=function(){var ta=$('#invt');ta.select();var done=function(){msg('Скопировано',true)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,function(){document.execCommand('copy');done()});else{document.execCommand('copy');done()}}}
var LESS=(window.COURSE0?COURSE0.lessons.map(function(l){return [l.id,'한글 · '+l.tag+' · '+l.title]}):[]).concat(window.COURSE3?COURSE3.lessons.map(function(l){return [l.id,'CLT A1 · '+l.tag+' · '+l.title]}):[]).concat([['l12-jiyo','1급 · 12과 · -지요?'],['l11-adaju','2급 · 11과 · -아/어다 주다'],['p12-jiyo-1','Отработка -지요']]);
function fmtDate(t){if(!t)return '';var d=new Date(t);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function normA(s){return String(s).normalize('NFC').replace(/[\s?.!,]/g,'').toLowerCase()}
function corr(it){return Array.isArray(it.a)?it.a[0]:it.a}
function wrongList(b,p){
  if(p.hist&&p.hist.length)return p.hist[p.hist.length-1].w.map(function(x){return{i:x[0],g:x[1]}});
  var out=[],v=p.v||{};
  b.items.forEach(function(it,i){if(v[i]==null)return;var ok=b.type==='fill'?it.a.some(function(a){return normA(a)===normA(v[i])}):v[i]===it.a;if(!ok)out.push({i:i,g:v[i]})});
  return out;
}
function lessonProgress(state){
  var P=(state&&state.progress)||{},weak=[],blocksHtml='';
  LESS.forEach(function(x){
    var L=window.LESSONS[x[0]];if(!L)return;
    var p=P[x[0]]||{},n=0,t=0,last=0,errs=0,rows='';
    L.sections.forEach(function(s){if(KR.part(s)==='hw')return;   // «Домашнее задание» из урока в прогресс не входит, как и у ученика
      s.blocks.forEach(function(b,i){
      t++;var q=p[s.id+'-'+i]||{};if(q.done)n++;if(q.t>last)last=q.t;
      if((b.type==='fill'||b.type==='choice'||b.type==='build')&&q.score!=null){
        var wl=wrongList(b,q);errs+=wl.length;
        rows+='<div style="margin:10px 0"><div class="line" style="justify-content:space-between;align-items:center"><b>'+esc(b.title)+'</b><span class="badge '+(q.done?'ok':'warn')+'">'+q.score+' из '+q.total+(q.tries?' · проверок '+q.tries:'')+'</span></div>'+
          wl.map(function(w){var it=b.items[w.i];if(!it)return '';
            return '<div class="ko" style="font-size:15px;padding:3px 0 3px 10px;margin:3px 0;border-left:3px solid var(--bad)">'+esc(it.q||it.p||('🔊 '+it.say))+'<br><span class="muted">Ответ: «'+esc(w.g===''||w.g==null?'пусто':w.g)+'», верно: «'+esc(corr(it))+'»</span></div>'}).join('')+'</div>';
        var ms=q.miss||{};
        Object.keys(ms).forEach(function(k){var it=b.items[k];if(it)weak.push({n:ms[k],q:it.q||it.p||it.say,a:corr(it),l:x[1]})});
      }
    })});
    var sum='<b>'+esc(x[1])+'</b> <span class="muted">· '+n+' из '+t+' блоков'+(last?' · '+fmtDate(last):'')+(errs?' · ошибок сейчас: '+errs:'')+'</span>';
    window.__lessonHtml=(window.__lessonHtml||'')+'<details style="margin:8px 0"><summary style="cursor:pointer;padding:4px 0">'+sum+'</summary>'+(rows||'<p class="muted">Упражнения ещё не проверялись.</p>')+'</details>';
  });
  var body=window.__lessonHtml||'';window.__lessonHtml='';
  weak.sort(function(a,b){return b.n-a.n});
  var wh=weak.length?weak.slice(0,8).map(function(w){return '<div class="ko" style="font-size:15px;padding:3px 0 3px 10px;margin:3px 0;border-left:3px solid var(--gold)"><b>'+w.n+'×</b> '+esc(w.q)+' <span class="muted">→ '+esc(w.a)+' · '+esc(w.l)+'</span></div>'}).join(''):'<p class="muted">Повторяющихся ошибок пока нет. Они копятся с каждой проверкой упражнений.</p>';
  return '<p style="margin:12px 0 4px"><b>Чаще всего ошибается</b></p>'+wh+'<p style="margin:14px 0 4px"><b>Прогресс по урокам</b> <span class="muted">(нажми на урок, чтобы увидеть ошибки)</span></p>'+body;
}
var REG=[['closed','Закрыта'],['code','По коду школы'],['open','Открыта']];
var REG_HINT={closed:'Учеников создаёт только преподаватель: форма «Добавить ученика» выше.',code:'Ученик регистрируется сам на странице входа, если знает код школы. Отправь ему код вместе со ссылкой на сайт.',open:'Зарегистрироваться может любой, у кого есть ссылка на сайт. Не больше 40 регистраций в сутки.'};
function regName(m){return (REG.filter(function(x){return x[0]===m})[0]||REG[0])[1].toLowerCase()}
function regCard(){
  if(!signup)return '<div class="card"><h3>Регистрация учеников</h3><p class="muted">Сейчас учеников создаёт только преподаватель. Чтобы ученики могли регистрироваться сами, выполни в Supabase файл supabase/registration.sql (SQL Editor → New query → вставить → Run) и обнови эту страницу.</p></div>';
  var m=signup.draft||signup.mode;
  return '<div class="card"><h3>Регистрация учеников</h3><div class="opts">'+REG.map(function(x){return '<button data-reg="'+x[0]+'" class="'+(m===x[0]?'sel':'')+'" aria-pressed="'+(m===x[0])+'">'+x[1]+'</button>'}).join('')+'</div><p class="muted" style="margin:10px 0 0">'+REG_HINT[m]+'</p>'+
    (m==='code'?'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><input id="regc" class="name" aria-label="Код школы" placeholder="Код школы, от 4 символов" maxlength="40" value="'+esc(signup.codeDraft!=null?signup.codeDraft:signup.code)+'" style="flex:1;min-width:180px;margin:0" autocomplete="off"><button id="regg">Придумать код</button></div>':'')+
    '<div class="done-row"><span class="muted">Сейчас регистрация '+regName(signup.mode)+(m!==signup.mode?' · изменение не сохранено':'')+'</span><button class="pri" id="regs">Сохранить</button></div></div>';
}
function isNew(s){return !!s.signup_at&&!s.assigned}
async function boot(){
  if(!KR.require())return;KR.topbar('teacher');
  var ctx=await KR.load();KR.topbar('teacher');
  if(!ctx.ok){$('#m').innerHTML='<div class="card"><p>Нет связи с сервером. Панель преподавателя работает только онлайн.</p></div>';return}
  if(ctx.pending){$('#m').innerHTML='<div class="card"><h3>Заявка ждёт подтверждения</h3><p class="muted">Владелец школы подтвердит заявку, и здесь откроется панель преподавателя.</p></div>';return}
  if(!ctx.teacher){$('#m').innerHTML='<div class="card"><h3>Только для преподавателя</h3><p class="muted">Этот раздел открыт для аккаунта преподавателя.</p></div>';return}
  try{students=await KR.api('teacher_students')||[]}catch(e){$('#m').innerHTML='<div class="card"><p>Не удалось загрузить учеников.</p></div>';return}
  try{signup=await KR.api('teacher_signup_settings')}catch(e){signup=null}
  if(isOwner()){try{teachers=await KR.api('owner_teachers')||[]}catch(e){teachers=null}}
  await loadWsets();
  draw();
}

// ---------- преподаватели (только владелец школы, supabase/teachers.sql) ----------
var ROLE={owner:'владелец',teacher:'преподаватель',pending:'заявка'};
function teachersCard(){
  if(teachers===null)return '<div class="card"><h3>Преподаватели</h3><p class="muted">Чтобы добавлять преподавателей и принимать заявки, выполните в Supabase файл supabase/teachers.sql (SQL Editor → New query → вставить → Run) и обновите эту страницу.</p></div>';
  var h='<div class="card"><h3>Преподаватели</h3>';
  h+=teachers.map(function(t){var st=t.status==='pending'?'pending':t.role;
    var btn=st==='pending'?'<button class="pri" data-tok="'+esc(t.name)+'">Подтвердить</button><button data-tno="'+esc(t.name)+'">Отклонить</button>'
      :st==='teacher'?'<button data-trm="'+esc(t.name)+'">Снять роль</button>':'';
    return '<div class="line" style="align-items:center;justify-content:space-between;gap:10px"><div style="min-width:0"><div class="cap">'+esc(t.name)+' <span class="badge'+(st==='pending'?' warn':st==='owner'?' ok':'')+'">'+ROLE[st]+'</span></div><div class="muted">'+
      esc(t.email||'email не указан')+(st==='pending'?' · заявка от '+fmtDate(t.created_at):' · учеников: '+(st==='owner'?'все':t.students))+'</div></div><span style="display:inline-flex;gap:8px;flex-wrap:wrap">'+btn+'</span></div>'}).join('');
  h+='<p style="margin:16px 0 6px"><b>Добавить преподавателя</b></p><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="tem" type="email" class="name" placeholder="Email преподавателя" style="flex:2;min-width:200px;margin:0"><input id="tlg" class="name" placeholder="Логин (по желанию)" style="flex:1;min-width:140px;margin:0" autocomplete="off"></div><div class="done-row"><span class="muted">Преподаватель видит только своих учеников, вы — всех</span><button class="pri" id="tadd">Создать</button></div><div id="tinv"></div>';
  var code=signup&&signup.teacher_code||'';
  h+='<p style="margin:16px 0 6px"><b>Код преподавателя</b></p><p class="muted" style="margin:0 0 8px">По нему преподаватель подаёт заявку сам: страница входа → «Регистрация» → «Я преподаватель». Доступ к ученикам появится после вашего подтверждения. Пустой код выключает заявки.</p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><input id="tcode" class="name" aria-label="Код преподавателя" placeholder="Код, от 6 символов" maxlength="40" value="'+esc(code)+'" style="flex:1;min-width:180px;margin:0" autocomplete="off"><button id="tcg">Придумать код</button><button class="pri" id="tcs">Сохранить</button></div></div>';
  return h;
}
async function reloadTeachers(){try{teachers=await KR.api('owner_teachers')||[]}catch(e){}try{students=await KR.api('teacher_students')||students}catch(e){}draw()}
function draw(){
  var h='<div class="card"><h3>Ученики</h3>';
  var list=students.filter(function(s){return s.name!==KR.user()});
  if(!list.length)h+='<p class="muted">Пока нет учеников. Добавь первого ниже.</p>';
  h+='<div class="opts">'+list.map(function(s){var lead=isOwner()&&s.teacher&&s.teacher!==KR.user()?'<span class="badge">'+esc(s.teacher)+'</span>':'';
    return '<button data-st="'+esc(s.name)+'" class="'+(cur===s.name?'sel':'')+' cap">'+esc(s.name)+' · '+s.assigned+(isNew(s)?'<span class="badge new">новый</span>':'')+lead+'</button>'}).join('')+'</div>'+
    (isOwner()&&teachers&&teachers.length>1?'<p class="muted" style="margin:8px 0 0">У учеников других преподавателей рядом с именем стоит их преподаватель.</p>':'')+'</div>';
  h+='<div class="card"><h3>Добавить ученика</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="nem" type="email" class="name" placeholder="Email ученика" style="flex:2;min-width:200px;margin:0"><input id="nlg" class="name" placeholder="Логин (по желанию)" style="flex:1;min-width:140px;margin:0" autocomplete="off"></div><div class="done-row"><span class="muted">Если логин пустой, возьмётся часть email до «@»</span><button class="pri" id="add">Создать</button></div><div id="inv"></div></div>';
  if(isOwner()){h+=regCard();h+=teachersCard()}
  if(cur)h+='<div id="stud"></div>';
  h+='<p id="msg" class="msg" role="status" aria-live="polite"></p>';
  $('#m').innerHTML=h;
  if(cur)drawStudent();
}
/* Словарь ученика: сколько слов, какие даются трудно, добавление новых. Слово, которое у ученика уже есть,
   после повторного добавления вернётся к нему на повторение раньше. */
// материалы из папки materials/: отчёты «Отправить учителю», время занятий и отметки «Пройдено» (их пишет js/bridge.js)
function mins(sec){sec=sec||0;if(sec<60)return 'меньше минуты';var m=Math.round(sec/60);return m<60?m+' мин':Math.floor(m/60)+' ч '+(m%60)+' мин'}
function matTitle(id){var m=MAP[id];return m?m.title:id}
function materialsCard(state){
  var mat=(state&&state.mat)||{},rep=((state&&state.rep)||[]).slice().sort(function(a,b){return (b.t||0)-(a.t||0)}),
      taken=(state&&state.taken&&state.taken.l)||[];
  var h='<p style="margin:16px 0 4px"><b>Отчёты из тестов и игр</b> <span class="muted">(кнопка «Отправить учителю» в материале)</span></p>';
  h+=rep.length?rep.slice(0,15).map(function(r,i){
    return '<details class="rep"'+(i===0?' open':'')+'><summary><b>'+esc(matTitle(r.m))+'</b> <span class="muted">· '+fmtDate(r.t)+'</span></summary><pre>'+esc(r.x)+'</pre></details>'}).join('')+
    (rep.length>15?'<p class="muted">Показаны последние 15 отчётов из '+rep.length+'.</p>':'')
    :'<p class="muted">Отчётов пока нет. Они появятся здесь, когда ученик пройдёт тест или игру и нажмёт «Отправить учителю».</p>';
  var ids=Object.keys(mat);taken.forEach(function(id){if(ids.indexOf(id)<0)ids.push(id)});
  ids.sort(function(a,b){return ((mat[b]||{}).l||0)-((mat[a]||{}).l||0)});
  h+='<p style="margin:16px 0 4px"><b>Занятия в материалах</b></p>';
  h+=ids.length?ids.map(function(id){var m=mat[id]||{},done=taken.indexOf(id)>=0;
    return '<div class="line" style="align-items:center;justify-content:space-between;gap:10px"><div style="min-width:0"><div>'+esc(matTitle(id))+'</div><div class="muted">'+
      (m.o?'открыт '+m.o+' '+(m.o%10===1&&m.o%100!==11?'раз':(m.o%10>=2&&m.o%10<=4&&(m.o%100<10||m.o%100>=20))?'раза':'раз')+' · '+mins(m.s)+' · последний раз '+fmtDate(m.l):'отмечено учеником')+'</div></div>'+
      (done?'<span class="badge ok">пройдено</span>':'')+'</div>'}).join('')
    :'<p class="muted">Ученик ещё не открывал материалы. Время и открытия считаются с этого обновления сайта, когда ученик вошёл на сайт.</p>';
  return h;
}
function vocabCard(){
  if(!voc)return '<div class="card"><h3>Словарь ученика</h3><p class="muted">Чтобы видеть словарь ученика и добавлять ему слова, выполни в Supabase файл supabase/vocab.sql (SQL Editor → New query → вставить → Run) и обнови эту страницу. До этого словарь хранится только на устройстве ученика.</p></div>';
  var now=Date.now(),day=SRS.dayStart(now)+SRS.DAY;
  var cnt=function(l){return voc.filter(function(c){return c.l===l}).length};
  var due=voc.filter(function(c){return !c.st||(c.st===2?c.due<day:c.due<=now)}).length;
  var hw=function(c){return (c.lap||0)*2+(c.pe||0)*2+(c.b||0)};   // забывания в тренажёре, ошибки в упражнениях уроков, повторные добавления
  var hard=voc.filter(function(c){return c.lap||c.b||c.pe}).sort(function(a,b){return hw(b)-hw(a)}).slice(0,8);
  var row=function(c,del){return '<div class="line" style="align-items:center;justify-content:space-between"><div><b'+(c.l==='ko'?' class="ko"':'')+' lang="'+esc(c.l)+'">'+esc(c.w)+'</b> <span class="muted">· '+esc(c.t||'без перевода')+
    (c.lap?' · забывалось: '+c.lap:'')+(c.pe?' · ошибок в упражнениях: '+c.pe:'')+(c.b?' · добавляли повторно: '+c.b:'')+(c.star?' · сложное для ученика':'')+'</span></div>'+(del?'<button data-vdel="'+esc(c.id)+'" aria-label="Убрать слово">'+KR.icon('trash',15)+'</button>':'')+'</div>'};
  var h='<div class="card"><h3>Словарь ученика</h3><p class="muted">Корейский: '+cnt('ko')+' · английский: '+cnt('en')+' · к повторению сегодня: '+due+'</p>'+wordActivity();
  if(hard.length)h+='<p style="margin:12px 0 4px"><b>Даются трудно</b></p>'+hard.map(function(c){return row(c,false)}).join('');

/* ---------- как ученик учит слова: новые и повторения ----------
   По дням — из журнала ученика (state.wl: n — начато новых слов, r — повторений и шагов изучения, ok — верных ответов).
   Пока журнала нет (ученик ещё не открывал обновлённый сайт), дни считаются по карточкам слов приблизительно:
   первый показ слова — «новое», последнее повторение — «повторение». */
function dayKeyT(t){var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function wordDays(){
  var now=Date.now(),days=[],by={},approx=!Object.keys(stw).length;
  for(var i=13;i>=0;i--){var t=SRS.dayStart(now)-i*SRS.DAY,d={k:dayKeyT(t),t:t,n:0,r:0,ok:0,last:0};days.push(d);by[d.k]=d}
  if(!approx)Object.keys(stw).forEach(function(k){var d=by[k],x=stw[k]||{};if(d){d.n=x.n||0;d.r=x.r||0;d.ok=x.ok||0;d.last=x.t||0}});
  else (voc||[]).forEach(function(c){var f=c.fr&&by[dayKeyT(c.fr)],l=c.lr&&by[dayKeyT(c.lr)];if(f)f.n++;if(l&&l!==f)l.r++});
  return {days:days,approx:approx};
}
function dayLabel(t){return new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
function wordActivity(){
  var D=wordDays(),days=D.days,wk=days.slice(7),now=Date.now(),W=7*SRS.DAY;
  var sum=function(a,k){return a.reduce(function(s,d){return s+d[k]},0)},act=wk.filter(function(d){return d.n+d.r>0}).length;
  var last=Math.max.apply(null,[0].concat(Object.keys(stw).map(function(k){return (stw[k]||{}).t||0}),(voc||[]).map(function(c){return c.lr||0})));
  var started=(voc||[]).filter(function(c){return c.fr&&c.fr>=now-W}).sort(function(a,b){return b.fr-a.fr});
  var reviewed=(voc||[]).filter(function(c){return c.lr&&c.lr>=now-W&&!(c.fr&&c.fr>=now-W)}).sort(function(a,b){return b.lr-a.lr});
  var late=(voc||[]).filter(function(c){return c.st===2&&c.due<now-2*SRS.DAY}).length;
  var mx=Math.max.apply(null,days.map(function(d){return d.n+d.r}).concat([1])),top=mx<=5?5:mx<=10?10:Math.ceil(mx/10)*10;
  var lst=function(a){return a.slice(0,12).map(function(c){return '<b'+(c.l==='ko'?' class="ko"':'')+' lang="'+esc(c.l)+'">'+esc(c.w)+'</b>'}).join(', ')+(a.length>12?' и ещё '+(a.length-12):'')};
  var tile=function(n,t){return '<div><b>'+n+'</b><span class="muted">'+t+'</span></div>'};
  var h='<div class="wlog"><p class="wlog-h"><b>Как учит слова</b> <span class="muted">· последние 14 дней'+(D.approx?' · приблизительно, по карточкам слов':'')+'</span></p>'+
    '<div class="wlog-t">'+tile(sum(wk,'n'),'новых начато за 7 дней')+tile(sum(wk,'r'),'повторений за 7 дней')+tile(act+' из 7','дней с занятиями')+'</div>'+
    '<p class="muted wlog-l">'+(last?'Последнее занятие: '+fmtDate(last):'Словами ещё не занимался(-ась).')+(late?' · <span class="wlog-late">не повторено вовремя: '+late+'</span>':'')+'</p>';
  // столбики по дням: снизу повторения, сверху новые; подсказка при наведении и таблица ниже
  h+='<div class="wch-legend"><span><i class="wn"></i>новые слова</span><span><i class="wr"></i>повторения</span><span class="muted">шкала до '+top+'</span></div>'+
    '<div class="wch" role="img" aria-label="Новые слова и повторения по дням за 14 дней; цифры — в таблице ниже">'+days.map(function(d,i){
      var tip=dayLabel(d.t)+': новых '+d.n+' · повторений '+d.r+(d.ok&&!D.approx?' · верно '+d.ok+' из '+(d.n+d.r):'');
      return '<div class="wch-c" tabindex="0" data-tip="'+esc(tip)+'"><div class="wch-b">'+(d.r?'<i class="wr" style="height:'+(d.r/top*100).toFixed(1)+'%"></i>':'')+(d.n?'<i class="wn" style="height:'+(d.n/top*100).toFixed(1)+'%"></i>':'')+'</div></div>'}).join('')+'<div class="wch-tip" hidden></div></div>'+
    '<div class="wch-x" aria-hidden="true">'+days.map(function(d,i){return '<span>'+(i%2?'':new Date(d.t).getDate())+'</span>'}).join('')+'</div>'+
    '<details class="wch-tbl"><summary>По дням</summary><table><tr><th>День</th><th>Новые</th><th>Повторения</th>'+(D.approx?'':'<th>Верно</th>')+'</tr>'+days.slice().reverse().filter(function(d){return d.n+d.r}).map(function(d){return '<tr><td>'+dayLabel(d.t)+'</td><td>'+d.n+'</td><td>'+d.r+'</td>'+(D.approx?'':'<td>'+d.ok+'</td>')+'</tr>'}).join('')+'</table></details>';
  if(started.length)h+='<p class="wlog-w"><b>Начал(а) учить за неделю · '+started.length+':</b> '+lst(started)+'</p>';
  if(reviewed.length)h+='<p class="wlog-w"><b>Повторил(а) старые за неделю · '+reviewed.length+':</b> '+lst(reviewed)+'</p>';
  return h+'</div>';
}

    if(rm==='code'&&rc.length<4){msg('Придумай код школы: от 4 символов');return}
    b.disabled=true;
    try{await KR.api('teacher_set_signup',{p_mode:rm,p_code:rc});signup={mode:rm,code:rc};draw();msg('Сохранено: регистрация '+regName(rm),true)}
    catch(x){b.disabled=false;msg('Не получилось сохранить')}
  }
  else if(b.id==='del'){
    if(!confirm('Удалить ученика '+cur+'? Его кабинет, прогресс и назначения будут удалены. Это нельзя отменить.'))return;
    try{await KR.api('teacher_delete_student',{p_student:cur});var gone=cur;cur=null;students=await KR.api('teacher_students')||students;draw();msg('Ученик удалён: '+gone,true)}
    catch(x){msg('Не получилось удалить')}
  }
  else if(b.dataset.vl){vlang=b.dataset.vl;var keep=$('#vtext')?$('#vtext').value:'';await drawStudent();if($('#vtext'))$('#vtext').value=keep}
  else if(b.id==='vadd'){
    var ws=parseWords($('#vtext').value,vlang);
    if(!ws.length){msg('Впиши слова: каждое с новой строки, «слово — перевод»');return}
    if(ws.some(function(w){return !w.t})){msg('У каждого слова нужен перевод: «слово — перевод»');return}
    b.disabled=true;
    try{var r=await KR.api('teacher_vocab_add',{p_student:cur,p_words:ws});await drawStudent();msg('Добавлено слов: '+(r&&r.added||0)+((r&&r.bumped)?' · уже были и вернутся раньше: '+r.bumped:''),true)}
    catch(x){console.error('teacher_vocab_add error:', x); b.disabled=false; msg('ошибка добавления:'+(x.message||x.details||'неизвестная ошибка'));}
  }
  else if(b.dataset.vdel){
    if(!confirm('Убрать слово из словаря ученика?'))return;
    try{await KR.api('teacher_vocab_delete',{p_student:cur,p_ids:[b.dataset.vdel]});await drawStudent();msg('Слово убрано',true)}catch(x){msg('Не получилось убрать слово')}
  }
  else if(b.dataset.tok||b.dataset.tno){var who=b.dataset.tok||b.dataset.tno,ok=!!b.dataset.tok;
    if(!ok&&!confirm('Отклонить заявку '+who+'? Аккаунт останется обычным, его можно удалить из списка учеников.'))return;
    try{await KR.api('owner_approve_teacher',{p_login:who,p_ok:ok});await reloadTeachers();msg(ok?'Заявка подтверждена: '+who:'Заявка отклонена',true)}catch(x){msg('Не получилось')}}
  else if(b.dataset.trm){var tr=b.dataset.trm;
    if(!confirm('Снять с '+tr+' роль преподавателя? Его ученики вернутся к вам.'))return;
    try{await KR.api('owner_remove_teacher',{p_login:tr});await reloadTeachers();msg('Роль снята: '+tr,true)}catch(x){msg('Не получилось снять роль')}}
  else if(b.id==='tadd'){
    var tem=($('#tem').value||'').trim(),tlg=loginFrom(tem,$('#tlg').value);
    if(!/^\S+@\S+\.\S+$/.test(tem)){msg('Введите email преподавателя');return}
    if(tlg.length<2){msg('Логин получился слишком коротким, впишите свой');return}
    var tpin=genPin();b.disabled=true;
    try{await KR.api('owner_add_teacher',{p_login:tlg,p_email:tem,p_new_pin:tpin});await reloadTeachers();showInvite('tinv',tlg,tpin,true);msg('Преподаватель создан: '+tlg,true)}
    catch(x){b.disabled=false;msg(/exists/.test(x.message)?'Такой логин уже есть, впишите другой':'Не получилось создать преподавателя')}
  }
  else if(b.id==='tcg'){var ab='ABCDEFGHJKMNPQRSTUVWXYZ23456789',rr=new Uint32Array(6),cc='';crypto.getRandomValues(rr);for(var q=0;q<6;q++)cc+=ab[rr[q]%ab.length];$('#tcode').value='TEACH-'+cc}
  else if(b.id==='tcs'){var tc=($('#tcode').value||'').trim();
    if(tc&&tc.length<6){msg('Код преподавателя: от 6 символов');return}
    try{await KR.api('owner_set_teacher_code',{p_code:tc});signup=Object.assign({},signup,{teacher_code:tc});draw();msg(tc?'Код сохранён: заявки включены':'Заявки преподавателей выключены',true)}catch(x){msg('Не получилось сохранить код')}}
  else if(b.dataset.st){cur=b.dataset.st;sel={};draw()}
  else if(b.dataset.f){filt=b.dataset.f;drawStudent()}
  else if(b.dataset.un){try{await KR.api('teacher_unassign',{p_student:cur,p_material:b.dataset.un});students=await KR.api('teacher_students')||students;draw();msg('Убрано',true)}catch(x){msg('Не получилось убрать')}}
  else if(b.id==='go'){
    var ids=Object.keys(sel).filter(function(k){return sel[k]});if(!ids.length){msg('Выбери хотя бы один материал');return}
    var due=$('#due').value||null,note=$('#note').value||'';b.disabled=true;
    try{for(var i=0;i<ids.length;i++)await KR.api('teacher_assign',{p_student:cur,p_material:ids[i],p_due:due,p_note:note});sel={};students=await KR.api('teacher_students')||students;draw();msg('Назначено: '+ids.length,true)}
    catch(x){msg('Не получилось назначить. Проверь, что SQL выполнен.');b.disabled=false}
  }
});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.m){sel[t.dataset.m]=t.checked;count()}
  if(t.id==='wsel'){var d=$('#wpk');if(d&&d.open)wpLoad();else wpSync()}});
// владелец передаёт ученика другому преподавателю («Ведёт» в карточке ученика)
document.addEventListener('change',async function(e){
  if(e.target.id!=='lead')return;
  try{await KR.api('owner_assign_student',{p_student:cur,p_teacher:e.target.value});students=await KR.api('teacher_students')||students;
    teachers=await KR.api('owner_teachers')||teachers;draw();msg(e.target.value?'Теперь ученика ведёт '+e.target.value:'Ученик снова у вас',true)}
  catch(x){msg('Не получилось передать ученика')}
});
boot();
</script>
</body>
</html>
