<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ученики · MIRAÉ</title>
<meta name="theme-color" content="#0B1535">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="topbar"></div>
<header class="band"><div class="in"><small>Преподаватель</small><h1>Ученики и задания</h1><p>Назначай материалы: ученик увидит только их</p></div></header>
<main id="m"></main>
<script src="data/materials.js"></script><script src="data/l12-jiyo.js"></script><script src="data/l11-adaju.js"></script><script src="data/p12-jiyo-1.js"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/srs.js"></script><script src="js/assistant.js"></script>
<script>
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var MAP={};MATERIALS.forEach(function(m){MAP[m.id]=m});
var cur=null,students=[],assigned=[],filt='all',sel={},signup=null,voc=null,vlang='ko';
function msg(t,ok){var e=$('#msg');if(e){e.textContent=t;e.className='msg '+(ok?'ok':'bad')}}
function genPin(){var a=new Uint32Array(1);crypto.getRandomValues(a);return String(100000+a[0]%900000)}
function loginFrom(email,login){var l=(login||'').trim()||String(email||'').split('@')[0];return l.toLowerCase().replace(/[^a-z0-9а-яё._-]/g,'').slice(0,40)}
function inviteText(login,pin){var u=location.href.replace(/[^\/]*$/,'')+'auth.html';return 'Привет! Твой личный кабинет в MIRAÉ готов.\nСсылка: '+u+'\nЛогин: '+login+'\nPIN: '+pin+'\nС ними можно войти с любого устройства.'}
function showInvite(id,login,pin){var t=inviteText(login,pin);
  $('#'+id).innerHTML='<p style="margin:10px 0 4px"><b>Сообщение ученику</b></p><textarea id="invt" readonly style="width:100%;min-height:110px;box-sizing:border-box;padding:8px;font:inherit">'+esc(t)+'</textarea><div class="done-row"><span class="muted">PIN больше нигде не показывается, скопируй сейчас</span><button class="pri" id="cp">Скопировать</button></div>';
  $('#cp').onclick=function(){var ta=$('#invt');ta.select();var done=function(){msg('Скопировано',true)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,function(){document.execCommand('copy');done()});else{document.execCommand('copy');done()}}}
var LESS=[['l12-jiyo','1급 · 12과 · -지요?'],['l11-adaju','2급 · 11과 · -아/어다 주다'],['p12-jiyo-1','Отработка -지요']];
function fmtDate(t){if(!t)return '';var d=new Date(t);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function normA(s){return String(s).normalize('NFC').replace(/[\s?.!,]/g,'').toLowerCase()}
function corr(it){return Array.isArray(it.a)?it.a[0]:it.a}
function wrongList(b,p){
  if(p.hist&&p.hist.length)return p.hist[p.hist.length-1].w.map(function(x){return{i:x[0],g:x[1]}});
  var out=[],v=p.v||{};
  b.items.forEach(function(it,i){if(v[i]==null)return;var ok=b.type==='fill'?it.a.some(function(a){return normA(a)===normA(v[i])}):v[i]===it.a;if(!ok)out.push({i:i,g:v[i]})});
  return out;
}
function lessonProgress(state){
  var P=(state&&state.progress)||{},weak=[],blocksHtml='';
  LESS.forEach(function(x){
    var L=window.LESSONS[x[0]];if(!L)return;
    var p=P[x[0]]||{},n=0,t=0,last=0,errs=0,rows='';
    L.sections.forEach(function(s){s.blocks.forEach(function(b,i){
      t++;var q=p[s.id+'-'+i]||{};if(q.done)n++;if(q.t>last)last=q.t;
      if((b.type==='fill'||b.type==='choice')&&q.score!=null){
        var wl=wrongList(b,q);errs+=wl.length;
        rows+='<div style="margin:10px 0"><div class="line" style="justify-content:space-between;align-items:center"><b>'+esc(b.title)+'</b><span class="badge '+(q.done?'ok':'warn')+'">'+q.score+' из '+q.total+(q.tries?' · проверок '+q.tries:'')+'</span></div>'+
          wl.map(function(w){var it=b.items[w.i];if(!it)return '';
            return '<div class="ko" style="font-size:15px;padding:3px 0 3px 10px;margin:3px 0;border-left:3px solid var(--bad)">'+esc(it.q)+'<br><span class="muted">Ответ: «'+esc(w.g===''||w.g==null?'пусто':w.g)+'», верно: «'+esc(corr(it))+'»</span></div>'}).join('')+'</div>';
        var ms=q.miss||{};
        Object.keys(ms).forEach(function(k){var it=b.items[k];if(it)weak.push({n:ms[k],q:it.q,a:corr(it),l:x[1]})});
      }
    })});
    var sum='<b>'+esc(x[1])+'</b> <span class="muted">· '+n+' из '+t+' блоков'+(last?' · '+fmtDate(last):'')+(errs?' · ошибок сейчас: '+errs:'')+'</span>';
    window.__lessonHtml=(window.__lessonHtml||'')+'<details style="margin:8px 0"><summary style="cursor:pointer;padding:4px 0">'+sum+'</summary>'+(rows||'<p class="muted">Упражнения ещё не проверялись.</p>')+'</details>';
  });
  var body=window.__lessonHtml||'';window.__lessonHtml='';
  weak.sort(function(a,b){return b.n-a.n});
  var wh=weak.length?weak.slice(0,8).map(function(w){return '<div class="ko" style="font-size:15px;padding:3px 0 3px 10px;margin:3px 0;border-left:3px solid var(--gold)"><b>'+w.n+'×</b> '+esc(w.q)+' <span class="muted">→ '+esc(w.a)+' · '+esc(w.l)+'</span></div>'}).join(''):'<p class="muted">Повторяющихся ошибок пока нет. Они копятся с каждой проверкой упражнений.</p>';
  return '<p style="margin:12px 0 4px"><b>Чаще всего ошибается</b></p>'+wh+'<p style="margin:14px 0 4px"><b>Прогресс по урокам</b> <span class="muted">(нажми на урок, чтобы увидеть ошибки)</span></p>'+body;
}
var REG=[['closed','Закрыта'],['code','По коду школы'],['open','Открыта']];
var REG_HINT={closed:'Учеников создаёт только преподаватель: форма «Добавить ученика» выше.',code:'Ученик регистрируется сам на странице входа, если знает код школы. Отправь ему код вместе со ссылкой на сайт.',open:'Зарегистрироваться может любой, у кого есть ссылка на сайт. Не больше 40 регистраций в сутки.'};
function regName(m){return (REG.filter(function(x){return x[0]===m})[0]||REG[0])[1].toLowerCase()}
function regCard(){
  if(!signup)return '<div class="card"><h3>Регистрация учеников</h3><p class="muted">Сейчас учеников создаёт только преподаватель. Чтобы ученики могли регистрироваться сами, выполни в Supabase файл supabase/registration.sql (SQL Editor → New query → вставить → Run) и обнови эту страницу.</p></div>';
  var m=signup.draft||signup.mode;
  return '<div class="card"><h3>Регистрация учеников</h3><div class="opts">'+REG.map(function(x){return '<button data-reg="'+x[0]+'" class="'+(m===x[0]?'sel':'')+'" aria-pressed="'+(m===x[0])+'">'+x[1]+'</button>'}).join('')+'</div><p class="muted" style="margin:10px 0 0">'+REG_HINT[m]+'</p>'+
    (m==='code'?'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><input id="regc" class="name" aria-label="Код школы" placeholder="Код школы, от 4 символов" maxlength="40" value="'+esc(signup.codeDraft!=null?signup.codeDraft:signup.code)+'" style="flex:1;min-width:180px;margin:0" autocomplete="off"><button id="regg">Придумать код</button></div>':'')+
    '<div class="done-row"><span class="muted">Сейчас регистрация '+regName(signup.mode)+(m!==signup.mode?' · изменение не сохранено':'')+'</span><button class="pri" id="regs">Сохранить</button></div></div>';
}
function isNew(s){return !!s.signup_at&&!s.assigned}
async function boot(){
  if(!KR.require())return;KR.topbar('teacher');
  var ctx=await KR.load();KR.topbar('teacher');
  if(!ctx.ok){$('#m').innerHTML='<div class="card"><p>Нет связи с сервером. Панель преподавателя работает только онлайн.</p></div>';return}
  if(!ctx.teacher){$('#m').innerHTML='<div class="card"><h3>Только для преподавателя</h3><p class="muted">Этот раздел открыт для аккаунта преподавателя.</p></div>';return}
  try{students=await KR.api('teacher_students')||[]}catch(e){$('#m').innerHTML='<div class="card"><p>Не удалось загрузить учеников.</p></div>';return}
  try{signup=await KR.api('teacher_signup_settings')}catch(e){signup=null}
  draw();
}
function draw(){
  var h='<div class="card"><h3>Ученики</h3>';
  var list=students.filter(function(s){return s.name!==KR.user()});
  if(!list.length)h+='<p class="muted">Пока нет учеников. Добавь первого ниже.</p>';
  h+='<div class="opts">'+list.map(function(s){return '<button data-st="'+esc(s.name)+'" class="'+(cur===s.name?'sel':'')+' cap">'+esc(s.name)+' · '+s.assigned+(isNew(s)?'<span class="badge new">новый</span>':'')+'</button>'}).join('')+'</div></div>';
  h+='<div class="card"><h3>Добавить ученика</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="nem" type="email" class="name" placeholder="Email ученика" style="flex:2;min-width:200px;margin:0"><input id="nlg" class="name" placeholder="Логин (по желанию)" style="flex:1;min-width:140px;margin:0" autocomplete="off"></div><div class="done-row"><span class="muted">Если логин пустой, возьмётся часть email до «@»</span><button class="pri" id="add">Создать</button></div><div id="inv"></div></div>';
  h+=regCard();
  if(cur)h+='<div id="stud"></div>';
  h+='<p id="msg" class="msg" role="status" aria-live="polite"></p>';
  $('#m').innerHTML=h;
  if(cur)drawStudent();
}
/* Словарь ученика: сколько слов, какие даются трудно, добавление новых. Слово, которое у ученика уже есть,
   после повторного добавления вернётся к нему на повторение раньше. */
function vocabCard(){
  if(!voc)return '<div class="card"><h3>Словарь ученика</h3><p class="muted">Чтобы видеть словарь ученика и добавлять ему слова, выполни в Supabase файл supabase/vocab.sql (SQL Editor → New query → вставить → Run) и обнови эту страницу. До этого словарь хранится только на устройстве ученика.</p></div>';
  var now=Date.now(),day=SRS.dayStart(now)+SRS.DAY;
  var cnt=function(l){return voc.filter(function(c){return c.l===l}).length};
  var due=voc.filter(function(c){return !c.st||(c.st===2?c.due<day:c.due<=now)}).length;
  var hard=voc.filter(function(c){return c.lap||c.b}).sort(function(a,b){return ((b.lap||0)*2+(b.b||0))-((a.lap||0)*2+(a.b||0))}).slice(0,8);
  var row=function(c,del){return '<div class="line" style="align-items:center;justify-content:space-between"><div><b'+(c.l==='ko'?' class="ko"':'')+' lang="'+esc(c.l)+'">'+esc(c.w)+'</b> <span class="muted">· '+esc(c.t||'без перевода')+
    (c.lap?' · забывал: '+c.lap:'')+(c.b?' · добавляли повторно: '+c.b:'')+(c.star?' · отмечено учеником':'')+'</span></div>'+(del?'<button data-vdel="'+esc(c.id)+'" aria-label="Убрать слово">'+KR.icon('trash',15)+'</button>':'')+'</div>'};
  var h='<div class="card"><h3>Словарь ученика</h3><p class="muted">Корейский: '+cnt('ko')+' · английский: '+cnt('en')+' · к повторению сегодня: '+due+'</p>';
  if(hard.length)h+='<p style="margin:12px 0 4px"><b>Даются трудно</b></p>'+hard.map(function(c){return row(c,false)}).join('');
  h+='<p style="margin:14px 0 4px"><b>Добавить слова</b></p><div class="opts">'+[['ko','Корейский'],['en','Английский']].map(function(x){return '<button data-vl="'+x[0]+'" class="'+(vlang===x[0]?'sel':'')+'" aria-pressed="'+(vlang===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'+
    '<textarea id="vtext" aria-label="Слова для ученика" placeholder="Каждое слово с новой строки: слово — перевод&#10;Можно с примером: слово — перевод | пример | перевод примера" style="min-height:120px"></textarea>'+
    '<div class="done-row"><span class="muted">Если слово у ученика уже есть, оно вернётся на повторение раньше</span><button class="pri" id="vadd">Добавить в словарь</button></div>';
  if(voc.length)h+='<details style="margin-top:10px"><summary style="cursor:pointer;padding:4px 0"><b>Все слова</b> <span class="muted">· '+voc.length+'</span></summary>'+voc.slice().sort(function(a,b){return (b.a||0)-(a.a||0)}).map(function(c){return row(c,true)}).join('')+'</details>';
  return h+'</div>';
}
function parseWords(text,lang){
  var now=Date.now();
  return text.split(/\n+/).map(function(l){return l.trim()}).filter(Boolean).map(function(l,i){
    var parts=l.split('|').map(function(x){return x.trim()}),m=parts[0].split(/\s+[—–-]\s+|\t|\s*=\s*/),w=(m[0]||'').trim(),t=m.slice(1).join(' — ').trim();
    return w&&w.length<=80?SRS.make(lang,w,t,{ex:parts[1],et:parts[2],src:'teacher'},now+i):null;
  }).filter(Boolean);
}
async function drawStudent(){
  var as=[],st=null;
  try{as=await KR.api('teacher_assignments',{p_student:cur})||[];st=await KR.api('teacher_student_state',{p_student:cur})}catch(e){}
  try{voc=await KR.api('teacher_vocab',{p_student:cur})||[]}catch(e){voc=null}   // null — на сервере ещё нет supabase/vocab.sql
  assigned=as;var have={};as.forEach(function(a){have[a.id]=1});
  var info=students.filter(function(x){return x.name===cur})[0]||{};
  var h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><h3 class="cap" style="margin:0">'+esc(cur)+'</h3><div class="muted">'+esc(info.email||'email не указан')+(info.signup_at?' · зарегистрировался сам '+fmtDate(info.signup_at):'')+'</div></div><span style="display:inline-flex;gap:8px;flex-wrap:wrap"><button id="rst">Сбросить PIN</button>'+(signup?'<button id="del">'+KR.icon('trash',15)+' Удалить</button>':'')+'</span></div><div id="inv2"></div><p style="margin:12px 0 4px"><b>Назначено</b></p>';
  if(!as.length)h+='<p class="muted">Пока ничего не назначено.</p>';
  h+=as.map(function(a){var m=MAP[a.id]||{title:a.id,kind:''};
    return '<div class="line" style="align-items:center;justify-content:space-between"><div><div>'+esc(m.title)+'</div><div class="muted">'+esc((window.KINDS||{})[m.kind]||'')+(a.due?' · срок '+esc(a.due):'')+(a.note?' · '+esc(a.note):'')+'</div></div><button data-un="'+esc(a.id)+'">Убрать</button></div>'}).join('');
  h+=''+lessonProgress(st)+'<p class="note" style="margin-top:8px">Тренажёры и игры хранят прогресс внутри себя, здесь он пока не виден.</p></div>';
  h+=vocabCard();
  h+='<div class="card"><h3>Назначить материалы</h3><div class="opts" id="flt"><button data-f="all" class="'+(filt==='all'?'sel':'')+'">Все</button>'+Object.keys(SECTIONS).map(function(k){return '<button data-f="'+k+'" class="'+(filt===k?'sel':'')+'">'+esc(SECTIONS[k])+'</button>'}).join('')+'</div><div style="margin-top:8px;max-height:340px;overflow:auto">';
  MATERIALS.filter(function(m){return !have[m.id]&&(filt==='all'||m.section===filt)}).forEach(function(m){
    h+='<label class="line" style="align-items:center;cursor:pointer"><input type="checkbox" data-m="'+esc(m.id)+'" '+(sel[m.id]?'checked':'')+'><span style="flex:1">'+esc(m.title)+'<span class="muted"> · '+esc((window.KINDS||{})[m.kind]||'')+(m.level?' · '+esc(m.level):'')+'</span></span></label>'});
  h+='</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><input id="due" type="date" class="name" style="flex:1;min-width:150px;margin:0"><input id="note" class="name" placeholder="Комментарий (по желанию)" style="flex:2;min-width:180px;margin:0"></div><div class="done-row"><span class="muted" id="cnt"></span><button class="pri" id="go">Назначить выбранные</button></div></div>';
  $('#stud').innerHTML=h;count();
}
function count(){var n=Object.keys(sel).filter(function(k){return sel[k]}).length;var e=$('#cnt');if(e)e.textContent=n?('Выбрано: '+n):''}
document.addEventListener('click',async function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='add'){
    var em=($('#nem').value||'').trim(),lg=loginFrom(em,$('#nlg').value);
    if(!/^\S+@\S+\.\S+$/.test(em)){msg('Введи email ученика');return}
    if(lg.length<2){msg('Логин получился слишком коротким, впиши свой');return}
    var pin=genPin();b.disabled=true;
    try{await KR.api('teacher_create_student',{p_login:lg,p_email:em,p_new_pin:pin});
      students=await KR.api('teacher_students')||students;draw();showInvite('inv',lg,pin);msg('Ученик создан: '+lg,true)}
    catch(x){b.disabled=false;msg(/exists/.test(x.message)?'Такой логин уже есть, впиши другой':/bad_input/.test(x.message)?'Некорректный логин или email':'Не получилось. Проверь, что supabase/invite-students.sql выполнен.')}
  }
  else if(b.id==='rst'){
    if(!confirm('Сбросить PIN ученика '+cur+'? Старый PIN перестанет работать.'))return;
    var np=genPin();
    try{await KR.api('teacher_reset_pin',{p_student:cur,p_new_pin:np});showInvite('inv2',cur,np);msg('PIN сброшен',true)}
    catch(x){msg('Не получилось сбросить PIN')}
  }
  else if(b.dataset.reg){var ci=$('#regc');if(ci)signup.codeDraft=ci.value;signup.draft=b.dataset.reg;draw()}
  else if(b.id==='regg'){var abc='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r=new Uint32Array(5),c='';crypto.getRandomValues(r);for(var k=0;k<5;k++)c+=abc[r[k]%abc.length];$('#regc').value='MIRAE-'+c}
  else if(b.id==='regs'){
    var rm=signup.draft||signup.mode,rc=$('#regc')?$('#regc').value.trim():signup.code;
    if(rm==='code'&&rc.length<4){msg('Придумай код школы: от 4 символов');return}
    b.disabled=true;
    try{await KR.api('teacher_set_signup',{p_mode:rm,p_code:rc});signup={mode:rm,code:rc};draw();msg('Сохранено: регистрация '+regName(rm),true)}
    catch(x){b.disabled=false;msg('Не получилось сохранить')}
  }
  else if(b.id==='del'){
    if(!confirm('Удалить ученика '+cur+'? Его кабинет, прогресс и назначения будут удалены. Это нельзя отменить.'))return;
    try{await KR.api('teacher_delete_student',{p_student:cur});var gone=cur;cur=null;students=await KR.api('teacher_students')||students;draw();msg('Ученик удалён: '+gone,true)}
    catch(x){msg('Не получилось удалить')}
  }
  else if(b.dataset.vl){vlang=b.dataset.vl;var keep=$('#vtext')?$('#vtext').value:'';await drawStudent();if($('#vtext'))$('#vtext').value=keep}
  else if(b.id==='vadd'){
    var ws=parseWords($('#vtext').value,vlang);
    if(!ws.length){msg('Впиши слова: каждое с новой строки, «слово — перевод»');return}
    if(ws.some(function(w){return !w.t})){msg('У каждого слова нужен перевод: «слово — перевод»');return}
    b.disabled=true;
    try{var r=await KR.api('teacher_vocab_add',{p_student:cur,p_words:ws});await drawStudent();msg('Добавлено слов: '+(r&&r.added||0)+((r&&r.bumped)?' · уже были и вернутся раньше: '+r.bumped:''),true)}
    catch(x){console.error('teacher_vocab_add error:', x); b.disabled=false; msg('ошибка добавления:'+(x.message||x.details||'неизвестная ошибка'));}
  }
  else if(b.dataset.vdel){
    if(!confirm('Убрать слово из словаря ученика?'))return;
    try{await KR.api('teacher_vocab_delete',{p_student:cur,p_ids:[b.dataset.vdel]});await drawStudent();msg('Слово убрано',true)}catch(x){msg('Не получилось убрать слово')}
  }
  else if(b.dataset.st){cur=b.dataset.st;sel={};draw()}
  else if(b.dataset.f){filt=b.dataset.f;drawStudent()}
  else if(b.dataset.un){try{await KR.api('teacher_unassign',{p_student:cur,p_material:b.dataset.un});students=await KR.api('teacher_students')||students;draw();msg('Убрано',true)}catch(x){msg('Не получилось убрать')}}
  else if(b.id==='go'){
    var ids=Object.keys(sel).filter(function(k){return sel[k]});if(!ids.length){msg('Выбери хотя бы один материал');return}
    var due=$('#due').value||null,note=$('#note').value||'';b.disabled=true;
    try{for(var i=0;i<ids.length;i++)await KR.api('teacher_assign',{p_student:cur,p_material:ids[i],p_due:due,p_note:note});sel={};students=await KR.api('teacher_students')||students;draw();msg('Назначено: '+ids.length,true)}
    catch(x){msg('Не получилось назначить. Проверь, что SQL выполнен.');b.disabled=false}
  }
});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.m){sel[t.dataset.m]=t.checked;count()}});
boot();
</script>
</body>
</html>
