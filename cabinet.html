<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Личный кабинет · MIRAÉ</title>
<meta name="theme-color" content="#0B1535">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="topbar"></div>
<header class="band"><div class="in"><small>Личный кабинет</small><h1 id="who"></h1><p id="role">Прогресс, задания от преподавателя и домашка</p></div></header>
<main id="m"></main>
<script src="data/course.js"></script><script src="data/materials.js"></script><script src="data/hangul.js"></script><script src="data/clt-a1.js"></script><script src="data/l12-jiyo.js"></script><script src="data/l11-adaju.js"></script><script src="data/p12-jiyo-1.js"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/srs.js"></script><script src="js/vocab.js"></script><script src="js/assistant.js"></script>
<script>
/* Кабинет показывает раздел текущего языка (переключатель в шапке): корейский — уроки курса, английский — материалы программы. */
var MAP={};MATERIALS.forEach(function(m){MAP[m.id]=m});
var esc=KR.esc,first=true;
var ALL=(window.COURSE0?COURSE0.lessons:[]).concat(window.COURSE3?COURSE3.lessons:[]).concat(COURSE.lessons).concat((window.COURSE2||{lessons:[]}).lessons.filter(function(l){return l.id}));
function lessonRow(l){
  if(!l.id) return '<div class="lcard lock" style="padding:6px 0"><div class="no" style="width:40px;height:40px;font-size:17px">'+l.no+'</div><div class="mid muted">'+l.no+'과 · скоро</div></div>';
  if(!KR.can('lesson-'+l.id)) return '<div class="lcard lock" style="padding:6px 0"><div class="no" style="width:40px;height:40px;font-size:17px">'+l.no+'</div><div class="mid muted">'+l.no+'과 · не назначено</div></div>';
  var p=KR.progress(l.id);
  return '<a class="lessonlink" href="lesson.html?l='+l.id+'" style="display:block;padding:6px 0"><div class="lcard"><div class="no" style="width:40px;height:40px;font-size:17px">'+l.no+'</div><div class="mid"><b>'+esc(l.tag||l.no+'과')+' · <span class="ko">'+esc(l.title)+'</span></b> <span class="muted">'+p.pct+'%</span>'+KR.bar(p.pct)+'</div></div></a>';
}
function assignedRow(a){
  var m=MAP[a.id]||{title:a.title||a.id,kind:a.kind||'',path:a.path||'#'},mi=KR.matInfo(a.id);   // словари преподавателя приходят с названием из базы
  var sent=mi.rep?'<span class="badge ok" title="Отчёт сохранён на сайте, преподаватель видит его в своей панели">отчёт у преподавателя · '+new Date(mi.rep.t).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+'</span>':'';
  return '<div class="line" style="align-items:center;justify-content:space-between"><div><div>'+esc(m.title)+'</div><div class="muted">'+esc((window.KINDS||{})[m.kind]||'')+(a.due?' · срок '+esc(a.due):'')+(a.note?' · '+esc(a.note):'')+'</div></div><span style="display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">'+sent+'<a class="btn" href="'+esc(m.path)+'">Открыть'+KR.icon('arrow',15)+'</a></span></div>';
}
/* ---------- домашка от преподавателя (supabase/homework.sql) ---------- */
var HW=null;   // список с сервера; null — ещё не загружен или на сервере нет функций домашки
function plural(n,f1,f2,f5){return n%10===1&&n%100!==11?f1:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?f2:f5}
function dueText(d){
  var day=new Date(d+'T00:00'),t=new Date();t.setHours(0,0,0,0);var k=Math.round((day-t)/864e5),f=day.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  return k<0?['late','срок прошёл: '+f]:k===0?['soon','сдать сегодня']:k===1?['soon','сдать завтра']:['','сдать до '+f];
}
function hwActive(){return (HW||[]).filter(function(r){return r.status==='active'}).sort(function(a,b){return (a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:a.created-b.created})}
function hwRow(r){
  var n=0;(r.items||[]).forEach(function(it){n+=it.m?1:(it.b||[]).length});
  var P={};try{P=JSON.parse(localStorage.getItem('kr_progress:'+KR.user()+':hw-'+r.id)||'{}')}catch(e){}
  var d=Math.min(n,Object.keys(P).filter(function(k){var p=P[k];return p&&(p.done||p.total!=null)}).length);
  var du=r.due?dueText(r.due):['','срок не задан'],th=(r.theory||[])[0],other=r.lang&&r.lang!==KR.lang()&&KR.LANGS[r.lang];
  var thHref=th?(KR.can('lesson-'+th.l)?'lesson.html?l='+encodeURIComponent(th.l)+'&part=theory#'+encodeURIComponent(th.s):'lesson.html?hw='+r.id+'&th=1'):'';
  return '<div class="hw-row"><div class="hw-tx"><b>'+esc(r.title)+'</b><span class="muted"><span class="hw-due '+du[0]+'">'+du[1]+'</span> · '+(d?'сделано '+d+' из '+n:n+' '+plural(n,'задание','задания','заданий'))+(other?' · '+esc(other.name):'')+'</span>'+
    (r.note?'<span class="hw-nt">'+esc(r.note)+'</span>':'')+'</div><span class="hw-acts">'+(th?'<a class="btn" href="'+thHref+'">'+KR.icon('book',15)+'Теория</a>':'')+
    '<a class="btn pri" href="lesson.html?hw='+r.id+'">'+(d?'Продолжить':'Сделать')+KR.icon('arrow',15)+'</a></span></div>';
}
function hwCard(){
  var act=hwActive(),notes=(HW||[]).filter(function(r){return r.status==='checked'&&r.comment&&!r.seen});
  var h='<section class="card glass hwc" aria-labelledby="hwc-h"><div class="tb-h"><h3 id="hwc-h">'+KR.icon('home',20)+'Домашка</h3>'+(act.length?'<span class="badge new">'+act.length+'</span>':'')+'</div>';
  h+=notes.map(function(r){return '<div class="hw-cm"><div><b>Преподаватель проверил «'+esc(r.title)+'»</b>'+(r.result&&r.result.max?' <span class="muted">· '+r.result.score+' из '+r.result.max+'</span>':'')+'<p>'+esc(r.comment)+'</p></div><button type="button" data-hwseen="'+r.id+'">Понятно</button></div>'}).join('');
  h+=act.length?act.map(hwRow).join(''):'<p class="muted">Домашки сейчас нет. Когда преподаватель задаст, она появится здесь.</p>';
  return h+'</section>';
}
function num(n){return first?'<b data-count="'+n+'">0</b>':'<b>'+n+'</b>'}   // счётчики «набегают» только при первом показе
// сводка корейского раздела: уроки курса
function dashKo(){
  var real=ALL.filter(function(l){return l.id&&KR.can('lesson-'+l.id)});
  var n=0,t=0;real.forEach(function(l){var p=KR.progress(l.id);n+=p.n;t+=p.tot});
  var pct=t?Math.round(n/t*100):0;
  var next=real.filter(function(l){return KR.progress(l.id).pct<100})[0];
  var h='<section class="dash card glass fr" aria-label="Мой прогресс">'+KR.ring(pct,128,(first?'<span data-count="'+pct+'">0</span>':pct)+'<small>%</small>')+
    '<div class="stat"><div>'+num(real.length)+'<span class="muted">уроков назначено</span></div><div>'+num(n)+'<span class="muted">блоков пройдено</span></div><div>'+num(hwActive().length)+'<span class="muted">домашка к сдаче</span></div></div></section>';
  if(next){var np=KR.progress(next.id);
    h+='<a class="next card glass lessonlink" href="lesson.html?l='+next.id+'">'+KR.ring(np.pct,58,KR.icon('spark',18))+'<div class="mid"><span class="tag">'+(np.n?'Продолжить':'Начать')+' · '+esc(next.tag||next.no+'과')+'</span><h3 class="ko">'+esc(next.title)+'</h3><div class="muted">'+np.n+' из '+np.tot+' блоков</div></div><span class="tile-go">'+KR.icon('arrow',18)+'</span></a>'}
  // ученику — только открытые преподавателем уроки, преподавателю — вся программа
  var rows=KR.ctx.teacher?ALL:real;
  h+='<div class="card glass"><h3>Прогресс по урокам</h3>'+(rows.length?rows.map(lessonRow).join(''):'<p class="muted">Уроки появятся здесь, когда преподаватель их откроет.</p>')+'<div class="done-row"><span></span><a class="btn" href="course.html">Весь путь'+KR.icon('arrow',15)+'</a></div></div>';
  return {h:h};
}
// сводка английского раздела: материалы программы, пройденное ученик отмечает сам
function dashEn(){
  var items=MATERIALS.filter(function(m){return m.section==='english'&&m.kind!=='class'&&KR.can(m.id)}),done=KR.taken();
  var n=items.filter(function(m){return done.indexOf(m.id)>=0}).length,pct=items.length?Math.round(n/items.length*100):0;
  var next=items.filter(function(m){return done.indexOf(m.id)<0})[0],vs=KR.vocab?KR.vocab.stats('en'):{total:0};
  var h='<section class="dash card glass fr" aria-label="Мой прогресс">'+KR.ring(pct,128,(first?'<span data-count="'+pct+'">0</span>':pct)+'<small>%</small>')+
    '<div class="stat"><div>'+num(items.length)+'<span class="muted">материалов назначено</span></div><div>'+num(n)+'<span class="muted">пройдено</span></div><div>'+num(vs.total)+'<span class="muted">слов в словаре</span></div></div></section>';
  if(next)h+='<a class="next card glass lessonlink" href="'+esc(next.path)+'">'+KR.ring(0,58,KR.icon('spark',18))+'<div class="mid"><span class="tag">Продолжить · '+esc((window.KINDS||{})[next.kind]||'')+'</span><h3>'+esc(next.title)+'</h3></div><span class="tile-go">'+KR.icon('arrow',18)+'</span></a>';
  h+='<div class="card glass"><h3>Программа</h3><p class="muted">Все материалы раздела собраны на странице курса: там же отмечается пройденное.</p><div class="done-row"><span></span><a class="btn" href="course.html">Весь путь'+KR.icon('arrow',15)+'</a></div></div>';
  return {h:h};
}
/* Слова на сегодня — как на странице «Слова»: новые слова и отработка отдельно; нажатие сразу открывает нужный блок. */
function wordsCard(){
  if(!KR.vocab)return '';var lang=KR.lang(),p=KR.vocab.plan(lang),s=KR.vocab.stats(lang),nn=p.fresh.length,work=p.learn.length+p.soon.length+p.rev.length;
  return '<section class="card glass wcab" aria-labelledby="wcab-h"><div class="tb-h"><h3 id="wcab-h">'+KR.icon('abc',20)+'Слова · '+KR.LANGS[lang].name+'</h3></div><div class="wcab-2">'+
    '<a class="wcab-i" href="words.html#new"><span class="tag">'+KR.icon('spark',14)+'Новые слова</span><b>'+nn+'</b><span class="muted">'+(nn?'познакомиться':p.allNew?'на сегодня всё, ещё '+p.allNew+' завтра':'новых нет')+'</span></a>'+
    '<a class="wcab-i" href="words.html#rev"><span class="tag">'+KR.icon('repeat',14)+'Отработка</span><b>'+work+'</b><span class="muted">'+(work?'повторить сейчас':s.total?'на сегодня всё':'слов пока нет')+'</span></a></div>'+
    '<p class="muted wcab-f">'+(s.total?'В словаре: '+s.total+' · выучено: '+s.known+'. ':'Слова появятся из уроков, от преподавателя или по выделению в тексте. ')+'<a href="words.html">Открыть «Слова»</a></p></section>';
}
function draw(){
  KR.topbar('cabinet');
  var ctx=KR.ctx,lang=KR.lang(),D=KR.noCourses()?{h:KR.noCoursesCard(),hw:[]}:lang==='en'?dashEn():dashKo();
  var items=(ctx.items||[]).filter(function(a){if(/^(lesson|practice)-/.test(a.id))return false;var l=KR.langOf(a.id);return !l||l===lang});
  var h='';
  if(ctx.teacher)h+='<div class="card glass"><h3>Вы вошли как преподаватель</h3><p class="muted">Назначайте ученикам материалы и домашку и смотрите их прогресс.</p><a class="btn pri" href="teacher.html">Ученики и задания'+KR.icon('arrow',16)+'</a></div>';
  // ученик: сверху слова на сегодня, ниже домашка от преподавателя, потом курс
  if(!KR.noCourses())h+=wordsCard();
  if(!ctx.teacher&&HW!==null)h+=hwCard();
  h+=D.h;
  if(!ctx.teacher&&(items.length||!KR.noCourses())){
    h+='<div class="card glass"><h3>'+KR.icon('pin',20)+'Назначено преподавателем</h3>'+(items.length?items.map(assignedRow).join(''):'<p class="muted">'+(ctx.ok?'В этом разделе пока ничего не назначено. Преподаватель откроет тебе задания, и они появятся здесь.':'Нет связи с сервером: задания не загружены.')+'</p>')+'</div>';
  }
  var anim=localStorage.getItem('kr_sky')!=='off';
  h+='<div class="card glass"><h3>Настройки</h3><div class="line" style="align-items:center;justify-content:space-between"><div><div>Анимация фона</div><div class="muted">Падающие звёзды и движение неба</div></div><button id="anim" aria-pressed="'+anim+'">'+(anim?'Включена':'Выключена')+'</button></div>'+
    '<div class="line" style="align-items:center;justify-content:space-between"><div><div>Голос озвучки и интервалы слов</div><div class="muted">Настраиваются в разделе «Слова»</div></div><a class="btn" href="words.html">Открыть'+KR.icon('arrow',15)+'</a></div></div>';
  var ok=KR.status()==='ok';
  h+='<div class="done-row"><span class="muted">'+KR.icon(ok?'cloud':'alert',16)+' '+(ok?'Прогресс сохраняется в облаке':'Нет связи с сервером: прогресс пока только на этом устройстве')+'</span><button id="out">Выйти</button></div>';
  document.getElementById('m').innerHTML=h;if(first)KR.count(document.getElementById('m'));first=false;
  document.getElementById('out').onclick=function(){KR.logout();location.href='index.html'};
  document.getElementById('anim').onclick=function(){
    var on=localStorage.getItem('kr_sky')!=='off';localStorage.setItem('kr_sky',on?'off':'on');
    var s=document.querySelector('.shoot');if(s)s.remove();draw();
  };
}
KR.onLang=draw;
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-hwseen]');if(!b)return;var id=+b.dataset.hwseen;
  (HW||[]).forEach(function(r){if(r.id===id)r.seen=Date.now()});draw();
  KR.api('hw_seen',{p_id:id}).catch(function(){});
});
if(KR.vocab)KR.vocab.onchange=draw;
if(KR.require()){
  document.getElementById('who').textContent=KR.user();KR.topbar('cabinet');
  KR.load().then(draw).then(function(){return KR.ctx.teacher?null:KR.homework()}).then(function(l){if(l){HW=l;draw()}});
}
</script>
</body>
</html>
