<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Слова · MIRAÉ</title>
<meta name="theme-color" content="#0B1535">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="topbar"></div>
<header class="band"><div class="in"><small>Словарь</small><h1>Слова</h1><p>Интервальное повторение: слово возвращается тогда, когда его пора вспомнить</p></div></header>
<main>
  <div id="today" class="today2"></div>
  <section id="play" class="card glass play" aria-live="polite" hidden></section>
  <div class="seg wtabs" id="tabs" role="tablist" aria-label="Словарь и настройки">
    <button type="button" role="tab" data-tab="list" aria-selected="true">Мои слова</button>
    <button type="button" role="tab" data-tab="prefs" aria-selected="false">Настройки</button>
  </div>
  <section id="list"></section>
  <section id="prefs" hidden></section>
</main>
<script src="data/materials.js"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/srs.js"></script><script src="js/vocab.js"></script><script src="js/words2.js"></script><script src="js/assistant.js"></script>
<script>
/* Тренажёр слов. Расписание как в Anki (js/srs.js), игры взяты из тренажёра группы 2724:
   карточки, выбор перевода на слух, слово в предложении, письмо, сборка слова, поиск пары.
   Какая игра достанется слову, зависит от того, насколько оно выучено: сначала узнавание, потом вспоминание. */
var V=KR.vocab,esc=KR.esc,$=function(s){return document.querySelector(s)};
var lang='ko',filt='all',q='',shown=60,editing=null,S=null;        // S — текущее занятие
var URLP=new URLSearchParams(location.search),FORCE=URLP.get('game');   // ?game=wr — проверить конкретную игру
// словарь 2.0 (supabase/vocab2.sql): карточки слов из базы школы и словари от преподавателя; ?set=12 — открыть слова словаря
var INFO={},WSETS=[],sfilt=URLP.get('set')||'',tfilt='',lvfilt='',pfilt='',infoAt=0;
var GAME={cards:['Карточки','вспомни перевод и оцени себя сам'],tr:['Выбери перевод','слово звучит, нужно выбрать перевод'],
  ctx:['Слово в предложении','какое слово пропущено'],wr:['Напиши слово','по переводу, с клавиатуры'],
  build:['Собери слово','из слогов или букв'],pairs:['Найди пару','соедини слова и переводы']};
var RATE=[[1,'Снова'],[2,'Трудно'],[3,'Хорошо'],[4,'Легко']];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function wcls(c){return c.l==='ko'?' class="ko"':''}
function word(c){return '<span'+wcls(c)+' lang="'+c.l+'">'+esc(c.w)+'</span>'}
function sayBtn(text,l){return KR.canSay()?'<button type="button" class="say" data-say="'+esc(text)+'" data-l="'+l+'" aria-label="Послушать">'+KR.icon('volume',16)+'</button>':''}
function same(a,b){var n=function(s){return SRS.norm(s).replace(/[\s.,!?·~'’-]/g,'')};return n(a)!==''&&n(a)===n(b)}
function units(c){return c.w.replace(/\s+/g,'').split('')}
/* Место слова в примере: по заданной форме (f) или по основе слова. */
function cloze(c){
  if(!c.ex)return null;var f=c.f&&c.ex.indexOf(c.f)>=0?c.f:null;
  if(!f){var st=V.stem(c.l,c.w);f=c.ex.split(/\s+/).map(function(t){return t.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,'')}).filter(function(t){return t.toLowerCase().indexOf(st)===0})[0]||null}
  if(!f)return null;var i=c.ex.indexOf(f);return {a:c.ex.slice(0,i),b:c.ex.slice(i+f.length),f:f};
}

// ---------- сводка: сверху новые слова, ниже отработка ----------
/* Новые слова ученик сначала разбирает в своём блоке (перевод, пример, звук), и только потом они идут в отработку.
   В отработке — упражнения по словам, которые уже в работе: учу сейчас и повторения на сегодня. */
function drawToday(){
  var p=V.plan(lang),st=V.stats(lang),G=KR.LANGS[lang],set=V.settings(),now=Date.now();
  var cloud={cloud:['cloud','Словарь сохраняется в облаке'],local:['alert','Словарь пока хранится только на этом устройстве'],offline:['alert','Нет связи: изменения сохранятся на устройстве и отправятся позже']}[V.status];
  var box=function(n,t){return '<div><b>'+n+'</b><span class="muted">'+t+'</span></div>'};
  var busy=S&&(S.mode==='new'||S.mode==='rev')?S.mode:'',nNew=p.fresh.length,inWork=p.learn.length+p.soon.length,rev=p.rev.length;
  var h='<section class="card glass today tnew" aria-labelledby="tnew-h"><div class="tb-h"><h3 id="tnew-h">'+KR.icon('spark',20)+'Новые слова</h3>'+(nNew?'<span class="badge new">'+nNew+'</span>':'')+'</div>';
  if(busy==='new')h+='<p class="muted tb-sub">Идёт знакомство с новыми словами.</p>';
  else if(nNew){
    h+='<p class="muted tb-sub">Сначала знакомство: перевод, пример и звук. Потом слово уходит в отработку.'+(p.allNew>nNew?' Сегодня '+nNew+' из '+p.allNew+', остальные завтра.':'')+'</p>'+
      '<div class="tb-prev">'+p.fresh.slice(0,8).map(function(c){var t=trOf(c);return '<span class="chip"><b'+wcls(c)+' lang="'+c.l+'">'+esc(c.w)+'</b>'+(t?'&nbsp;· '+esc(t):'')+'</span>'}).join('')+(nNew>8?'<span class="chip">ещё '+(nNew-8)+'</span>':'')+'</div>'+
      '<div class="done-row"><span></span><button type="button" class="cta" id="gonew">Учить новые слова'+KR.icon('arrow',18)+'</button></div>';
  }
  else if(p.allNew)h+='<p class="muted tb-sub">На сегодня новые слова закончились: в день '+set.newDay+'. Ещё '+p.allNew+' — завтра. Число меняется во вкладке «Настройки».</p>';
  else h+='<p class="muted tb-sub">Новых слов нет. Они появятся из уроков, от преподавателя или когда добавишь их ниже.</p>';
  h+='</section><section class="card glass today trev" aria-labelledby="trev-h"><div class="tb-h"><h3 id="trev-h">'+KR.icon('repeat',20)+'Отработка</h3></div>'+
    '<div class="stat">'+box(inWork,'учу сейчас')+box(rev,'повторить')+box(st.total,'всего слов')+'</div>';
  if(busy==='rev')h+='';
  else if(inWork+rev)h+='<div class="done-row"><span class="muted">Упражнения по словам, которые уже в работе</span><button type="button" class="cta" id="go">Начать отработку'+KR.icon('arrow',18)+'</button></div>';
  else h+='<div class="done-row"><span class="muted">'+(st.total?(p.waiting?'Сейчас отрабатывать нечего. Ближайшее слово вернётся через '+SRS.span(p.nextAt-now)+'.':st.total>p.allNew?'На сегодня отработка закончена. Повторения появятся завтра.':'Отработка начнётся, когда разберёшь новые слова.'):'В словаре пока нет слов: '+G.ru+' раздел.')+'</span></div>';
  h+='<p class="muted cloudline">'+KR.icon(cloud[0],15)+' '+cloud[1]+'</p></section>';
  $('#today').innerHTML=h;
}

// ---------- занятие ----------
function deck(){return V.all(lang)}
function feasible(c,d){
  var g=V.settings().games,others=d.filter(function(x){return x.id!==c.id&&x.t&&x.t!==c.t}),out=[],n=units(c).length;
  if(g.cards)out.push('cards');
  if(g.tr&&c.t&&others.length>=3)out.push('tr');
  if(g.ctx&&others.length>=3&&cloze(c))out.push('ctx');
  if(g.wr&&c.t)out.push('wr');
  if(g.build&&n>=2&&n<=16)out.push('build');
  return out;
}
function choose(c,d){
  var f=feasible(c,d);
  if(FORCE&&(f.indexOf(FORCE)>=0))return FORCE;
  if(!c.st)return f.indexOf('cards')>=0?'cards':'intro';                 // новое слово сначала показываем
  var pref=(c.st===1||c.st===3)?['tr','ctx','build','cards','wr']:(c.ivl||0)<7?['ctx','tr','build','wr','cards']:['wr','build','ctx','tr','cards'];
  var av=pref.filter(function(g){return f.indexOf(g)>=0});
  return av.length?av[av.length>1&&Math.random()>.65?1:0]:'cards';
}
/* mode: new — знакомство с новыми словами на сегодня; rev — отработка (без новых слов) */
function start(mode){
  S={mode:mode==='new'?'new':'rev',done:0,known:0,sincePairs:99,right:0,wrong:0};
  if(S.mode==='new'){S.queue=V.plan(lang).fresh.map(function(c){return c.id});S.qi=0}
  $('#play').hidden=false;drawToday();nextCard();$('#play').scrollIntoView({block:'start',behavior:KR.calm()?'auto':'smooth'});
}
function stop(){KR.hush();S=null;$('#play').hidden=true;$('#play').innerHTML='';drawAll()}
function nextCard(){
  if(!S)return;KR.hush();clearTimeout(S.timer);
  if(S.mode==='new'){
    while(S.qi<S.queue.length){var c0=V.get(S.queue[S.qi]);if(c0&&!c0.st)break;S.qi++}   // слово могли удалить или разобрать на другом устройстве
    if(S.qi>=S.queue.length)return finishNew();
    S.card=V.get(S.queue[S.qi]);S.game='intro';S.lock=false;return gNew(S.card);
  }
  var p=V.plan(lang),g=V.settings().games;p.fresh=[];   // в отработке новых слов нет: они в своём блоке
  var pool=p.learn.concat(p.rev);
  if((g.pairs&&S.sincePairs>=8&&pool.length>=4&&!FORCE)||(FORCE==='pairs'&&pool.concat(p.soon).length>=4)){S.sincePairs=0;return pairs((FORCE==='pairs'?pool.concat(p.soon):pool).slice(0,5))}
  var c=SRS.pick(p);
  if(!c)return finish(p);
  S.sincePairs++;S.card=c;S.game=choose(c,deck());S.hint=false;S.retype=false;S.miss=0;S.lock=false;
  ({cards:gCards,intro:gCards,tr:gChoice,ctx:gChoice,wr:gWrite,build:gBuild})[S.game](c);
}
function frame(title,body){
  var p=V.plan(lang),left=S.mode==='new'?S.queue.length-S.qi:p.learn.length+p.rev.length+p.soon.length;
  $('#play').innerHTML='<div class="play-top"><span class="tag">'+title+'</span><span class="muted">осталось: '+left+'</span><button type="button" class="round" data-x="stop" aria-label="Закончить занятие">'+KR.icon('x',16)+'</button></div>'+body;
}
function finish(p){
  var again=p.waiting?'Ближайшее слово вернётся через '+SRS.span(p.nextAt-Date.now())+'.':'Новые повторения появятся завтра.',nf=V.plan(lang).fresh.length;
  S.mode='done';
  $('#play').innerHTML='<div class="fin"><span class="spark">'+KR.icon('spark',34)+'</span><h3>Отработка на сегодня закончена</h3><p class="muted">Упражнений: '+S.done+'. '+again+(nf?' Новых слов на сегодня: '+nf+'.':'')+'</p>'+
    '<div class="fin-acts">'+(nf?'<button type="button" class="btn pri" data-x="to-new">Учить новые слова</button>':'')+'<button type="button"'+(nf?'':' class="btn pri"')+' data-x="stop">Готово</button></div></div>';
  drawToday();
}
// ---------- знакомство с новыми словами ----------
/* Новое слово показано целиком: перевод, пример, звук, картинка. «Запомнить» — слово уходит в отработку
   (вернётся через первый шаг изучения), «Уже знаю» — сразу в повторения с интервалом «Легко». */
function gNew(c){
  var I=info(c)||{},ipa=c.l==='en'?(KR.accent()==='us'?I.ipa_us||I.ipa_uk:I.ipa_uk||I.ipa_us):'',set=V.settings(),now=Date.now();
  var src=KR.W2.source(c.src||I.src,(setById(String(c.src||'').replace('set:',''))||{}).title);
  frame('Новое слово · '+(S.qi+1)+' из '+S.queue.length,'<div class="flash newcard">'+
    (I.image?'<img class="flash-img" src="'+esc(I.image)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'')+
    '<div class="flash-w">'+word(c)+' '+sayBtn(c.w,c.l)+'</div>'+
    (ipa?'<div class="flash-ipa" lang="en">'+esc(ipa)+'</div>':'')+(I.pos?'<div class="flash-pos">'+esc(KR.W2.POS[I.pos]||I.pos)+'</div>':'')+
    '<div class="flash-t">'+esc(trOf(c)||'перевод не указан')+'</div>'+
    (c.ex?'<div class="flash-ex"><span'+wcls(c)+' lang="'+c.l+'">'+esc(c.ex)+'</span> '+sayBtn(c.ex,c.l)+(c.et?'<div class="muted">'+esc(c.et)+'</div>':'')+'</div>':'')+
    '<div class="muted new-src">'+esc(src)+'</div></div>'+
    '<div class="new-acts"><button type="button" data-x="knew">Уже знаю</button><button type="button" class="btn pri" data-x="learn">Запомнить'+KR.icon('arrow',16)+'</button></div>'+
    '<p class="muted new-hint">«Запомнить»: слово придёт в отработку через '+SRS.label(c,3,set,now)+'. «Уже знаю»: вернётся на проверку через '+SRS.label(c,4,set,now)+'.</p>');
  var b=$('[data-x="learn"]');if(b)b.focus({preventScroll:true});
  if(KR.canSay())KR.say(c.w,c.l);
}
function learnNew(g){
  if(!S||S.mode!=='new'||!S.card||S.lock)return;S.lock=true;
  V.answer(S.card.id,g);S.done++;if(g===4)S.known++;S.qi++;drawToday();nextCard();
}
function finishNew(){
  var n=S.done,k=S.known,w=n-k;S.mode='done';
  $('#play').innerHTML='<div class="fin"><span class="spark">'+KR.icon('spark',34)+'</span><h3>Новые слова разобраны</h3><p class="muted">'+
    (n?(w?'В отработке: '+w+'.':'')+(k?' Уже знакомы: '+k+'.':'')+(w?' Закрепи их сразу: несколько минут упражнений, и слова запомнятся лучше.':''):'Новых слов на сегодня нет.')+'</p>'+
    '<div class="fin-acts">'+(w?'<button type="button" class="btn pri" data-x="to-rev">Закрепить в отработке</button><button type="button" data-x="stop">Позже</button>':'<button type="button" class="btn pri" data-x="stop">Готово</button>')+'</div></div>';
  drawToday();
}
/* Записать оценку, показать, когда слово вернётся, и перейти дальше. */
function grade(g,auto){
  var c=V.answer(S.card.id,g);S.done++;if(g>1)S.right++;else S.wrong++;
  var fb=$('#fb');if(fb)fb.insertAdjacentHTML('beforeend','<div class="muted back-in">Вернётся через '+(c.st===2?SRS.span(c.ivl*SRS.DAY):SRS.span(Math.max(0,c.due-Date.now())))+'</div>');
  drawToday();
  if(auto)S.timer=setTimeout(nextCard,KR.calm()?600:1100);
  else{var b=$('#nextb');if(b){b.hidden=false;b.focus()}else nextCard()}
}
function more(c){   // пример после ответа
  return c.ex?'<div class="exbox"><div'+wcls(c)+' lang="'+c.l+'">'+esc(c.ex)+' '+sayBtn(c.ex,c.l)+'</div>'+(c.et?'<div class="muted">'+esc(c.et)+'</div>':'')+'</div>':'';
}
// карточки: вспомнил — открыл — оценил сам
function gCards(c){
  var intro=S.game==='intro',now=Date.now(),set=V.settings();
  var I=info(c)||{},ipa=c.l==='en'?(KR.accent()==='us'?I.ipa_us||I.ipa_uk:I.ipa_uk||I.ipa_us):'';
  frame(c.st?GAME.cards[0]:'Новое слово','<div class="flash" id="flash"><div class="flash-w">'+word(c)+' '+sayBtn(c.w,c.l)+'</div>'+
    (ipa?'<div class="flash-ipa" lang="en">'+esc(ipa)+'</div>':'')+
    (c.ex?'<div class="flash-ex"><span'+wcls(c)+' lang="'+c.l+'">'+esc(c.ex)+'</span> '+sayBtn(c.ex,c.l)+'</div>':'')+
    '<div class="flash-back" id="back" hidden>'+(I.image?'<img class="flash-img" src="'+esc(I.image)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'')+
    '<div class="flash-t">'+esc(trOf(c)||'перевод не указан')+'</div>'+(I.pos?'<div class="flash-pos">'+esc(KR.W2.POS[I.pos]||I.pos)+'</div>':'')+(c.et?'<div class="muted">'+esc(c.et)+'</div>':'')+'</div></div>'+
    '<div id="fb" class="q-fb"></div>'+
    '<div class="done-row" id="showrow"><span class="muted">'+(c.st?'Вспомни перевод, потом открой':'Прочитай, послушай и открой перевод')+'</span><button type="button" class="btn pri" data-x="flip">Показать перевод</button></div>'+
    '<div class="rate" id="rate" hidden>'+(intro?'<button type="button" class="btn pri" data-g="3">Дальше'+KR.icon('arrow',16)+'</button>':RATE.map(function(r){return '<button type="button" data-g="'+r[0]+'"><b>'+r[1]+'</b><small>'+SRS.label(c,r[0],set,now)+'</small></button>'}).join(''))+'</div>');
  if(c.l&&KR.canSay())KR.say(c.w,c.l);
}
function flip(){var b=$('#back');if(!b||!b.hidden)return;b.hidden=false;$('#showrow').hidden=true;$('#rate').hidden=false;var f=$('#rate button[data-g="3"]');if(f)f.focus()}
// выбор из четырёх: перевод слова или слово в предложении
function gChoice(c){
  var ctx=S.game==='ctx',d=deck().filter(function(x){return x.id!==c.id&&x.t&&x.t!==c.t}),pair=c.pair?d.filter(function(x){return x.w===c.pair}):[];
  var others=pair.concat(shuffle(d.filter(function(x){return pair.indexOf(x)<0}))).slice(0,3),opts=shuffle([c].concat(others)),cz=ctx?cloze(c):null;
  S.opts=opts;
  frame(GAME[S.game][0],(ctx?'<div class="q-word"><span'+wcls(c)+' lang="'+c.l+'">'+esc(cz.a)+'<b class="gap">(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)</b>'+esc(cz.b)+'</span></div>'+(c.et?'<p class="muted q-sub">'+esc(c.et)+'</p>':'')
      :'<div class="q-word">'+word(c)+' '+sayBtn(c.w,c.l)+'</div>')+
    '<div class="opts q-opts">'+opts.map(function(o,i){return '<button type="button" data-o="'+i+'"'+(ctx?wcls(o)+' lang="'+o.l+'"':'')+'>'+esc(ctx?o.w:o.t)+'</button>'}).join('')+'</div>'+
    '<div id="fb" class="q-fb"></div><div class="done-row"><span></span><button type="button" class="btn pri" id="nextb" data-x="next" hidden>Дальше'+KR.icon('arrow',16)+'</button></div>');
  if(!ctx)KR.say(c.w,c.l);
}
function choosePick(i){
  if(S.lock)return;S.lock=true;var c=S.card,o=S.opts[i],ok=o.id===c.id;
  [].forEach.call(document.querySelectorAll('.q-opts button'),function(b,k){b.disabled=true;if(S.opts[k].id===c.id)b.classList.add('ok');else if(k===i)b.classList.add('bad')});
  $('#fb').innerHTML='<div class="'+(ok?'ok':'bad')+'">'+(ok?'Верно':'Правильно так')+': '+word(c)+' — '+esc(c.t)+'</div>'+more(c);
  if(S.game==='ctx'&&c.ex)KR.say(c.ex,c.l);else if(!ok)KR.say(c.w,c.l);
  grade(ok?3:1,ok);
}
// письмо: перевод → слово; после ошибки слово нужно один раз перепечатать
function gWrite(c){
  var n=units(c).length;
  frame(GAME.wr[0],'<div class="q-word q-ru">'+esc(c.t)+'</div><p class="muted q-sub">'+(c.l==='ko'?'По-корейски, в словарной форме · слогов: '+n+'. Нужна корейская раскладка.':'По-английски · букв: '+n)+'</p>'+
    '<form id="wf" class="wr" autocomplete="off"><input class="name'+(c.l==='ko'?' ko':'')+'" id="win" lang="'+c.l+'" aria-label="Слово" autocapitalize="off" autocorrect="off" spellcheck="false"><button type="submit" class="btn pri">Проверить</button><button type="button" data-x="hint">Подсказка</button></form>'+
    '<div id="fb" class="q-fb"></div><div class="done-row"><span></span><button type="button" class="btn pri" id="nextb" data-x="next" hidden>Дальше'+KR.icon('arrow',16)+'</button></div>');
  $('#win').focus({preventScroll:true});
}
function writeCheck(){
  if(S.lock)return;var c=S.card,inp=$('#win'),v=inp.value;if(!v.trim())return;
  var ok=same(v,c.w);
  if(S.retype){
    if(ok){S.lock=true;inp.className='name ans-ok'+(c.l==='ko'?' ko':'');inp.disabled=true;$('#fb').innerHTML='<div class="ok">Теперь верно. Слово ещё вернётся.</div>'+more(c);grade(1,false)}
    else{inp.className='name ans-bad'+(c.l==='ko'?' ko':'');$('#fb').innerHTML='<div class="bad">Ещё не так. Напиши точно: '+word(c)+'</div>'}
    return;
  }
  KR.say(c.w,c.l);
  if(ok){S.lock=true;inp.className='name ans-ok'+(c.l==='ko'?' ko':'');inp.disabled=true;$('#fb').innerHTML='<div class="ok">Верно: '+word(c)+' — '+esc(c.t)+'</div>'+more(c);grade(S.hint?2:3,true)}
  else{S.retype=true;inp.className='name ans-bad'+(c.l==='ko'?' ko':'');$('#fb').innerHTML='<div class="bad">Правильно: <b>'+word(c)+'</b>. Перепечатай и нажми «Проверить».</div>';inp.value='';inp.focus()}
}
// сборка слова из слогов (корейский) или букв (английский)
function gBuild(c){
  var u=units(c),extra=shuffle(deck().filter(function(x){return x.id!==c.id}).map(function(x){return units(x)}).reduce(function(a,b){return a.concat(b)},[]).filter(function(ch){return u.indexOf(ch)<0})).slice(0,Math.min(3,Math.max(1,Math.round(u.length/3))));
  S.u=u;S.pos=0;S.tiles=shuffle(u.concat(extra));
  frame(GAME.build[0],'<div class="q-word q-ru">'+esc(c.t)+' '+sayBtn(c.w,c.l)+'</div><div class="slots'+(c.l==='ko'?' ko':'')+'" id="slots" aria-label="Собранное слово">'+u.map(function(){return '<i></i>'}).join('')+'</div>'+
    '<div class="tiles'+(c.l==='ko'?' ko':'')+'" id="tiles">'+S.tiles.map(function(ch,i){return '<button type="button" data-t="'+i+'" lang="'+c.l+'">'+esc(ch)+'</button>'}).join('')+'</div>'+
    '<div id="fb" class="q-fb"></div><div class="done-row"><span></span><button type="button" class="btn pri" id="nextb" data-x="next" hidden>Дальше'+KR.icon('arrow',16)+'</button></div>');
}
function buildTap(b){
  if(S.lock)return;var c=S.card,ch=S.tiles[+b.dataset.t],need=S.u[S.pos];
  if(ch.toLowerCase()!==need.toLowerCase()){S.miss++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake','bad');setTimeout(function(){b.classList.remove('bad')},500);return}
  b.disabled=true;b.classList.add('used');$('#slots').children[S.pos].textContent=need;S.pos++;
  if(S.pos<S.u.length)return;
  S.lock=true;KR.say(c.w,c.l);
  $('#fb').innerHTML='<div class="ok">'+(S.miss?'Собрано, ошибок: '+S.miss:'Верно')+': '+word(c)+' — '+esc(c.t)+'</div>'+more(c);
  grade(S.miss>=3?1:S.miss?2:3,S.miss<3);
}
// найди пару: несколько слов сразу
function pairs(cards){

    R.map(function(c){return '<button type="button" data-pt="'+esc(c.id)+'">'+esc(c.t)+'</button>'}).join('')+'</div></div><div id="fb" class="q-fb"></div>');
}
function pairTap(b){
  if(b.dataset.pw!==undefined){[].forEach.call(document.querySelectorAll('.pairs [data-pw]'),function(x){x.classList.remove('sel')});b.classList.add('sel');S.sel=b;var c=V.get(b.dataset.pw);if(c)KR.say(c.w,c.l);return}

// ---------- словарь 2.0: карточки из базы школы, словари от преподавателя (supabase/vocab2.sql) ----------
// Без этого файла на сервере всё работает как раньше: карточка слова показывает то, что есть у самого ученика.
var infoKey=function(){return 'kr_winfo:'+KR.user()};
(function(){try{var x=JSON.parse(localStorage.getItem(infoKey())||'null');if(x){INFO=x.i||{};WSETS=x.s||[]}}catch(e){}})();
async function loadInfo(){
  if(!KR.cloud.on||!KR.user())return;infoAt=Date.now();
  try{
    var r=await Promise.all([KR.api('my_words_info'),KR.api('my_word_sets')]);
    INFO=r[0]||{};WSETS=r[1]||[];
    try{localStorage.setItem(infoKey(),JSON.stringify({i:INFO,s:WSETS,t:Date.now()}))}catch(e){}
  }catch(e){if(e.status===404){INFO={};WSETS=[];try{localStorage.removeItem(infoKey())}catch(x){}}}
  if(!S&&!typing()&&!editing)drawList();
  var d=$('#wdlg');if(d&&d.open)openCard(d.dataset.id);
}
function info(c){return INFO[c.id]||null}
function trOf(c){var i=info(c);return c.t||(i&&i.tr_ru&&i.tr_ru[0])||''}
function setsHere(){return WSETS.filter(function(s){return s.lang===lang})}
function setById(id){return WSETS.filter(function(s){return String(s.id)===String(id)})[0]||null}
function fmtDue(d){var t=new Date(d+'T00:00');return isNaN(t)?d:t.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
function passV2(c){
  var i=info(c)||{},s=sfilt?setById(sfilt):null;
  if(s&&(s.cards||[]).indexOf(c.id)<0)return false;
  if(tfilt&&(i.topics||[]).indexOf(tfilt)<0)return false;
  if(lvfilt&&i.level!==lvfilt)return false;
  if(pfilt&&i.pos!==pfilt)return false;
  return true;
}
/* фильтры по словарю, теме, уровню и части речи — только те, для которых есть данные */
function selects(all){
  var T={},L={},P={};
  all.forEach(function(c){var i=info(c);if(!i)return;(i.topics||[]).forEach(function(t){T[t]=1});if(i.level)L[i.level]=1;if(i.pos)P[i.pos]=1});
  var sel=function(id,label,cur,opts){return opts.length?'<label class="fsel"><span>'+label+'</span><select id="'+id+'"><option value="">все</option>'+
    opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(cur)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select></label>':''};
  var h=sel('f-set','Словарь',sfilt,setsHere().map(function(s){return [s.id,s.title]}))+sel('f-topic','Тема',tfilt,Object.keys(T).sort().map(function(t){return [t,t]}))+
    sel('f-level','Уровень',lvfilt,Object.keys(L).sort().map(function(t){return [t,t]}))+sel('f-pos','Часть речи',pfilt,Object.keys(P).sort().map(function(t){return [t,KR.W2.POS[t]||t]}));
  return h?'<div class="fsels">'+h+'</div>':'';
}
/* словари, которые назначил преподаватель: сколько слов уже выучено */
function setsCard(){
  var ss=setsHere();if(!ss.length)return '';
  return '<div class="card glass wsets"><h3>'+KR.icon('book',20)+'Словари от преподавателя</h3>'+ss.map(function(s){
    var ids=s.cards||[],cards=ids.map(function(id){return V.get(id)}).filter(Boolean),n=cards.length||ids.length;   // преподаватель мог дать часть слов: считаем те, что есть у ученика
    var known=cards.filter(function(c){return c.st===2}).length,fresh=cards.filter(function(c){return !c.st}).length,pct=n?Math.round(known/n*100):0,on=String(sfilt)===String(s.id);
    return '<div class="wset"><div class="wset-h"><div style="min-width:0"><b>'+esc(s.title)+'</b><div class="muted">'+[s.topic,s.level,s.due?'срок '+fmtDue(s.due):'',s.note].filter(Boolean).map(esc).join(' · ')+'</div></div>'+
      '<span class="muted">выучено '+known+' из '+n+'</span></div>'+
      '<div class="bar" role="progressbar" aria-label="Выучено слов словаря «'+esc(s.title)+'»" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+known+'"><div style="width:'+pct+'%"></div></div>'+
      (s.description?'<p class="muted" style="margin:6px 0 0">'+esc(s.description)+'</p>':'')+
      '<div class="opts"><button type="button" data-sf="'+esc(s.id)+'" aria-pressed="'+on+'" class="'+(on?'sel':'')+'">'+(on?'Показаны слова словаря':'Показать слова')+'</button>'+
      (fresh?'<button type="button" data-sfirst="'+esc(s.id)+'">Учить первыми · '+fresh+'</button>':'')+'</div></div>'}).join('')+'</div>';
}
/* новые слова словаря встают в начало очереди новых слов */
function setFirst(id){
  var s=setById(id);if(!s)return;var now=Date.now(),ids=(s.cards||[]).slice(),n=0;
  ids.forEach(function(cid,k){var c=V.get(cid);if(c&&!c.st){V.update(Object.assign({},c,{pri:now+ids.length-k}));n++}});
  drawToday();drawList();
  var m=$('#wsmsg');if(!m){var box=document.querySelector('.wsets');if(box)box.insertAdjacentHTML('beforeend','<p class="msg ok" id="wsmsg" role="status"></p>');m=$('#wsmsg')}
  if(m){m.textContent=n?'Новых слов в начале очереди: '+n+'. Нажми «Учить новые слова» вверху.':'Новых слов в этом словаре нет.';m.className='msg ok'}
}
/* полная карточка слова: всё из базы школы + своё (сложное слово, заметка) */
function openCard(id){
  var c=V.get(id);if(!c)return;

    '<label class="field" for="wnote">Моя заметка</label><textarea id="wnote" class="name" rows="2" maxlength="500" placeholder="Как запомнить, где встретилось слово">'+esc(c.note||'')+'</textarea>'+
    '<div class="done-row"><button type="button" data-edit="'+esc(c.id)+'">'+KR.icon('pencil',15)+' Изменить перевод</button><button type="submit" class="btn pri">Готово</button></div></div></form>';
  if(!d.open)d.showModal();

function saveNote(){
  var d=$('#wdlg'),t=$('#wnote');if(!d||!t)return;var c=V.get(d.dataset.id),v=t.value.trim().slice(0,500);

// ---------- озвучка списка с паузами: слово, пауза, перевод ----------
// Настройки — на этом устройстве (вкладка «Настройки» → «Озвучка списка»).
var LISTROWS=[],LST=null;
function listenCfg(){var d={pause:2,tr:1,rep:1};try{var x=JSON.parse(localStorage.getItem('kr_listen')||'null');if(x&&typeof x==='object')d=Object.assign(d,x)}catch(e){}
  d.pause=Math.min(6,Math.max(1,+d.pause||2));d.rep=d.rep>1?2:1;d.tr=d.tr?1:0;return d}
function setListenCfg(c){try{localStorage.setItem('kr_listen',JSON.stringify(c))}catch(e){}}
function listenBar(){
  var c=listenCfg(),n=LISTROWS.length,meta='пауза '+c.pause+' с'+(c.tr?' · с переводом':'')+(c.rep>1?' · слово дважды':'');
  if(LST)return '<button type="button" class="btn pri" data-x="listen" aria-pressed="true">'+KR.icon('pause',16)+'Остановить</button><span class="muted" aria-live="polite">'+(LST.i+1)+' из '+LST.ids.length+'</span>';
  return '<button type="button" data-x="listen">'+KR.icon('play',16)+'Слушать список · '+n+'</button><span class="muted">'+meta+'</span><button type="button" class="linkish" data-x="listen-cfg">Настроить</button>';
}
function drawListenBar(){var e=$('#listen');if(e)e.innerHTML=listenBar()}
function markRow(id){
  [].forEach.call(document.querySelectorAll('.wrow.playing'),function(r){r.classList.remove('playing')});
  if(!id)return;var r=document.querySelector('.wrow[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
  if(r){r.classList.add('playing');r.scrollIntoView({block:'nearest',behavior:KR.calm()?'auto':'smooth'})}
}
/* одна фраза до конца: ждём окончания звука, но не дольше разумного (у некоторых браузеров событие конца теряется) */
function sayP(text,l){return new Promise(function(res){var done=false,fin=function(){if(!done){done=true;res()}};
  KR.say(text,l,{end:fin});setTimeout(fin,Math.max(4000,String(text).length*450/KR.rate()))})}
function pause(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function listen(ids){
  if(!ids.length)return;var me={ids:ids,i:0};LST=me;drawListenBar();
  var cfg=listenCfg();
  for(;me.i<ids.length;me.i++){
    if(LST!==me)return;
    var c=V.get(ids[me.i]);if(!c)continue;
    markRow(c.id);drawListenBar();
    for(var k=0;k<cfg.rep;k++){await sayP(c.w,c.l);if(LST!==me)return;if(k+1<cfg.rep)await pause(800)}
    var t=trOf(c);if(cfg.tr&&t){await pause(600);if(LST!==me)return;await sayP(t,'ru');if(LST!==me)return}
    await pause(cfg.pause*1000);
  }
  if(LST===me){LST=null;markRow(null);drawListenBar()}
}
function stopListen(){if(!LST)return;LST=null;KR.hush();markRow(null);drawListenBar()}

        '<button type="button" class="icb'+(c.star?' on':'')+'" data-star="'+esc(c.id)+'" aria-pressed="'+(!!c.star)+'" aria-label="Сложное слово">'+KR.icon('star',17)+'</button><button type="button" class="icb" data-edit="'+esc(c.id)+'" aria-label="Изменить слово">'+KR.icon('pencil',16)+'</button></div>'}).join('')+'</div>'+
      (rows.length>shown?'<div class="done-row"><span class="muted">Показано '+shown+' из '+rows.length+'</span><button type="button" data-x="more">Показать ещё</button></div>':'')
      :'<p class="muted">Ничего не найдено.</p>';
    h+='</div>';
  }
  $('#list').innerHTML=h;
  if(LST)markRow(LST.ids[LST.i]);

    '<div>'+f('p-new','Новых слов в день',s.newDay,'')+'</div>'+
    '<div>'+f('p-rev','Повторений в день',s.revDay,'')+'</div></div>'+
    '<h3>Игры</h3><p class="hint">Отметь игры для отработки. Новые слова сначала разбираются в своём блоке, вверху страницы.</p><div class="games">'+
    SRS.GAMES.map(function(g){return '<label><input type="checkbox" name="g" value="'+g+'"'+(s.games[g]?' checked':'')+'><span><b>'+GAME[g][0]+'</b><small>'+GAME[g][1]+'</small></span></label>'}).join('')+'</div>'+
    '<div class="done-row"><button type="button" data-x="reset">Вернуть как было</button><button type="submit" class="btn pri">Сохранить</button></div><p class="msg" id="pmsg" role="status"></p></form>';
  var lw=s.lw;
  h+='<div class="card glass prefs" id="lwcfg"><h3>Слова из уроков</h3><p class="hint">Что делать со словами урока, когда открываешь его в первый раз.</p><div class="opts" role="group" aria-label="Слова из новых уроков">'+
    [['ask','Спрашивать'],['auto','Добавлять сами'],['off','Не добавлять']].map(function(x){return '<button type="button" data-lw="'+x[0]+'" aria-pressed="'+(lw===x[0])+'" class="'+(lw===x[0]?'sel':'')+'">'+x[1]+'</button>'}).join('')+'</div>'+
    '<p class="hint">'+{ask:'Урок спросит, добавить ли его слова в словарь.',auto:'Слова нового урока добавятся в словарь сами, без вопроса.',off:'Слова уроков в словарь не добавляются. Нужные слова можно отметить звёздочкой в уроке.'}[lw]+'</p></div>';
  h+='<div class="card glass prefs"><h3>Озвучка · '+KR.LANGS[lang].name+'</h3>'+(KR.canSay()?
    '<label class="field" for="p-voice">Голос</label><select id="p-voice">'+(vs.length?vs.map(function(v){return '<option value="'+esc(v.name)+'"'+(cur&&cur.name===v.name?' selected':'')+'>'+esc(v.name)+'</option>'}).join(''):'<option value="">голос для этого языка не найден</option>')+'</select>'+
    '<label class="field" for="p-rate">Скорость: <span id="p-ratev">'+KR.rate().toFixed(2)+'</span></label><input type="range" id="p-rate" min="0.5" max="1.2" step="0.05" value="'+KR.rate()+'">'+
    (lang==='en'?'<span class="field">Произношение</span><div class="opts" role="group" aria-label="Произношение английского">'+[['gb','Британское'],['us','Американское']].map(function(a){return '<button type="button" data-accent="'+a[0]+'" class="'+(KR.accent()===a[0]?'sel':'')+'" aria-pressed="'+(KR.accent()===a[0])+'">'+a[1]+'</button>'}).join('')+'</div>':'')+
    '<div class="done-row"><span class="muted">'+(KR.ttsCloud()?'Говорит облачный нейроголос, голос устройства выше — запасной.':'Самые живые голоса: в браузере Microsoft Edge («Natural»), на iPhone в Safari.')+'</span><button type="button" data-x="voice">'+KR.icon('volume',16)+' Проверить</button></div>'
    :'<p class="muted">В этом браузере нет озвучки.</p>')+'</div>';
  if(KR.canSay()){var lc=listenCfg();
    h+='<div class="card glass prefs" id="lcfg"><h3>Озвучка списка</h3><p class="hint">Кнопка «Слушать список» над словами читает их по очереди: слово, перевод, пауза. Удобно в дороге и перед сном.</p>'+
      '<label class="field" for="l-pause">Пауза между словами: <span id="l-pausev">'+lc.pause+' с</span></label><input type="range" id="l-pause" min="1" max="6" step="1" value="'+lc.pause+'">'+
      '<div class="opts" role="group" aria-label="Что читать"><button type="button" data-ltr="1" aria-pressed="'+(lc.tr===1)+'" class="'+(lc.tr?'sel':'')+'">С переводом</button><button type="button" data-ltr="0" aria-pressed="'+(lc.tr===0)+'" class="'+(lc.tr?'':'sel')+'">Только слово</button></div>'+
      '<div class="opts" role="group" aria-label="Сколько раз читать слово"><button type="button" data-lrep="1" aria-pressed="'+(lc.rep===1)+'" class="'+(lc.rep===1?'sel':'')+'">Слово один раз</button><button type="button" data-lrep="2" aria-pressed="'+(lc.rep===2)+'" class="'+(lc.rep===2?'sel':'')+'">Дважды</button></div>'+
      '<p class="hint">Скорость речи — ползунок «Скорость» выше.</p></div>';
  }
  $('#prefs').innerHTML=h;
}
function savePrefs(reset){
  if(reset){V.setSettings(null);drawPrefs();drawToday();$('#pmsg').textContent='Настройки сброшены';$('#pmsg').className='msg ok';return}
  var g={};[].forEach.call(document.querySelectorAll('#pf input[name=g]'),function(i){g[i.value]=i.checked?1:0});
  V.setSettings({steps:$('#p-steps').value,grad:$('#p-grad').value,easy:$('#p-easy').value,mod:parseFloat($('#p-mod').value)/100,newDay:$('#p-new').value,revDay:$('#p-rev').value,games:g,lw:V.settings().lw});
  drawPrefs();drawToday();$('#pmsg').textContent='Сохранено';$('#pmsg').className='msg ok';
}

// ---------- массовое добавление слов с переводом DeepL ----------
function parseBulk(text){
  var seen={},out=[];
  String(text||'').split(/[\n,;]+/).forEach(function(line){
    line=line.trim();if(!line)return;
    var m=line.match(/^(.+?)\s+[—–-]\s+(.+)$/),w=(m?m[1]:line).trim(),t=m?m[2].trim():'';
    if(!w||w.length>80)return;
    var key=SRS.norm(w);if(seen[key])return;seen[key]=1;out.push({w:w,t:t});
  });
  return out.slice(0,80);
}
function drawBulkPreview(){
  var box=$('#bulk-preview');if(!box||!bulkRows.length)return;
  box.innerHTML='<div class="wl">'+bulkRows.map(function(x,i){
    return '<div class="wrow bulk-row"><div class="mid"><input class="name'+(lang==='ko'?' ko':'')+'" data-bw="'+i+'" lang="'+lang+'" value="'+esc(x.w)+'" aria-label="Слово '+(i+1)+'"><input class="name" data-bt="'+i+'" value="'+esc(x.t)+'" placeholder="Перевод (можно оставить пустым)" aria-label="Перевод '+(i+1)+'"></div></div>';
  }).join('')+'</div><div class="done-row"><span class="muted">Проверь слова и переводы перед сохранением.</span><button type="button" class="btn pri" data-x="bulk-save">Добавить в словарь · '+bulkRows.length+'</button></div>';
}
var bulkRows=[];
async function bulkTranslate(){
  var msg=$('#bulk-msg'),btn=document.querySelector('[data-x="bulk-translate"]');
  bulkRows=parseBulk($('#bulk-input').value);
  if(!bulkRows.length){msg.textContent='Вставь список слов — по одному в строке или через запятую.';msg.className='msg bad';return}
  if(btn)btn.disabled=true;
  msg.textContent='Подготавливаем список…';msg.className='msg';
  try{
    var missing=bulkRows.map(function(x,i){return x.t?null:i}).filter(function(i){return i!==null});
    if(missing.length){
      var cfg=window.CONFIG||{},res=await fetch(cfg.SUPABASE_URL+'/functions/v1/translate-words',{
        method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.SUPABASE_ANON_KEY,Authorization:'Bearer '+cfg.SUPABASE_ANON_KEY},
        body:JSON.stringify({p_name:KR.user(),p_pin:localStorage.getItem('kr_pin')||'',words:missing.map(function(i){return bulkRows[i].w})})
      });
      var data=await res.json();
      if(!res.ok)throw new Error(data.message||data.error||'Не удалось выполнить перевод');
      (data.translations||[]).forEach(function(t,j){if(t&&bulkRows[missing[j]])bulkRows[missing[j]].t=t});
    }
    drawBulkPreview();
    var done=bulkRows.filter(function(x){return x.t}).length;
    msg.textContent='Готово: '+bulkRows.length+' слов, перевод есть у '+done+'. Проверь и при необходимости исправь его ниже.';
    msg.className='msg ok';
  }catch(e){
    drawBulkPreview();
    msg.textContent='Не удалось получить автоматический перевод: '+(e.message||'ошибка').slice(0,180)+'. Слова можно заполнить вручную и всё равно сохранить.';
    msg.className='msg bad';
  }finally{if(btn)btn.disabled=false}
}
function bulkSave(){
  var rows=document.querySelectorAll('#bulk-preview [data-bw]');
  rows.forEach(function(inp){
    var i=+inp.dataset.bw,t=document.querySelector('#bulk-preview [data-bt="'+i+'"]');
    var w=inp.value.trim();if(w)V.add(lang,w,t?t.value.trim():'',{src:'manual-bulk'});
  });
  var n=rows.length;bulkRows=[];$('#bulk-preview').innerHTML='';$('#bulk-input').value='';
  var msg=$('#bulk-msg');msg.textContent='Добавлено в словарь: '+n+'.';msg.className='msg ok';drawToday();drawList();
}

// ---------- события ----------
function setTab(t){[].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.setAttribute('aria-selected',b.dataset.tab===t)});$('#list').hidden=t!=='list';$('#prefs').hidden=t!=='prefs';if(t==='prefs')drawPrefs()}
function drawAll(){lang=KR.lang();KR.topbar('words');drawToday();if(!S){drawList();if(!$('#prefs').hidden&&!typing())drawPrefs()}}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var d=b.dataset;
  if(d.say!==undefined){KR.say(d.say,d.l);return}
  if(b.id==='go'||d.x==='to-rev'){stopListen();return start('rev')}
  if(b.id==='gonew'||d.x==='to-new'){stopListen();return start('new')}
  if(d.x==='learn')return learnNew(3);
  if(d.x==='knew')return learnNew(4);
  if(d.lw){var ls=V.settings();ls.lw=d.lw;V.setSettings(ls);return drawPrefs()}
  if(d.tab)return setTab(d.tab);
  if(d.x==='stop')return stop();
  if(d.x==='flip')return flip();
  if(d.x==='next')return nextCard();
  if(d.x==='hint'){S.hint=true;var c=S.card;$('#fb').innerHTML='<div class="muted">Начинается на: <b'+wcls(c)+'>'+esc(units(c)[0])+'…</b></div>';$('#win').focus();return}
  if(d.g&&S&&S.card){var r=$('#rate');if(r)[].forEach.call(r.children,function(x){x.disabled=true});return grade(+d.g,true)}
  if(d.o!==undefined)return choosePick(+d.o);
  if(d.t!==undefined)return buildTap(b);
  if(d.pw!==undefined||d.pt!==undefined)return pairTap(b);
  if(d.f){filt=d.f;shown=60;return drawList()}
  if(d.star){var dl=$('#wdlg');if(dl&&dl.open)saveNote();V.star(d.star);drawList();drawToday();if(dl&&dl.open)openCard(d.star);return}
  if(d.open)return openCard(d.open);
  if(d.sf){sfilt=String(sfilt)===d.sf?'':d.sf;shown=60;drawList();var wl=$('#wlist');if(sfilt&&wl)wl.scrollIntoView({block:'start'});return}
  if(d.sfirst)return setFirst(d.sfirst);
  if(d.x==='listen')return LST?stopListen():listen(LISTROWS.slice());
  if(d.x==='listen-cfg'){setTab('prefs');var lc=$('#lcfg');if(lc)lc.scrollIntoView({block:'start'});return}
  if(d.edit){var dl2=$('#wdlg');if(dl2&&dl2.open)dl2.close();editing=d.edit;drawList();var ed=document.querySelector('.wedit');if(ed)ed.scrollIntoView({block:'center'});return}
  if(d.x==='cancel'){editing=null;return drawList()}
  if(d.del){if(confirm('Удалить слово из словаря? Его история повторений тоже удалится.')){V.remove(d.del);editing=null;drawAll()}return}
  if(d.x==='more'){shown+=60;return drawList()}
  if(d.x==='reset')return savePrefs(true);
  if(d.x==='voice')return KR.say(lang==='ko'?'안녕하세요! 같이 공부해요.':'Hello! Let’s learn together.',lang);
  if(d.accent){KR.setAccent(d.accent);drawPrefs();return KR.say('Hello! Let’s learn together.','en')}
  if(d.ltr!==undefined||d.lrep!==undefined){var lc=listenCfg();if(d.ltr!==undefined)lc.tr=+d.ltr;else lc.rep=+d.lrep;setListenCfg(lc);drawPrefs();drawListenBar();return}
  if(d.x==='bulk-translate')return bulkTranslate();
  if(d.x==='bulk-save')return bulkSave();
});
document.addEventListener('submit',function(e){
  var f=e.target;if(f.getAttribute('method')==='dialog')return;   // карточка слова закрывается сама
  e.preventDefault();
  if(f.id==='wf')return writeCheck();
  if(f.id==='pf')return savePrefs(false);
  if(f.id==='addf'){
    var w=$('#aw').value.trim(),t=$('#at').value.trim(),m=$('#amsg');
    if(!w||!t){m.textContent='Нужны и слово, и перевод.';m.className='msg bad';return}
    var r=V.add(lang,w,t,{src:'manual'});drawAll();m=$('#amsg');
    m.textContent=r.added?'Добавлено: '+r.card.w:'Это слово уже было в словаре. Оно вернётся на повторение раньше.';m.className='msg ok';$('#aw').focus();return;
  }
  if(f.classList.contains('wedit')){var c=V.get(f.dataset.id);if(c){c=Object.assign({},c,{t:f.t.value.trim(),ex:f.ex.value.trim(),et:f.et.value.trim()});if(!c.ex){delete c.ex;delete c.et;delete c.f}else if(c.f&&c.ex.indexOf(c.f)<0)delete c.f;V.update(c)}editing=null;drawAll()}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){q=e.target.value;shown=60;var pos=e.target.selectionStart;drawList();var n=$('#q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
  if(e.target.id==='p-rate'){KR.setRate(e.target.value);$('#p-ratev').textContent=(+e.target.value).toFixed(2)}
  if(e.target.id==='l-pause'){var lc=listenCfg();lc.pause=+e.target.value;setListenCfg(lc);$('#l-pausev').textContent=lc.pause+' с';drawListenBar()}
});
document.addEventListener('change',function(e){
  var id=e.target.id;if(id==='p-voice')KR.setVoice(lang,e.target.value);
  if(id==='f-set'||id==='f-topic'||id==='f-level'||id==='f-pos'){
    var v=e.target.value;if(id==='f-set')sfilt=v;else if(id==='f-topic')tfilt=v;else if(id==='f-level')lvfilt=v;else pfilt=v;
    shown=60;drawList();var n=$('#'+id);if(n)n.focus();
  }
});
document.addEventListener('keydown',function(e){
  if(!S||e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key===' '&&$('#back')&&$('#back').hidden){e.preventDefault();return flip()}
  if(/^[1-4]$/.test(e.key)){var b=document.querySelector('#rate:not([hidden]) button[data-g="'+e.key+'"]')||document.querySelector('.q-opts button[data-o="'+(e.key-1)+'"]:not(:disabled)');if(b){e.preventDefault();b.click()}}
});
// пришли данные из облака: сводку обновляем всегда, а список — только если ученик сейчас ничего не вводит
function typing(){var a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
V.onchange=function(){drawToday();if(!S&&!typing()&&!editing)drawList()};
KR.onLang=function(){stopListen();if(S)stop();else drawAll()};
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){if(!$('#prefs').hidden&&!typing())drawPrefs()};
if(KR.require()){KR.topbar('words');drawAll();KR.load().then(function(){
  var l=URLP.get('lang');if(l&&l!==KR.lang()&&KR.langs().indexOf(l)>=0)KR.setLang(l);
  drawAll();loadInfo();
  // из кабинета: words.html#new — сразу знакомство с новыми словами, #rev — отработка
  var hs=location.hash,pl=V.plan(lang);
  if(hs==='#new'||hs==='#rev'){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    if(hs==='#new'&&pl.fresh.length)start('new');else if(hs==='#rev'&&pl.learn.length+pl.soon.length+pl.rev.length)start('rev')}
})}
</script>
