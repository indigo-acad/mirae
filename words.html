<script src="data/materials.js"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/srs.js"></script><script src="js/wexport.js"></script><script src="js/vocab.js"></script><script src="js/words2.js"></script><script src="js/meaning.js"></script><script src="js/dict.js"></script><script src="js/ear.js"></script><script src="js/assistant.js"></script>
<script>
/* Тренажёр слов. Расписание как в Anki (js/srs.js), игры взяты из тренажёра группы 2724:
   карточки, выбор перевода на слух, слово в предложении, письмо, сборка слова, поиск пары.
   Какая игра достанется слову, зависит от того, насколько оно выучено: сначала узнавание, потом вспоминание. */
var V=KR.vocab,esc=KR.esc,$=function(s){return document.querySelector(s)};
var lang='ko',filt='all',q='',shown=60,editing=null,S=null;        // S — текущее занятие
var URLP=new URLSearchParams(location.search),FORCE=URLP.get('game');   // ?game=wr — проверить конкретную игру
// словарь 2.0 (supabase/vocab2.sql): карточки слов из базы школы и словари от преподавателя; ?set=12 — открыть слова словаря
var INFO={},WSETS=[],sfilt=URLP.get('set')||'',tfilt='',lvfilt='',pfilt='',infoAt=0;
var GAME={cards:['Карточки','вспомни перевод и оцени себя сам'],tr:['Выбери перевод','слово звучит, нужно выбрать перевод'],
  mean:['Что значит','напиши значение: подходит любой перевод, определение или синоним'],
  ctx:['Слово в предложении','какое слово пропущено'],wr:['Напиши слово','по переводу, с клавиатуры'],
  build:['Собери слово','из слогов или букв'],pairs:['Найди пару','соедини слова и переводы'],
  hear:['Что прозвучало','слово звучит, выбери, как оно пишется: 달, 탈 или 딸'],dict:['Диктант','слово или фраза звучит, впиши по клеточкам'],
  say:['Скажи слово','по переводу, вслух в микрофон'],cnt:['Сколько слов','послушай фразу и посчитай слова']};
GAME.rcards=['Обратная карточка','видишь перевод, вспомни слово и оцени себя сам'];
/* Тип карточек, как в Anki: выбирается перед тренировкой (отработка и «по выбору»). mix — как раньше, игры из настроек */
var CT={mix:['Вперемешку','игры, отмеченные в настройках'],basic:['Слово → перевод','карточка: вспомни перевод, открой, оцени'],
  rev:['Перевод → слово','обратная карточка: по переводу вспомни слово'],both:['В обе стороны','слово то прямой, то обратной карточкой'],
  type:['Ввести ответ','печатаешь слово по переводу или перевод по слову'],cloze:['Пропуск в предложении','слова без примера придут обычной карточкой']};
function ctNow(){return S&&S.exmix?'mix':ctype()}
function ctype(){var v='';try{v=localStorage.getItem('kr_ct')||''}catch(e){}return CT[v]?v:'mix'}
function setCt(k){try{localStorage.setItem('kr_ct',k)}catch(e){}drawToday();var b=$('[data-ct="'+k+'"]');if(b)b.focus()}
function ctBox(){var cur=ctype();
  return '<div class="tct"><p class="muted tb-sub">Тип карточек: <b>'+CT[cur][0]+'</b> · '+CT[cur][1]+'</p><div class="opts tf-sc" role="group" aria-label="Тип карточек">'+
    Object.keys(CT).map(function(k){var on=k===cur;return '<button type="button" data-ct="'+k+'" aria-pressed="'+on+'" class="'+(on?'sel':'')+'">'+(on?'✓ ':'')+CT[k][0]+'</button>'}).join('')+'</div></div>'}
var EAR=KR.ear;
var RATE=[[1,'Снова'],[2,'Трудно'],[3,'Хорошо'],[4,'Легко']];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function wcls(c){return c.l==='ko'?' class="ko"':''}
function word(c){return '<span'+wcls(c)+' lang="'+c.l+'">'+esc(c.w)+'</span>'}
function sayBtn(text,l){return KR.canSay()?'<button type="button" class="say" data-say="'+esc(text)+'" data-l="'+l+'" aria-label="Послушать">'+KR.icon('volume',16)+'</button>':''}
function same(a,b){var n=function(s){return SRS.norm(s).replace(/[\s.,!?·~'’-]/g,'')};return n(a)!==''&&n(a)===n(b)}
function units(c){return c.w.replace(/\s+/g,'').split('')}
function micBtn(text,l){return EAR.canHear()?'<button type="button" class="say mic" data-mic="'+esc(text)+'" data-l="'+l+'" aria-label="Проверить произношение">'+KR.icon('mic',16)+'</button>':''}
/* пример к слову: свой или из базы слов школы */
function exOf(c){if(c.ex)return {s:c.ex,t:c.et||''};var e=((info(c)||{}).examples||[])[0];return e&&e.s?{s:e.s,t:e.t||''}:null}
/* похожие на слух слова для «Что прозвучало»: считаем один раз на занятие */
function alikesOf(c){
  if(!S)return [];S.al=S.al||{};
  if(!S.al[c.id])S.al[c.id]=EAR.alikes(c.w,c.l,V.all(c.l).map(function(x){return x.w}),3);
  return S.al[c.id];
}
/* Место слова в примере: по заданной форме (f) или по основе слова. */
function cloze(c){
  if(!c.ex)return null;var f=c.f&&c.ex.indexOf(c.f)>=0?c.f:null;
  if(!f){var st=V.stem(c.l,c.w);f=c.ex.split(/\s+/).map(function(t){return t.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,'')}).filter(function(t){return t.toLowerCase().indexOf(st)===0})[0]||null}
  if(!f)return null;var i=c.ex.indexOf(f);return {a:c.ex.slice(0,i),b:c.ex.slice(i+f.length),f:f};
}

// ---------- значения слова и режим отработки (js/meaning.js) ----------
/* У слова может быть несколько переводов и определений на любых языках, синонимы и устойчивые выражения.
   Режим отработки (Настройки, отдельно для каждого языка): ru — с русским переводом; ctx — в контексте, только на изучаемом
   языке: определение, устойчивое выражение или пример с пропуском, синонимы (рекомендуем с 2급 / A2); mix — вперемешку.
   Режим выбирается для каждого слова в занятии (S.cx), подсказка-контекст — тоже одна на слово (S.pr). */
var M=KR.mean,GAP='(\u00a0\u00a0\u00a0\u00a0)';
var CXN={ru:'с русским',ctx:'в контексте',mix:'вперемешку'},PK={def:'Определение',col:'Устойчивое выражение',ex:'Пример',syn:'Синонимы'};
/* направления: на каком языке значение слова — ru, другой язык (en / ko) или ctx (в контексте). Отмеченные чередуются */
function gls(l){l=l||lang;var s=V.settings(),g=(s.gls||{})[l];if(g&&g.length)return g;var m=(s.ctxm||{})[l]||'ru';return m==='ctx'?['ctx']:m==='mix'?['ru','ctx']:['ru']}
function cm(l){var g=gls(l),c=g.indexOf('ctx')>=0,o=g.some(function(x){return x!=='ctx'});return c&&o?'mix':c?'ctx':'ru'}
function gname(g){return g==='ru'?'Русский':g==='ctx'?'В контексте':(KR.LANGS[g]||{}).name||g}
function glsOpts(){return ['ru'].concat(['ko','en'].filter(function(l){return l!==lang}),wlangs().filter(function(l){return l!==lang&&l!=='ko'&&l!=='en'}),['ctx'])}
/* значение слова на языке g: русский перевод или перевод/определение на другом языке */
function glossOf(c,g){if(!g||g==='ru')return trRu(c);var d=(c.d||[]).filter(function(x){return x.l===g})[0];if(d)return d.s;
  var a=(info(c)||{})['tr_'+g];return Array.isArray(a)?a[0]||'':(a||'')}
var GXN={ru:'по-русски',en:'по-английски',ko:'по-корейски',ja:'по-японски',zh:'по-китайски'};
function rel(a,b){return M.related(a,b,info(a),info(b))}
function others(c){return deck(c).filter(function(x){return x.id!==c.id}).map(function(x){return {c:x,I:info(x)}})}
/* пропуск слова в тексте: выражение из нескольких слов — целиком, иначе слово по основе */
function gapIn(text,c){
  var w=c.w.split('/')[0].trim(),i=text.toLowerCase().indexOf(w.toLowerCase());
  if(i>=0&&w.indexOf(' ')>=0)return text.slice(0,i)+GAP+text.slice(i+w.length);
  var st=V.stem(c.l,w.split(' ')[0]),hit=false;if(!st)return null;
  var r=text.replace(/[\p{L}\p{N}]+/gu,function(t){if(hit||SRS.norm(t).indexOf(st)!==0)return t;hit=true;return GAP});
  return hit?r:null;
}
/* подсказки на изучаемом языке: определения (без самого слова), выражения и примеры с пропуском, синонимы */
/* Всё — по уровню ученика (KR.mean.level), даже если слово сложное: длинные определения и примеры не даём.
   Свой пример карточки (c.ex) — всегда: словарный не по уровню убирает KR.dict.refit, свой выбрал ученик или преподаватель.
   Дополнительные примеры — из статьи словаря, только из того значения слова, которое ученик учит. */
function ctxPrompts(c){
  var I=info(c)||{},out=[],nw=SRS.norm(c.w),lv=M.level(c.l),ok=function(t,k){return M.fits(t,c.l,lv,k)};
  M.tdefs(c,I).forEach(function(d){if(SRS.norm(d.s).indexOf(nw)<0&&ok(d.s,1.3))out.push({k:'def',s:d.s})});
  M.cols(c).forEach(function(x){var g=ok(x.s,1.3)&&gapIn(x.s,c);if(g)out.push({k:'col',s:g})});
  var ex=[];if(c.ex)ex.push(c.ex);(I.examples||[]).forEach(function(e){if(e.s&&ex.indexOf(e.s)<0&&ok(e.s))ex.push(e.s)});
  var de=KR.dict.cached(c.w,c.l);if(de)KR.dict.examplesFor(c,de,lv).forEach(function(e){if(ex.indexOf(e.s)<0)ex.push(e.s)});
  ex.slice(0,3).forEach(function(t){var g=gapIn(t,c);if(g)out.push({k:'ex',s:g})});
  var sy=M.syns(c,I);if(sy.length)out.push({k:'syn',s:sy.slice(0,3).join(', '),list:sy.slice(0,3)});
  return out;
}
/* в контексте ли это слово сейчас; без подсказок на изучаемом языке — с переводом */
function pickCx(c){
  if(S)S.gx=null;var o=shuffle(gls(c.l));
  for(var i=0;i<o.length;i++){var g=o[i];
    if(g==='ctx'){var ps=ctxPrompts(c);if(ps.length)return ps[Math.floor(Math.random()*ps.length)]}
    else if(glossOf(c,g)){if(g!=='ru'&&S)S.gx=g;return null}}
  return null;
}
/* задание: перевод или подсказка на изучаемом языке */
function promptHtml(c){
  var p=S&&S.cx?S.pr:null;
  if(!p)return S&&S.gx?'<div class="q-word q-cx"><small class="muted">'+esc(gname(S.gx))+'</small><div lang="'+S.gx+'"'+(S.gx==='ko'?' class="ko"':'')+'>'+esc(trOf(c))+' '+sayBtn(trOf(c),S.gx)+'</div></div>':'<div class="q-word q-ru">'+esc(trOf(c))+'</div>';
  return '<div class="q-word q-cx"><small class="muted">'+PK[p.k]+'</small><div'+wcls(c)+' lang="'+c.l+'">'+esc(p.s)+(p.k==='def'||p.k==='syn'?' '+sayBtn(p.s,c.l):'')+'</div></div>';
}
/* значение слова в ответе: в контексте — на изучаемом языке */
function gl(c){
  if(S&&S.cx){var I=info(c)||{},d=M.tdefs(c,I)[0],sy=M.syns(c,I);if(d)return {s:d.s,l:c.l};if(sy.length)return {s:'≈ '+sy.slice(0,3).join(', '),l:c.l}}
  return {s:trOf(c),l:S&&S.gx||'ru'};
}
function glH(c){var g=gl(c);return g.l==='ru'?esc(g.s):'<span'+(g.l==='ko'?' class="ko"':'')+' lang="'+g.l+'">'+esc(g.s)+'</span>'}
/* все значения слова — показать после ответа */
function meaningsHtml(c,cx){
  var I=info(c)||{},h='';
  if(cx){var sy=M.syns(c,I),td=M.tdefs(c,I);
    if(sy.length)h+='<div><span class="muted">Синонимы:</span> <span'+wcls(c)+' lang="'+c.l+'">'+sy.map(esc).join(', ')+'</span></div>';
    td.forEach(function(d){h+='<div'+wcls(c)+' lang="'+c.l+'">'+esc(d.s)+'</div>'});
    return h?'<div class="exbox">'+h+'</div>':'';
  }
  var t=M.trs(c,I),od=M.defs(c,I);
  if(t.length)h+='<div>'+t.map(esc).join('; ')+'</div>';
  od.forEach(function(d){h+='<div><small class="muted">'+esc(M.NAMES[d.l]||d.l)+'</small> <span lang="'+d.l+'"'+(d.l==='ko'?' class="ko"':'')+'>'+esc(d.s)+'</span></div>'});
  return h?'<div class="exbox">'+h+'</div>':'';
}
/* какие ответы засчитываем в «Что значит» */
function meanTargets(c){
  var I=info(c)||{};
  if(S&&S.cx)return M.syns(c,I).concat(M.tdefs(c,I).map(function(d){return d.s}),others(c).filter(function(o){return rel(c,o.c)}).map(function(o){return o.c.w}));
  return M.trs(c,I).concat(M.defs(c,I).map(function(d){return d.s}));
}
/* слово со словом из формы: «перевод» может быть на любом языке — русское идёт в переводы, остальное в определения */
function addW(l,w,t,x){
  var tt=M.splitTr(t,l),r=V.add(l,w,tt.t,Object.assign({},x||{},{d:tt.d}));
  if(!r.added&&tt.d.length){var c=V.get(r.card.id),have=(c.d||[]).map(function(d){return d.l+':'+d.s.toLowerCase()}),nd=tt.d.filter(function(d){return have.indexOf(d.l+':'+d.s.toLowerCase())<0});
    if(nd.length)V.update(Object.assign({},c,{d:(c.d||[]).concat(nd).slice(0,12)}))}
  return r;
}
/* ученик настаивает, что его ответ верен: добавляем его к значениям слова */
function addMeaning(c,v,cx){
  c=V.get(c.id);if(!c||!v)return;c=Object.assign({},c);
  if(cx||M.langOf(v)===c.l)c.syn=(c.syn||[]).concat(v).slice(0,12);
  else if(M.langOf(v)==='ru'||!M.langOf(v))c.t=c.t?c.t+'; '+v:v;
  else c.d=(c.d||[]).concat({l:M.langOf(v),s:v}).slice(0,12);
  V.update(c);
}

// ---------- сводка: одно занятие на сегодня; раздельные режимы — по желанию ----------
/* Главная кнопка «Начать» — одно занятие: сначала карточки (новые слова вперемешку с повторением),
   потом, по желанию, упражнения по этим же словам. «Только новые», «только упражнения», тип карточек
   и тренировка по выбору спрятаны в блок «Раздельно и по выбору». Вверху — короткая инструкция. */
var OPEN={guide:null,split:false};
function guideSeen(){try{return localStorage.getItem('kr_wguide')==='1'}catch(e){return true}}
function guideBox(){
  var open=OPEN.guide===null?!guideSeen():OPEN.guide;
  return '<details class="card glass today tguide" data-open="guide"'+(open?' open':'')+'><summary><span class="tb-h"><h3>'+KR.icon('book',20)+'Как заниматься</h3></span></summary>'+
    '<ol class="qsteps">'+
    '<li><b>Нажми «Начать».</b> Сначала идут карточки: новые слова вперемешку со словами на повторение.</li>'+
    '<li><b>Новое слово:</b> послушай, попробуй догадаться, открой перевод. «Запомнить» — слово начнёт повторяться, «Уже знаю» — вернётся на проверку через несколько дней.</li>'+
    '<li><b>Слово на повторение:</b> вспомни перевод (лучше вслух), открой и честно оцени себя. <b>Снова</b> — не вспомнил(а), покажем через пару минут; <b>Трудно</b>, <b>Хорошо</b>, <b>Легко</b> — вернётся через столько дней, сколько написано на кнопке.</li>'+
    '<li><b>После карточек — упражнения, если хочешь:</b> выбрать перевод, написать, собрать слово, на слух. Ошибка в упражнении вернёт слово раньше.</li>'+
    '<li>Лучше понемногу каждый день. Закончить можно в любой момент — крестик вверху занятия.</li>'+
    '<li>Нужны только новые слова, только упражнения или свой набор слов — открой «Раздельно и по выбору». Добавить слова — ниже, в списке.</li>'+
    '</ol><div class="done-row"><span></span><button type="button" data-x="guide-ok">Понятно</button></div></details>';
}
function drawToday(){
  var p=V.plan(DL()),st=V.stats(DL()),G=KR.LANGS[lang],set=V.settings(),now=Date.now();
  var cloud={cloud:['cloud','Словарь сохраняется в облаке'],local:['alert','Словарь пока хранится только на этом устройстве'],offline:['alert','Нет связи: изменения сохранятся на устройстве и отправятся позже']}[V.status];
  var box=function(n,t){return '<div><b>'+n+'</b><span class="muted">'+t+'</span></div>'};
  var busy=S?S.mode:'',nNew=p.fresh.length,inWork=p.learn.length+p.soon.length,rev=p.rev.length,due=p.learn.length+rev;
  var h='<section class="card glass today tday" aria-labelledby="tday-h"><div class="tb-h"><h3 id="tday-h">'+KR.icon('spark',20)+'Занятие на сегодня</h3></div>'+
    '<div class="stat">'+box(nNew,'новых')+box(inWork+rev,'повторить')+box(st.total,'всего слов')+'</div>';
  h+='<p class="muted tb-sub">'+(MIXL?'Все языки · '+wlangs().map(function(l){return KR.LANGS[l].name+': '+gls(l).map(gname).join(' + ')}).join(' · '):'Значения: '+gls().map(gname).join(' + '))+' · <button type="button" class="linkish" data-x="cx-cfg">сменить</button></p>';
  if(busy)h+=busy==='done'?'':'<p class="muted tb-sub">Идёт занятие: оно открыто ниже.</p>';   // кнопки старта не дублируем, пока открыто занятие или его итог
  else if(nNew+due)h+='<div class="done-row"><span class="muted">Сначала карточки'+(nNew&&due?': новые слова и повторение вместе':nNew?' с новыми словами':' на повторение')+'. Потом — упражнения, если захочешь.</span><button type="button" class="cta" id="goday">Начать'+KR.icon('arrow',18)+'</button></div>';
  else if(inWork)h+='<div class="done-row"><span class="muted">Карточек на сейчас нет, но несколько слов скоро вернутся. Можно сразу закрепить их упражнениями.</span><button type="button" class="cta" id="go">Упражнения'+KR.icon('arrow',18)+'</button></div>';
  else h+='<div class="done-row"><span class="muted">'+(st.total?(p.waiting?'Сейчас повторять нечего. Ближайшее слово вернётся через '+SRS.span(p.nextAt-now)+'.':'На сегодня всё. Повторения появятся завтра.')+(p.allNew>nNew?' Новые слова: в день '+set.newDay+', ещё '+p.allNew+' — завтра (число меняется в «Настройках»).':''):'В словаре пока нет слов: '+G.ru+' раздел. Добавь их ниже или открой урок.')+'</span></div>';
  if(!busy&&nNew)h+='<div class="tb-prev">'+p.fresh.slice(0,8).map(function(c){var t=trOf(c);return '<span class="chip"><b'+wcls(c)+' lang="'+c.l+'">'+esc(c.w)+'</b>'+(t?'&nbsp;· '+esc(t):'')+'</span>'}).join('')+(nNew>8?'<span class="chip">ещё '+(nNew-8)+'</span>':'')+'</div>';
  if(st.total&&KR.canSay())h+='<div class="tb-more"><button type="button" data-x="to-ear">'+KR.icon('headphones',17)+'Тренировка на слух</button>'+
    '<button type="button" data-x="pod-today">'+KR.icon('play',16)+'Подкаст на сегодня</button></div>';
  // по желанию: раздельно новые и упражнения, тип карточек, свой набор слов
  if(st.total&&!busy){
    h+='<details class="tsplit" data-open="split"'+(OPEN.split?' open':'')+'><summary>Раздельно и по выбору</summary>'+
      '<p class="muted tb-sub">Если хочется заниматься по частям: только знакомство с новыми словами или только упражнения без карточек.</p>'+
      '<div class="tb-more"><button type="button" id="gonew"'+(nNew?'':' disabled')+'>'+KR.icon('spark',16)+'Только новые слова · '+nNew+'</button>'+
      '<button type="button" id="go"'+(inWork+rev?'':' disabled')+'>'+KR.icon('repeat',16)+'Только упражнения · '+(inWork+rev)+'</button></div>'+
      (st.total>p.allNew?ctBox():'')+
      (KR.canSay()?'<p class="muted tb-sub">На слух: диктант по клеточкам, «что прозвучало»'+(EAR.canHear()?', скажи слово в микрофон':'')+'. Подкаст читает слова с паузой, чтобы успеть ответить.</p>':'')+
      (st.total>p.allNew?freeBox():'')+'</details>';
  }
  h+='<p class="muted cloudline">'+KR.icon(cloud[0],15)+' '+cloud[1]+'</p></section>';
  $('#today').innerHTML=langBar()+guideBox()+h;
}

/* Тренировка по выбору: ученик отмечает, какие слова гонять в тренажёрах (на сегодня, на завтра, на неделю, трудные, все).
   Слово «на сегодня» получает обычную оценку, как в отработке. Слово «на потом» от верного ответа не сдвигается,
   а от ошибки возвращается раньше: интервал вдвое короче, повторение — сегодня (SRS.train). */
var SCN={today:'На сегодня',tom:'На завтра',d3:'Ближайшие 3 дня',week:'На неделю',hard:'Трудные',all:'Все слова'};
function freeBox(){
  var sc=V.settings().scope,n=V.scope(DL()).length;
  return '<div class="tfree" id="tfree"><h4>'+KR.icon('target',18)+' Тренировка по выбору</h4><p class="muted tb-sub">Какие слова отрабатывать в тренажёрах. Ошибка в слове «на потом» вернёт его раньше: интервал сократится, слово придёт на повторение сегодня.</p>'+
    '<div class="opts tf-sc" role="group" aria-label="Какие слова отрабатывать">'+SRS.SCOPES.map(function(k){var on=sc.indexOf(k)>=0,c=V.scope(DL(),[k]).length;
      return '<button type="button" data-sc="'+k+'" aria-pressed="'+on+'" class="'+(on?'sel':'')+'">'+(on?'✓ ':'')+SCN[k]+' · '+c+'</button>'}).join('')+'</div>'+
    '<div class="tb-more"><button type="button" class="btn pri" data-x="free-go"'+(n?'':' disabled')+'>'+KR.icon('repeat',16)+'Упражнения · '+n+'</button>'+
    (KR.canSay()?'<button type="button" data-x="free-ear"'+(n?'':' disabled')+'>'+KR.icon('headphones',16)+'На слух</button>':'')+'</div></div>';
}
function freeScope(k){
  var s=V.settings(),a=s.scope.slice(),i=a.indexOf(k);
  if(i>=0){if(a.length>1)a.splice(i,1)}else a.push(k);
  s.scope=a;V.setSettings(s);drawToday();var b=$('#tfree [data-sc="'+k+'"]');if(b)b.focus();
}
function freeGrade(g,auto){
  var c=S.card,now=Date.now(),r=V.train(c.id,g),n=r?r.c:V.get(c.id)||c,msg;
  S.done++;if(g>1)S.right++;else{S.wrong++;if(S.missed.indexOf(c.id)<0)S.missed.push(c.id);if(!S.rq[c.id]){S.rq[c.id]=1;S.queue.push(c.id)}}
  if(r&&r.k==='rev'){S.rev++;msg='Засчитано как повторение · вернётся через '+(n.st===2?SRS.span(n.ivl*SRS.DAY):SRS.span(Math.max(0,n.due-now)))}
  else if(r&&r.k==='back'){S.back++;msg='Интервал сокращён: слово придёт на повторение сегодня'}
  else if(g>1)msg='По плану '+(n.due<=now?'сегодня':'через '+SRS.span(n.due-now))+'. Верный ответ раньше срока расписание не меняет';
  else msg='Слово уже возвращено на сегодня';
  var fb=$('#fb');if(fb)fb.insertAdjacentHTML('beforeend','<div class="muted back-in">'+msg+'</div>');
  S.qi++;drawToday();
  if(auto)S.timer=setTimeout(nextCard,KR.calm()?700:1300);
  else{var b=$('#nextb');if(b){b.hidden=false;b.focus()}else nextCard()}
}
function finishFree(){
  var n=S.right+S.wrong,miss=S.missed.map(function(id){return V.get(id)}).filter(Boolean);S.mode='done';S.missIds=miss.map(function(c){return c.id});
  $('#play').innerHTML='<div class="fin"><span class="spark">'+KR.icon('target',34)+'</span><h3>'+(S.exmix?'Упражнения закончены':'Тренировка закончена')+'</h3><p class="muted">Верно: '+S.right+' из '+n+'.'+
    (S.rev?' Засчитано как повторение: '+S.rev+'.':'')+(S.back?' Вернутся раньше (интервал сокращён): '+S.back+'.':'')+'</p>'+
    (miss.length?'<p class="muted">Ошибки:</p><div class="opts ear-miss">'+miss.map(function(c){return '<button type="button" data-say="'+esc(c.w)+'" data-l="'+c.l+'">'+KR.icon('volume',15)+' <span'+wcls(c)+' lang="'+c.l+'">'+esc(c.w)+'</span>&nbsp;· '+esc(trOf(c))+'</button>'}).join('')+'</div>':'')+
    '<div class="fin-acts"><button type="button" class="btn pri" data-x="'+(S.exmix?'ex-again':'free-go')+'">Ещё раунд</button>'+(miss.length&&KR.canSay()?'<button type="button" data-x="pod-miss">Подкаст из ошибок</button>':'')+'<button type="button" data-x="stop">Готово</button></div></div>';
  drawToday();
}

// ---------- занятие ----------
var MIXL=false;   // «Все языки»: корейские и английские слова в одной тренировке
function DL(){return MIXL?null:lang}
/* слова для заданий: того же языка, что и слово (в «Все языки» варианты ответа не смешиваем) */
function deck(c){var cc=c||(S&&S.card);return V.all(DL()).filter(function(x){return !cc||x.l===cc.l})}
function feasible(c,d){
  var g=ctNow()==='mix'||FORCE?V.settings().games:SRS.DEF.games,others=d.filter(function(x){return x.id!==c.id&&trOf(x)&&trOf(x)!==trOf(c)}),out=[],n=units(c).length;
  if(g.cards)out.push('cards','rcards');
  var unrel=d.filter(function(x){return x.id!==c.id&&!rel(c,x)});
  if(g.tr&&(S&&S.cx?unrel.length>=3:trOf(c)&&others.filter(function(x){return !rel(c,x)}).length>=3))out.push('tr');
  if(g.mean&&meanTargets(c).length)out.push('mean');
  if(g.ctx&&others.length>=3&&cloze(c))out.push('ctx');
  if(g.wr&&(trOf(c)||S&&S.cx))out.push('wr');
  if(g.build&&n>=2&&n<=16)out.push('build');
  if(g.hear&&KR.canSay()&&alikesOf(c).length>=3)out.push('hear');
  if(g.dict&&KR.canSay()&&n<=24)out.push('dict');
  if(g.say&&EAR.canHear()&&(trOf(c)||S&&S.cx))out.push('say');
  return out;
}
function choose(c,d){
  var f=feasible(c,d);
  if(FORCE&&(f.indexOf(FORCE)>=0))return FORCE;
  if(!c.st)return f.indexOf('cards')>=0?'cards':'intro';                 // новое слово сначала показываем
  var ct=ctNow();
  if(ct!=='mix'){
    if(ct==='basic')return 'cards';
    if(ct==='rev')return 'rcards';
    if(ct==='both'){S.flipN=(S.flipN||0)+1;return S.flipN%2?'cards':'rcards'}
    if(ct==='type'){var ty=['wr','mean'].filter(function(g){return f.indexOf(g)>=0});
      if(ty.length>1&&ty.indexOf(S.lastGame)>=0)ty=ty.filter(function(g){return g!==S.lastGame});return ty.length?ty[Math.floor(Math.random()*ty.length)]:'cards'}
    if(ct==='cloze')return f.indexOf('ctx')>=0?'ctx':'cards';
  }
  // сначала узнавание (в том числе на слух), потом вспоминание: написать, сказать вслух, записать на слух
  var pref=(c.st===1||c.st===3)?['tr','hear','mean','ctx','build','dict','cards','wr']:(c.ivl||0)<7?['ctx','mean','dict','tr','say','hear','build','wr','cards']:['wr','say','mean','dict','build','ctx','tr','cards'];
  var av=pref.filter(function(g){return f.indexOf(g)>=0&&g!==S.lastGame});
  if(!av.length)av=pref.filter(function(g){return f.indexOf(g)>=0});
  return av.length?av[Math.floor(Math.random()*Math.min(3,av.length))]:'cards';
}
/* mode: day — занятие на сегодня: карточки (новые вперемешку с повторением), потом по желанию упражнения;
   new — только знакомство с новыми словами; rev — только упражнения (без новых слов);
   free с ids — упражнения по словам из только что пройденных карточек */
function dayQueue(){
  var p=V.plan(DL()),r=p.learn.concat(p.rev).map(function(c){return c.id}),n=p.fresh.map(function(c){return c.id}),out=[];
  if(!n.length)return r;if(!r.length)return n;
  var k=Math.max(1,Math.round(r.length/n.length)),ri=0,ni=0;   // новое слово после каждых k повторений
  while(ri<r.length||ni<n.length){for(var i=0;i<k&&ri<r.length;i++)out.push(r[ri++]);if(ni<n.length)out.push(n[ni++])}
  return out;
}
function start(mode,scoped,ids){
  stopPod();
  S={mode:mode==='new'||mode==='ear'||mode==='free'||mode==='day'?mode:'rev',done:0,known:0,sincePairs:99,right:0,wrong:0,missed:[],rev:0,back:0,rq:{},seen:[]};
  if(S.mode==='day'){S.queue=dayQueue();S.qi=0}
  if(S.mode==='new'){S.queue=V.plan(DL()).fresh.map(function(c){return c.id});S.qi=0}
  if(S.mode==='ear'){S.scoped=!!scoped;S.queue=earQueue(S.scoped);S.qi=0}
  if(S.mode==='free'){if(ids){S.exmix=true;S.ids=ids.slice();S.queue=shuffle(ids).slice(0,30)}else S.queue=V.scope(DL()).slice(0,40).map(function(c){return c.id});S.qi=0}
  $('#play').hidden=false;drawToday();nextCard();$('#play').scrollIntoView({block:'start',behavior:KR.calm()?'auto':'smooth'});
}
function stop(soft){if(soft&&S&&S.mode==='day'&&S.done){KR.hush();EAR.stop();clearTimeout(S.timer);return finishDay()}   // крестик посреди занятия: предложить упражнения по пройденному
  KR.hush();EAR.stop();S=null;$('#play').hidden=true;$('#play').innerHTML='';drawAll()}
function nextCard(){
  if(!S)return;KR.hush();EAR.stop();clearTimeout(S.timer);S.tok=(S.tok||0)+1;S.hint=false;S.tries=0;S.gx=null;
  if(S.mode==='ear'){
    if(S.qi>=S.queue.length)return finishEar();
    var it=S.queue[S.qi],ce=V.get(it.id);if(!ce){S.queue.splice(S.qi,1);return nextCard()}
    S.card=ce;S.game=it.g;S.lock=false;S.retype=false;S.miss=0;S.pr=pickCx(ce);S.cx=!!S.pr;
    return ({hear:gHear,dict:gDict,say:gSay,cnt:gCount})[it.g](ce,it.ph);
  }
  if(S.mode==='free'){
    while(S.qi<S.queue.length){var cf=V.get(S.queue[S.qi]);if(cf&&cf.st)break;S.qi++}
    if(S.qi>=S.queue.length)return finishFree();
    var fc=V.get(S.queue[S.qi]);S.card=fc;S.pr=pickCx(fc);S.cx=!!S.pr;S.game=choose(fc,deck(fc));S.lastGame=S.game;S.retype=false;S.miss=0;S.lock=false;
    var fph=false;if(S.game==='dict'){var fe=exOf(fc);fph=!!(fe&&fc.st===2&&(fc.ivl||0)>=3&&fe.s.length<=70&&EAR.count(fe.s)>=2&&Math.random()<.5)}
    return ({cards:gCards,intro:gCards,rcards:gCards,tr:gChoice,mean:gMean,ctx:gChoice,wr:gWrite,build:gBuild,hear:gHear,dict:gDict,say:gSay})[S.game](fc,fph);
  }
  if(S.mode==='day'){
    while(S.qi<S.queue.length&&!V.get(S.queue[S.qi]))S.qi++;   // слово могли удалить на другом устройстве
    if(S.qi>=S.queue.length)return finishDay();
    var cd=V.get(S.queue[S.qi]);S.card=cd;S.lock=false;S.retype=false;S.miss=0;
    if(!cd.st){S.game='intro';return gNew(cd)}
    var ctd=ctype();S.pr=pickCx(cd);S.cx=!!S.pr;
    S.game=ctd==='rev'?'rcards':ctd==='both'?((S.flipN=(S.flipN||0)+1)%2?'cards':'rcards'):'cards';
    return gCards(cd);
  }
  if(S.mode==='new'){
    while(S.qi<S.queue.length){var c0=V.get(S.queue[S.qi]);if(c0&&!c0.st)break;S.qi++}   // слово могли удалить или разобрать на другом устройстве
    if(S.qi>=S.queue.length)return finishNew();
    S.card=V.get(S.queue[S.qi]);S.game='intro';S.lock=false;return gNew(S.card);
  }
  var p=V.plan(DL()),g=V.settings().games;p.fresh=[];   // в отработке новых слов нет: они в своём блоке
  var pool=p.learn.concat(p.rev);
  var pp=noRel(FORCE==='pairs'?pool.concat(p.soon):pool).slice(0,5);
  if((g.pairs&&ctype()==='mix'&&S.sincePairs>=8&&pp.length>=4&&!FORCE)||(FORCE==='pairs'&&pp.length>=4)){S.sincePairs=0;return pairs(pp)}
  var c=SRS.pick(p);
  if(!c)return finish(p);
  S.sincePairs++;S.card=c;S.pr=pickCx(c);S.cx=!!S.pr;S.game=choose(c,deck(c));S.lastGame=S.game;S.hint=false;S.retype=false;S.miss=0;S.lock=false;
  // диктант фразой: слово уже знакомо и у него есть пример
  var ph=false;if(S.game==='dict'){var e=exOf(c);ph=!!(e&&c.st===2&&(c.ivl||0)>=3&&e.s.length<=70&&EAR.count(e.s)>=2&&Math.random()<.5)}
  ({cards:gCards,intro:gCards,rcards:gCards,tr:gChoice,mean:gMean,ctx:gChoice,wr:gWrite,build:gBuild,hear:gHear,dict:gDict,say:gSay})[S.game](c,ph);
}
function frame(title,body){
  var p=V.plan(DL()),left=S.mode==='new'||S.mode==='ear'||S.mode==='free'||S.mode==='day'?S.queue.length-S.qi:p.learn.length+p.rev.length+p.soon.length;
  $('#play').innerHTML='<div class="play-top"><span class="tag">'+title+'</span><span class="muted">осталось: '+left+'</span><button type="button" class="round" data-x="stop" aria-label="Закончить занятие">'+KR.icon('x',16)+'</button></div>'+body;
}
function finish(p){
  var again=p.waiting?'Ближайшее слово вернётся через '+SRS.span(p.nextAt-Date.now())+'.':'Новые повторения появятся завтра.',nf=V.plan(DL()).fresh.length;
  S.mode='done';
  $('#play').innerHTML='<div class="fin"><span class="spark">'+KR.icon('spark',34)+'</span><h3>Отработка на сегодня закончена</h3><p class="muted">Упражнений: '+S.done+'. '+again+(nf?' Новых слов на сегодня: '+nf+'.':'')+'</p>'+
    '<div class="fin-acts">'+(nf?'<button type="button" class="btn pri" data-x="to-new">Учить новые слова</button>':'')+'<button type="button"'+(nf?'':' class="btn pri"')+' data-x="stop">Готово</button></div></div>';
  drawToday();
}
function finishDay(){
  var ids=S.seen.filter(function(id){var c=V.get(id);return c&&c.st}),n=S.done,k=S.known;S.mode='done';
  $('#play').innerHTML='<div class="fin"><span class="spark">'+KR.icon('spark',34)+'</span><h3>Карточки пройдены</h3><p class="muted">Карточек: '+n+'.'+(k?' Уже знакомых новых слов: '+k+'.':'')+
    (ids.length?' Хочешь закрепить? Несколько минут упражнений по этим словам — и они запомнятся лучше. Это по желанию.':'')+'</p>'+
    '<div class="fin-acts">'+(ids.length?'<button type="button" class="btn pri" data-x="day-ex">Упражнения'+KR.icon('arrow',16)+'</button><button type="button" data-x="stop">Хватит на сегодня</button>':'<button type="button" class="btn pri" data-x="stop">Готово</button>')+'</div></div>';
  S.exIds=ids;drawToday();var f=$('#play .fin-acts .btn');if(f)f.focus({preventScroll:true});
}
// ---------- знакомство с новыми словами ----------
/* Новое слово показано целиком: перевод, пример, звук, картинка. «Запомнить» — слово уходит в отработку
   (вернётся через первый шаг изучения), «Уже знаю» — сразу в повторения с интервалом «Легко». */
function gNew(c){
  var I=info(c)||{},ipa=(c.l==='en'?(KR.accent()==='us'?I.ipa_us||I.ipa_uk:I.ipa_uk||I.ipa_us):'')||c.ipa||'',set=V.settings(),now=Date.now();
  var src=KR.W2.source(c.src||I.src,(setById(String(c.src||'').replace('set:',''))||{}).title);
  frame(S.mode==='day'?'Новое слово':'Новое слово · '+(S.qi+1)+' из '+S.queue.length,'<div class="flash newcard">'+
    (I.image?'<img class="flash-img" src="'+esc(I.image)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'')+
    '<div class="flash-w">'+word(c)+' '+sayBtn(c.w,c.l)+micBtn(c.w,c.l)+'</div>'+
    (ipa?'<div class="flash-ipa" lang="'+(c.l==='ko'?'ko':'en')+'">'+esc(ipa)+'</div>':'')+(I.pos?'<div class="flash-pos">'+esc(KR.W2.POS[I.pos]||I.pos)+'</div>':'')+
    (c.ex?'<div class="flash-ex"><span'+wcls(c)+' lang="'+c.l+'">'+esc(c.ex)+'</span> '+sayBtn(c.ex,c.l)+'</div>':'')+
    // перевод не виден сразу: сначала попробовать догадаться, потом открыть
    '<div id="nback"'+(S.nopen===c.id?'':' hidden')+'><div class="flash-t">'+esc(trOf(c)||'перевод не указан')+'</div>'+newMore(c)+(c.ex&&c.et?'<div class="muted">'+esc(c.et)+'</div>':'')+'</div>'+
    (S.nopen===c.id?'':'<div class="done-row" id="nshowrow"><span class="muted">Догадайся, что значит слово, и открой</span><button type="button" class="btn pri" data-x="nshow">Показать перевод</button></div>')+

/* правая колонка: в контексте — короткие определения или синонимы на изучаемом языке, если они есть у всех слов */
function pairLabel(c,cx){if(!cx)return trOf(c);var I=info(c)||{},d=M.tdefs(c,I).filter(function(x){return x.s.length<=40})[0],sy=M.syns(c,I);return d?d.s:sy.length?'≈ '+sy.slice(0,2).join(', '):''}
function pairs(cards){
  var m=cm(cards[0]&&cards[0].l),cx=m!=='ru'&&(m==='ctx'||Math.random()<.5)&&cards.every(function(c){return pairLabel(c,true)});
  S.gx=null;S.game='pairs';S.pc=cards;S.pm={};S.sel=null;S.left=cards.length;S.pcx=cx;S.cx=null;
  var L=shuffle(cards),R=shuffle(cards);
  frame(GAME.pairs[0],'<p class="muted q-sub">Нажми слово, потом '+(cx?'его значение':'его перевод')+'.</p><div class="pairs"><div>'+L.map(function(c){return '<button type="button" data-pw="'+esc(c.id)+'"'+wcls(c)+' lang="'+c.l+'">'+esc(c.w)+'</button>'}).join('')+'</div><div>'+
    R.map(function(c){return '<button type="button" data-pt="'+esc(c.id)+'"'+(cx?wcls(c)+' lang="'+c.l+'"':'')+'>'+esc(pairLabel(c,cx))+'</button>'}).join('')+'</div></div><div id="fb" class="q-fb"></div>');
}
function pairTap(b){
  if(b.dataset.pw!==undefined){[].forEach.call(document.querySelectorAll('.pairs [data-pw]'),function(x){x.classList.remove('sel')});b.classList.add('sel');S.sel=b;var c=V.get(b.dataset.pw);if(c)KR.say(c.w,c.l);return}
  if(!S.sel)return;var w=S.sel,id=w.dataset.pw;
  if(b.dataset.pt===id){w.disabled=b.disabled=true;w.classList.remove('sel');w.classList.add('ok');b.classList.add('ok');S.sel=null;S.left--;
    if(!S.left){S.pc.forEach(function(c){V.answer(c.id,S.pm[c.id]?1:3);S.done++});drawToday();S.timer=setTimeout(nextCard,KR.calm()?500:900)}}
  else{S.pm[id]=1;S.pm[b.dataset.pt]=1;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake','bad');setTimeout(function(){b.classList.remove('bad')},500)}
}

// ---------- на слух и вслух (js/ear.js) ----------
/* Тренировка на слух: 12 слов из тех, что уже в работе (сначала те, что пора повторить, и сложные).
   Ответы сдвигают интервалы, как упражнения уроков (KR.vocab.practice): ошибка — слово вернётся на повторение сегодня. */
function earQueue(scoped){
  var all=V.all(DL()),ds=SRS.dayStart(Date.now()),prev='',out=[];
  var pool=scoped?V.scope(DL()):all.filter(function(c){return c.st});if(pool.length<4&&!scoped)pool=all.slice();
  var due=function(c){return c.st===1||c.st===3||(c.st===2&&c.due<ds+SRS.DAY)?1:0};
  pool=shuffle(pool).sort(function(a,b){return (due(b)-due(a))||((b.star?1:0)-(a.star?1:0))});
  pool.slice(0,12).forEach(function(c){
    var e=exOf(c),phOk=!!(e&&e.s.length<=80&&EAR.count(e.s)>=2),gs=[];
    if(alikesOf(c).length>=3)gs.push('hear');
    gs.push('dict');
    if(EAR.canHear()&&trOf(c))gs.push('say');
    if(phOk&&EAR.count(e.s)>=3)gs.push('cnt');
    var ch=gs.filter(function(g){return g!==prev});if(!ch.length)ch=gs;
    var g=ch[Math.floor(Math.random()*ch.length)];prev=g;
    out.push({id:c.id,g:g,ph:g==='cnt'||(g==='dict'&&phOk&&Math.random()<.5)});
  });
  return out;
}
function nextRow(){return '<div class="done-row"><span></span><button type="button" class="btn pri" id="nextb" data-x="next" hidden>Дальше'+KR.icon('arrow',16)+'</button></div>'}
function earCtl(){return '<div class="ear-ctl"><button type="button" class="ear-play" data-x="ear-say" aria-label="Послушать ещё раз">'+KR.icon('volume',30)+'</button><button type="button" data-x="ear-slow">Медленно</button></div>'}
/* slow — сначала медленно, потом в обычном темпе */
function earPlay(slow){
  if(!S||!S.ear)return;var e=S.ear,t=S.tok;
  if(!slow)return KR.say(e.text,e.l);
  sayP(e.text,e.l,{rate:.6}).then(function(){return pause(700)}).then(function(){if(S&&S.tok===t)KR.say(e.text,e.l)});
}
// что прозвучало: слово и три похожих на слух
function gHear(c){
  var opts=shuffle([c.w].concat(alikesOf(c).slice(0,3)));S.hopts=opts;S.ear={text:c.w,l:c.l};
  frame(GAME.hear[0],earCtl()+'<p class="muted q-sub">Какое слово прозвучало?</p>'+
    '<div class="opts q-opts">'+opts.map(function(o,i){return '<button type="button" data-h="'+i+'"'+wcls(c)+' lang="'+c.l+'">'+esc(o)+'</button>'}).join('')+'</div>'+
    '<div id="fb" class="q-fb"></div>'+nextRow());
  earPlay(false);
}
function hearPick(i){
  if(!S||S.lock)return;S.lock=true;var c=S.card,o=S.hopts[i],ok=o===c.w,t=S.tok;
  [].forEach.call(document.querySelectorAll('.q-opts button'),function(b,k){b.disabled=true;if(S.hopts[k]===c.w)b.classList.add('ok');else if(k===i)b.classList.add('bad')});
  var sb=function(x){return '<button type="button" data-say="'+esc(x)+'" data-l="'+c.l+'">'+KR.icon('volume',15)+' <span'+wcls(c)+' lang="'+c.l+'">'+esc(x)+'</span></button>'};
  $('#fb').innerHTML='<div class="'+(ok?'ok':'bad')+'">'+(ok?'Верно':'Прозвучало')+': '+word(c)+' — '+glH(c)+'</div>'+

  if(!ok)sayP(o,c.l).then(function(){return pause(500)}).then(function(){if(S&&S.tok===t)KR.say(c.w,c.l)});
  grade(ok?3:1,ok);
}
// диктант по клеточкам: слог (корейский) или буква (английский) в клеточке
function gDict(c,ph){
  var e=ph?exOf(c):null,text=e?e.s:c.w,ko=c.l==='ko',n=EAR.typed(text).length;
  S.ear={text:text,l:c.l,ph:!!e,tr:S.cx?(e?'':gl(c).s):e?e.t:trOf(c)};
  frame(GAME.dict[0]+(e?' · фраза':''),earCtl()+
    '<p class="muted q-sub">'+(e?'Впиши фразу':'Впиши слово')+': '+(ko?'в клеточке один слог':'в клеточке одна буква')+(e?', пробелы и знаки уже стоят':'')+' · '+(ko?'слогов':'букв')+': '+n+'</p>'+
    '<div class="dcells'+(ko?' ko':'')+'" id="dcells" lang="'+c.l+'" aria-hidden="true">'+EAR.cells(text,c.l).map(function(w){return '<span class="dw">'+w.map(function(x){return x.fix?'<i class="fix">'+esc(x.ch)+'</i>':'<i data-k="'+x.k+'"></i>'}).join('')+'</span>'}).join('')+'</div>'+
    '<form id="df" class="wr" autocomplete="off"><input class="name'+(ko?' ko':'')+'" id="din" lang="'+c.l+'" aria-label="'+(e?'Фраза':'Слово')+', которое прозвучало" autocapitalize="off" autocorrect="off" spellcheck="false"><button type="submit" class="btn pri">Проверить</button><button type="button" data-x="dhint">Подсказка</button></form>'+
    '<p class="muted q-sub" id="dleft"></p><div id="fb" class="q-fb"></div>'+nextRow()+(ko?'<p class="hint">Нужна корейская раскладка.</p>':''));
  $('#din').focus({preventScroll:true});
  earPlay(!!e||c.st!==2);   // фраза и ещё не выученное слово: сначала медленно
}
function dictFill(){
  var inp=$('#din');if(!inp||!S||!S.ear||S.lock)return;var t=EAR.typed(inp.value),total=EAR.typed(S.ear.text).length;
  [].forEach.call(document.querySelectorAll('#dcells i[data-k]'),function(i){i.textContent=t[+i.dataset.k]||''});
  var l=$('#dleft');if(l)l.textContent=t.length>total?'Лишних '+(S.ear.l==='ko'?'слогов':'букв')+': '+(t.length-total):'';
}
function dictCheck(){
  if(!S||S.lock)return;var inp=$('#din'),c=S.card,e=S.ear;if(!inp||!inp.value.trim())return;
  var r=EAR.check(e.text,e.l,inp.value);S.lock=true;inp.disabled=true;
  [].forEach.call(document.querySelectorAll('#dcells i[data-k]'),function(i){var x=r.cells[+i.dataset.k];if(!x)return;i.className=x.ok?'ok':'bad';
    if(!x.ok)i.innerHTML=(x.got?'<s>'+esc(x.got)+'</s>':'')+'<b>'+esc(x.ch)+'</b>'});
  var g=r.ok?(S.hint?2:3):(e.ph&&r.bad+r.extra<=1&&r.total>=10?2:1);
  $('#fb').innerHTML='<div class="'+(g>1?'ok':'bad')+'">'+(r.ok?'Верно':g>1?'Почти: одна ошибка':'Ошибок: '+(r.bad+r.extra)+'. Правильные буквы — в клеточках')+'</div>'+
    '<div class="exbox"><div'+wcls(c)+' lang="'+c.l+'">'+esc(e.text)+' '+sayBtn(e.text,c.l)+'</div>'+(e.tr?'<div class="muted">'+esc(e.tr)+'</div>':'')+(e.ph?'<div class="muted">Слово: '+word(c)+' — '+glH(c)+'</div>':'')+'</div>';
  KR.say(e.text,e.l);
  grade(g,r.ok&&!e.ph);   // после фразы не торопим: пусть дослушает
}
// скажи слово: перевод на экране, ученик говорит слово в микрофон
function gSay(c){
  S.ear={text:c.w,l:c.l};S.tries=0;S.peek=false;
  frame(GAME.say[0],promptHtml(c)+'<p class="muted q-sub">Скажи '+(c.l==='ko'?'по-корейски':'по-английски')+(c.l==='ko'&&units(c).length>1?' · слогов: '+units(c).length:'')+'</p>'+
    '<div class="ear-ctl"><button type="button" class="ear-play mic-big" data-x="mic" aria-label="Нажми и скажи слово">'+KR.icon('mic',30)+'</button></div>'+
    '<p class="muted q-sub" id="micst" aria-live="polite">Нажми на микрофон и скажи слово</p>'+
    '<div class="opts say-alt"><button type="button" data-x="say-peek">'+KR.icon('volume',15)+' Послушать, как правильно</button><button type="button" data-x="say-type">Ответить текстом</button></div>'+
    '<div id="fb" class="q-fb"></div>'+nextRow());
}
async function micGo(){
  if(!S||S.lock||S.listening)return;var c=S.card,t=S.tok,b=$('[data-x="mic"]'),st=$('#micst');
  KR.hush();S.listening=true;if(b)b.classList.add('on');if(st)st.textContent='Слушаю…';
  try{
    var alts=await EAR.recognize(c.l,{accent:KR.accent()});
    if(!S||S.tok!==t)return;
    var r=EAR.heard(alts,c.w,c.l),got='Услышали: «'+esc(r.best||alts[0])+'».';S.tries++;
    if(!r.ok){   // синоним или слово с тем же значением тоже засчитываем (кроме синонимов из подсказки)
      var shown=S.pr&&S.pr.k==='syn'?S.pr.list.map(M.nw):[];
      M.syns(c,info(c)).concat(others(c).filter(function(o){return rel(c,o.c)}).map(function(o){return o.c.w})).some(function(s){
        if(shown.indexOf(M.nw(s))>=0)return false;var r2=EAR.heard(alts,s,c.l);if(r2.ok){r=r2;r.syn=s;return true}});
    }
    if(r.ok){S.lock=true;if(st)st.textContent='';
      $('#fb').innerHTML='<div class="ok">'+(r.syn?'Тоже верно: «'+esc(r.syn)+'» — синоним. ':'Верно! ')+got+'</div><div class="muted">'+word(c)+' — '+glH(c)+'</div>'+more(c);
      KR.say(c.w,c.l);return grade(S.peek?2:3,true)}
    if(S.tries>=2){S.lock=true;if(st)st.textContent='';
      $('#fb').innerHTML='<div class="'+(r.close?'ok':'bad')+'">'+got+(r.close?' Почти!':'')+' Правильно: '+word(c)+' '+sayBtn(c.w,c.l)+' — '+glH(c)+'</div>'+more(c);
      KR.say(c.w,c.l);return grade(r.close?2:1,false)}
    $('#fb').innerHTML='<div class="bad">'+got+' '+(r.close?'Почти. Послушай и повтори.':'Попробуй ещё раз.')+'</div>';
    if(st)st.textContent='Ещё одна попытка';
    if(r.close){S.peek=true;KR.say(c.w,c.l)}
  }catch(e){if(S&&S.tok===t&&st)st.textContent=EAR.errText(e)||'Нажми на микрофон и скажи слово'}
  finally{if(S&&S.tok===t){S.listening=false;if(b)b.classList.remove('on')}}
}
/* микрофон рядом с новым словом: проверить своё произношение, без оценки */
async function micCheck(b){
  if(b.classList.contains('on'))return;
  var box=b.closest('.flash')||b.parentNode,fb=box.querySelector('.micfb'),text=b.dataset.mic,l=b.dataset.l;
  if(!fb){(b.closest('.flash-w')||b).insertAdjacentHTML('afterend','<div class="micfb" aria-live="polite"></div>');fb=box.querySelector('.micfb')}
  KR.hush();b.classList.add('on');fb.className='micfb';fb.textContent='Слушаю… скажи слово';
  try{
    var alts=await EAR.recognize(l,{accent:KR.accent()}),r=EAR.heard(alts,text,l);
    fb.className='micfb '+(r.ok?'ok':r.close?'':'bad');
    fb.textContent=r.ok?'Отлично, понятно: «'+r.best+'»':r.close?'Почти: услышали «'+r.best+'». Послушай и повтори.':'Услышали «'+(r.best||alts[0])+'». Послушай ещё раз и повтори.';
    if(!r.ok)setTimeout(function(){KR.say(text,l)},300);
  }catch(e){fb.className='micfb bad';fb.textContent=EAR.errText(e)}
  b.classList.remove('on');
}
// сколько слов во фразе (только в тренировке на слух, без оценки слова)
function gCount(c){
  var e=exOf(c),n=EAR.count(e.s),opts=shuffle([n-1,n,n+1,n+2]);

    '<div class="opts q-opts cnt">'+opts.map(function(x,i){return '<button type="button" data-cn="'+i+'">'+x+'</button>'}).join('')+'</div><div id="fb" class="q-fb"></div>'+nextRow());

}
function cntPick(i){
  if(!S||S.lock)return;S.lock=true;var c=S.card,e=S.ear,ok=S.copts[i]===S.cn;
  [].forEach.call(document.querySelectorAll('.q-opts button'),function(b,k){b.disabled=true;if(S.copts[k]===S.cn)b.classList.add('ok');else if(k===i)b.classList.add('bad')});
  $('#fb').innerHTML='<div class="'+(ok?'ok':'bad')+'">'+(ok?'Верно':'Слов во фразе')+': '+S.cn+'</div><div class="exbox"><div class="cnt-words'+(c.l==='ko'?' ko':'')+'" lang="'+c.l+'">'+
    e.text.split(/\s+/).map(function(w){return '<span>'+esc(w)+'</span>'}).join('')+'</div>'+(e.tr?'<div class="muted">'+esc(e.tr)+'</div>':'')+'</div>';

}
/* ответ в тренировке на слух. free — без влияния на интервалы */
function earGrade(ok,auto,free){
  var c=S.card;S.done++;if(ok)S.right++;else{S.wrong++;if(S.missed.indexOf(c.id)<0)S.missed.push(c.id)}
  if(!free){var o={};o[c.id]=!!ok;var r=V.practice(o),fb=$('#fb');
    if(fb&&r.back.length)fb.insertAdjacentHTML('beforeend','<div class="muted back-in">Слово вернётся на повторение сегодня</div>');
    else if(fb&&r.done.length)fb.insertAdjacentHTML('beforeend','<div class="muted back-in">Засчитано как повторение на сегодня</div>')}
  S.qi++;drawToday();
  if(auto)S.timer=setTimeout(nextCard,KR.calm()?900:1500);
  else{var b=$('#nextb');if(b){b.hidden=false;b.focus()}else nextCard()}
}
function finishEar(){
  var n=S.right+S.wrong,miss=S.missed.map(function(id){return V.get(id)}).filter(Boolean);S.mode='done';
  $('#play').innerHTML='<div class="fin"><span class="spark">'+KR.icon('headphones',34)+'</span><h3>Тренировка на слух закончена</h3><p class="muted">Верно: '+S.right+' из '+n+'.'+(miss.length?' Эти слова стоит послушать ещё раз:':'')+'</p>'+
    (miss.length?'<div class="opts ear-miss">'+miss.map(function(c){return '<button type="button" data-say="'+esc(c.w)+'" data-l="'+c.l+'">'+KR.icon('volume',15)+' <span'+wcls(c)+' lang="'+c.l+'">'+esc(c.w)+'</span>&nbsp;· '+esc(trOf(c))+'</button>'}).join('')+'</div>':'')+
    '<div class="fin-acts"><button type="button" class="btn pri" data-x="'+(S.scoped?'free-ear':'to-ear')+'">Ещё раунд</button>'+(miss.length?'<button type="button" data-x="pod-miss">Подкаст из ошибок</button>':'')+'<button type="button" data-x="stop">Готово</button></div></div>';
  S.missIds=miss.map(function(c){return c.id});

}

// ---------- словарь 2.0: карточки из базы школы, словари от преподавателя (supabase/vocab2.sql) ----------
// Без этого файла на сервере всё работает как раньше: карточка слова показывает то, что есть у самого ученика.
var infoKey=function(){return 'kr_winfo:'+KR.user()};
(function(){try{var x=JSON.parse(localStorage.getItem(infoKey())||'null');if(x){INFO=x.i||{};WSETS=x.s||[]}}catch(e){}})();
async function loadInfo(){
  if(!KR.cloud.on||!KR.user())return;infoAt=Date.now();
  try{
    var r=await Promise.all([KR.api('my_words_info'),KR.api('my_word_sets')]);
    INFO=r[0]||{};WSETS=r[1]||[];
    try{localStorage.setItem(infoKey(),JSON.stringify({i:INFO,s:WSETS,t:Date.now()}))}catch(e){}
  }catch(e){if(e.status===404){INFO={};WSETS=[];try{localStorage.removeItem(infoKey())}catch(x){}}}
  if(!S&&!typing()&&!editing)drawList();
  var d=$('#wdlg');if(d&&d.open)openCard(d.dataset.id);
}
function info(c){return INFO[c.id]||null}
function trOf(c){return S&&S.gx?glossOf(c,S.gx):trRu(c)}
function trRu(c){var i=info(c);return c.t||(i&&i.tr_ru&&i.tr_ru[0])||((c.d||[])[0]||{}).s||''}
function setsHere(){return WSETS.filter(function(s){return s.lang===lang})}
function setById(id){return WSETS.filter(function(s){return String(s.id)===String(id)})[0]||null}
function fmtDue(d){var t=new Date(d+'T00:00');return isNaN(t)?d:t.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
function passV2(c){
  var i=info(c)||{},s=sfilt?setById(sfilt):null;
  if(s&&(s.cards||[]).indexOf(c.id)<0)return false;
  if(tfilt&&(i.topics||[]).indexOf(tfilt)<0)return false;
  if(lvfilt&&i.level!==lvfilt)return false;
  if(pfilt&&i.pos!==pfilt)return false;
  return true;
}
/* фильтры по словарю, теме, уровню и части речи — только те, для которых есть данные */
function selects(all){
  var T={},L={},P={};
  all.forEach(function(c){var i=info(c);if(!i)return;(i.topics||[]).forEach(function(t){T[t]=1});if(i.level)L[i.level]=1;if(i.pos)P[i.pos]=1});
  var sel=function(id,label,cur,opts){return opts.length?'<label class="fsel"><span>'+label+'</span><select id="'+id+'"><option value="">все</option>'+
    opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(cur)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select></label>':''};
  var h=sel('f-set','Словарь',sfilt,setsHere().map(function(s){return [s.id,s.title]}))+sel('f-topic','Тема',tfilt,Object.keys(T).sort().map(function(t){return [t,t]}))+
    sel('f-level','Уровень',lvfilt,Object.keys(L).sort().map(function(t){return [t,t]}))+sel('f-pos','Часть речи',pfilt,Object.keys(P).sort().map(function(t){return [t,KR.W2.POS[t]||t]}));
  return h?'<div class="fsels">'+h+'</div>':'';
}
/* словари, которые назначил преподаватель: сколько слов уже выучено */
function setsCard(){

// ---------- подкаст из слов: слово, пауза на ответ, перевод, пример, повтори за диктором ----------
/* Пауза — время вспомнить и сказать ответ вслух, пока диктор его не назвал. pause 0 — ждём, пока ученик нажмёт «Дальше».
   Настройки — на этом устройстве (вкладка «Настройки» → «Подкаст»). */
var LISTROWS=[],EXPROWS=[],POD=null,LOCK=null;
var PAUSES=[2,3,5,8,12,0];
function podCfg(){

  if(x&&typeof x==='object'){
    if(!('dir' in x)){x={pause:Math.max(5,+x.pause||0),dir:x.tr===0?'w':'w2t',rep:x.rep}}   // прежняя «Озвучка списка»: пауза была до 6 секунд
    d=Object.assign(d,x);
  }

  d.dir=['w2t','t2w','w'].indexOf(d.dir)>=0?d.dir:'w2t';d.rep=d.rep>1?2:1;['ex','echo','slow'].forEach(function(k){d[k]=d[k]?1:0});

}

/* одна фраза до конца: ждём окончания звука, но не дольше разумного (у некоторых браузеров событие конца теряется) */
function sayP(text,l,o){var r=(o&&o.rate)||KR.rate();return new Promise(function(res){var done=false,fin=function(){if(!done){done=true;res()}};
  KR.say(text,l,Object.assign({end:fin},o||{}));setTimeout(fin,Math.max(4000,String(text).length*450/r))})}
function pause(ms){return new Promise(function(r){setTimeout(r,ms)})}
// шаги подкаста прерываются кнопками: пауза, следующее слово, стоп
function podLive(me){return POD===me&&!me.skip}
function podWait(me,ms){return new Promise(function(res){
  if(!podLive(me))return res();var t=null,fin=function(){clearTimeout(t);if(me.wake===fin)me.wake=null;res()};me.wake=fin;if(ms!=null)t=setTimeout(fin,ms)})}
function podSay(me,text,l,o){
  if(!podLive(me)||!text)return Promise.resolve();
  return new Promise(function(res){var r=(o&&o.rate)||KR.rate(),t,fin=function(){clearTimeout(t);if(me.wake===fin)me.wake=null;res()};me.wake=fin;
    KR.say(text,l,Object.assign({},o||{},{end:fin}));t=setTimeout(fin,Math.max(4000,String(text).length*450/r))});

function podKick(me){if(me&&me.wake)me.wake()}

  var cfg=podCfg();
  for(;me.i<me.ids.length;me.i++){
    if(POD!==me)return;me.skip=false;
    var c=V.get(me.ids[me.i]);if(!c)continue;
    var gx=podGloss(c),t=gx.s,tl=gx.l,e=cfg.ex?exOf(c):null,first=cfg.dir==='t2w'&&t,steps=[],add=function(f){steps.push(f)};

    var sayWord=async function(){if(cfg.slow){await podSay(me,c.w,c.l,{rate:.6});await podWait(me,500)}
      for(var r=0;r<cfg.rep;r++){await podSay(me,c.w,c.l);if(r+1<cfg.rep)await podWait(me,800)}};
    var think=async function(){stage('think');if(cfg.pause)await podWait(me,cfg.pause*1000);else{me.tap=true;drawPod();await podWait(me,null);me.tap=false}};
    me.c=c;me.t=t;me.tl=tl;me.e=e;me.first=first?'t':'w';
    if(first){add(function(){stage('ask');return podSay(me,t,tl)});add(think);add(function(){stage('open');return sayWord()})}
    else{add(function(){stage('ask');return sayWord()});add(think);
      if(cfg.dir==='w2t'&&t)add(function(){stage('open');return podSay(me,t,tl)});else add(function(){stage('open');return podWait(me,300)})}
    if(e){add(function(){return podWait(me,500)});add(function(){stage('ex');return podSay(me,e.s,c.l)});
      if(e.t&&cfg.dir!=='w'&&tl==='ru'){add(function(){return podWait(me,400)});add(function(){return podSay(me,e.t,'ru')})}}
    if(cfg.echo){add(function(){return podWait(me,500)});add(function(){stage('echo');return podSay(me,c.w,c.l)});
      add(function(){return podWait(me,Math.max(2500,c.w.length*(c.l==='ko'?500:160)+1500))})}
    add(function(){return podWait(me,600)});
    markRow(c.id);

/* значение слова в подкасте: в контексте — определение или синонимы на изучаемом языке */
function podGloss(c){

  for(var i=0;i<o.length;i++){var g=o[i];
    if(g==='ctx'){var d=M.tdefs(c,I)[0],sy=M.syns(c,I);if(d)return {s:d.s,l:c.l};if(sy.length)return {s:sy.slice(0,3).join(', '),l:c.l}}

/* подкаст на сегодня: слова в работе, повторения и новые слова дня; если их нет — все изученные, начиная с тех, что скоро повторять */
function podToday(){
  var p=V.plan(DL()),seen={},ids=[];
  p.learn.concat(p.soon,p.rev,p.fresh).forEach(function(c){if(!seen[c.id]){seen[c.id]=1;ids.push(c.id)}});
  if(!ids.length)ids=V.all(DL()).filter(function(c){return c.st}).sort(function(a,b){return a.due-b.due}).slice(0,30).map(function(c){return c.id});
  return ids;

// ---------- общая статистика словаря ----------
/* Уровни слов, точность, прогноз повторений на неделю, занятия за 14 дней (журнал kr_wlog, js/vocab.js), самые трудные слова. */
function drawStats(){
  var all=V.all(DL()),now=Date.now(),ds=SRS.dayStart(now),DAY=SRS.DAY;
  var lv={n:0,l:0,s:0,m:0,g:0};all.forEach(function(c){if(!c.st)lv.n++;else if(c.st!==2)lv.l++;else if((c.ivl||0)>=21)lv.g++;else if((c.ivl||0)>=7)lv.m++;else lv.s++});
  var reps=0,laps=0;all.forEach(function(c){reps+=c.reps||0;laps+=c.lap||0});
  var bar=function(rows,max){return '<div class="sbars">'+rows.map(function(r){return '<div class="sbar"><span>'+r[0]+'</span><i><b style="width:'+(max?Math.round(r[1]/max*100):0)+'%"></b></i><em>'+r[1]+'</em></div>'}).join('')+'</div>'};
  var L=[['Новые',lv.n],['Учу сейчас',lv.l],['Начинаю запоминать',lv.s],['Запоминаю (7+ дн)',lv.m],['Знаю хорошо (21+ дн)',lv.g]];
  var fc=[];for(var i=0;i<7;i++){var a=ds+i*DAY,b=a+DAY;fc.push([i===0?'Сегодня':i===1?'Завтра':new Date(a).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric'}),all.filter(function(c){return c.st&&(i===0?c.due<b:c.due>=a&&c.due<b)}).length])}
  var log={};try{log=JSON.parse(localStorage.getItem('kr_wlog:'+KR.user())||'{}')||{}}catch(e){}
  var act=[],streak=0,run=true;for(var j=0;j<14;j++){var dt=new Date(ds-j*DAY),k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'),x=log[k]||{n:0,r:0,ok:0};
    var n=x.n+x.r;if(n)streak+=run?1:0;else if(j>0)run=false;act.push([dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}),n,x.ok])}
  act.reverse();var aMax=Math.max.apply(null,act.map(function(r){return r[1]}).concat([1]));
  var hard=all.filter(function(c){return c.st}).map(function(c){return {c:c,s:(c.lap||0)*2+(c.pe||0)+(c.tc||0)*2+(c.star?1:0)}}).filter(function(x){return x.s>0}).sort(function(a,b){return b.s-a.s}).slice(0,12);
  var box=function(n,t){return '<div><b>'+n+'</b><span class="muted">'+t+'</span></div>'};
  var h='<div class="card glass wstats"><h3>'+KR.icon('target',20)+' Статистика'+(MIXL?' · все языки':' · '+KR.LANGS[lang].name)+'</h3>'+
    '<div class="stat">'+box(all.length,'всего слов')+box(lv.m+lv.g,'запомнено')+box(reps?Math.round((reps-laps)/reps*100)+'%':'—','вспоминаю')+box(streak,'дней подряд')+'</div>'+
    '<h4>Уровни слов</h4>'+bar(L,Math.max.apply(null,L.map(function(r){return r[1]}).concat([1])))+
    '<h4>Повторения на неделю вперёд</h4>'+bar(fc,Math.max.apply(null,fc.map(function(r){return r[1]}).concat([1])))+
    '<h4>Занятия за 14 дней</h4><p class="muted tb-sub">Ответов в день (новые слова и повторения)</p><div class="sact">'+act.map(function(r){return '<div title="'+r[0]+': '+r[1]+' ответов, верно '+r[2]+'"><i style="height:'+Math.round(r[1]/aMax*100)+'%"></i><small>'+r[0].split(' ')[0]+'</small></div>'}).join('')+'</div>'+
    '<h4>Самые трудные слова</h4>'+(hard.length?'<div class="wl">'+hard.map(function(x){var c=x.c;return '<div class="wrow">'+sayBtn(c.w,c.l)+'<button type="button" class="mid wopen" data-open="'+esc(c.id)+'"><b>'+word(c)+'</b><span class="muted">'+esc(trOf(c))+' · забывал(а) '+(c.lap||0)+', ошибок '+(c.pe||0)+(c.tc?', возвращал учитель '+c.tc:'')+'</span></button>'+badge(c)+'</div>'}).join('')+'</div>'+
      '<div class="done-row"><span></span><button type="button" data-x="hard-go">'+KR.icon('repeat',16)+' Отработать трудные</button></div>':'<p class="muted">Трудных слов пока нет.</p>')+'</div>';
  $('#stats').innerHTML=h;
}

async function bulkTranslate(){
  var msg=$('#bulk-msg'),btn=document.querySelector('[data-x="bulk-translate"]');
  bulkRows=KR.W2.parseMine($('#bulk-input').value);
  var ok=bulkRows.filter(function(x){return !x.err}),cut=0;
  if(!ok.length){drawBulkPreview();msg.textContent=bulkRows.length?'Не нашлось ни одного корейского или английского слова.':'Вставь список слов: по одному в строке, через запятую или «слово — перевод».';msg.className='msg bad';return}
  if(ok.length>80){cut=ok.length-80;ok.slice(80).forEach(function(x){x.err='больше 80 слов за раз'})}
  if(btn)btn.disabled=true;
  var need=ok.filter(function(x){return !x.t&&!x.err}).length;
  msg.textContent=need?'Ищем переводы: база школы, словарь, DeepL…':'Разбираем список…';msg.className='msg';
  var r=need?await KR.W2.translate(bulkRows):{n:0,err:''};

  ok=bulkRows.filter(function(x){return !x.err});
  var withT=ok.filter(function(x){return x.t}).length,ko=ok.filter(function(x){return x.l==='ko'}).length,bad=bulkRows.length-ok.length;
  var parts=['Слов: '+ok.length+(ko&&ko<ok.length?' (корейских '+ko+', английских '+(ok.length-ko)+')':''),'с переводом: '+withT];
  if(bad)parts.push('не возьмём: '+bad);
  if(r.err){msg.textContent=parts.join(' · ')+'. Автоперевод не получился: '+r.err+'. Переводы можно вписать вручную.';msg.className='msg bad'}
  else{msg.textContent=parts.join(' · ')+'. Проверь переводы с пометкой DeepL.'+(cut?' За раз можно добавить 80 слов.':'');msg.className='msg ok'}
}
function bulkSave(){
  bulkRead();

  bulkRows.forEach(function(x){
    if(x.err||!x.w||!x.l)return;
    var r=addW(x.l,x.w,x.t,{src:'manual-bulk',ex:x.ex,et:x.ex?x.et:''});
    if(x.entry){var ce=V.get(r.card.id);if(ce)V.update(enrich(ce,x.entry))}n++;if(!r.added)again++;if(x.l==='ko')ko++;if(x.l!==lang&&!MIXL)other++;
  });
  bulkRows=[];drawBulkPreview();$('#bulk-input').value='';
  drawToday();drawList();
  var msg=$('#bulk-msg');

}

  if(f.id==='pf')return savePrefs(false);
  if(f.id==='addf'){
    var w=$('#aw').value.trim(),t=$('#at').value.trim(),m=$('#amsg'),wl=KR.W2.langOf(w);
    if(!w||!t){m.textContent='Нужны и слово, и перевод.';m.className='msg bad';return}
    if(!wl&&KR.W2.langOf(t)){var sw=w;w=t;t=sw;wl=KR.W2.langOf(w)}   // перевод и слово перепутаны местами
    if(!wl){m.textContent='Слово должно быть корейским или английским.';m.className='msg bad';return}
    var r=addW(wl,w,t,{src:'manual'});drawAll();m=$('#amsg');
    var on=wl!==lang&&!MIXL?' Оно в словаре «'+KR.LANGS[wl].name+'»: переключи кнопкой вверху страницы.':'';m.textContent=(r.added?'Добавлено: '+r.card.w+'.':'Это слово уже было в словаре. Оно вернётся на повторение раньше.')+on;m.className='msg ok';$('#aw').focus();return;
  }
  if(f.classList.contains('wedit')){var c=V.get(f.dataset.id);if(c){
    var nw=f.w.value.normalize('NFC').trim().replace(/\s+/g,' ');
    if(!nw){f.w.focus();return}
    if(nw!==c.w){if(KR.W2&&KR.W2.langOf&&KR.W2.langOf(nw)&&KR.W2.langOf(nw)!==c.l){alert('Слово должно остаться '+(c.l==='ko'?'корейским':'английским')+'. Если это слово другого языка, добавь его заново.');return}
      var rn=V.rename(c.id,nw);if(rn&&rn.exists){alert('Слово «'+rn.exists.w+'» уже есть в словаре. Удали лишнюю карточку или исправь написание по-другому.');return}
      if(rn){if(S_DF[c.id]){S_DF[rn.id]=S_DF[c.id];delete S_DF[c.id]}c=rn}}
    var tt=M.splitTr(f.t.value,c.l),dd=M.parseDefs(f.d.value),seen={};dd=dd.concat(tt.d).filter(function(x){var k=x.l+':'+x.s.toLowerCase();if(seen[k])return false;seen[k]=1;return true}).slice(0,12);
    var arr=function(o,k,v){if(v.length)o[k]=v;else delete o[k]};
    if(tt.t!==(c.t||''))c=Object.assign({},c),delete c.sn;   // перевод поменяли — значение слова подберётся по новому переводу
    c=Object.assign({},c,{t:tt.t,ex:f.ex.value.trim(),et:f.et.value.trim()});arr(c,'d',dd);arr(c,'syn',M.parseSyn(f.syn.value));arr(c,'col',M.parseCols(f.col.value));
    if(S_DF[c.id]){if(S_DF[c.id].dsrc)c.dsrc=S_DF[c.id].dsrc;if(S_DF[c.id].ipa&&!c.ipa)c.ipa=S_DF[c.id].ipa;c.dq=1;delete S_DF[c.id]}if(!c.ex){delete c.ex;delete c.et;delete c.f}else if(c.f&&c.ex.indexOf(c.f)<0)delete c.f;V.update(c)}editing=null;drawAll()}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){q=e.target.value;shown=60;var pos=e.target.selectionStart;drawList();var n=$('#q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
  if(e.target.id==='p-rate'){KR.setRate(e.target.value);$('#p-ratev').textContent=(+e.target.value).toFixed(2)}
  if(e.target.id==='din')dictFill();
});
document.addEventListener('change',function(e){
  var id=e.target.id;if(id==='p-voice')KR.setVoice(lang,e.target.value);
  if(id==='f-set'||id==='f-topic'||id==='f-level'||id==='f-pos'){
    var v=e.target.value;if(id==='f-set')sfilt=v;else if(id==='f-topic')tfilt=v;else if(id==='f-level')lvfilt=v;else pfilt=v;
    shown=60;drawList();var n=$('#'+id);if(n)n.focus();
  }
});
document.addEventListener('keydown',function(e){
  if(!S||e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key===' '&&$('#back')&&$('#back').hidden){e.preventDefault();return flip()}
  if(/^[1-4]$/.test(e.key)){var b=document.querySelector('#rate:not([hidden]) button[data-g="'+e.key+'"]')||document.querySelector('.q-opts button:is([data-o="'+(e.key-1)+'"],[data-h="'+(e.key-1)+'"],[data-cn="'+(e.key-1)+'"]):not(:disabled)');if(b){e.preventDefault();b.click()}}
});
// раскрытые блоки сводки не закрываются при перерисовке
document.addEventListener('toggle',function(e){var t=e.target;if(!t.dataset||!t.dataset.open)return;OPEN[t.dataset.open]=t.open;if(t.dataset.open==='guide'&&!t.open){try{localStorage.setItem('kr_wguide','1')}catch(x){}}},true);
// пришли данные из облака: сводку обновляем всегда, а список — только если ученик сейчас ничего не вводит
function typing(){var a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
V.onchange=function(){if((wlang()!==lang||wmix()!==MIXL)&&!S){drawAll();return}   // слова пришли из облака: язык словаря мог смениться
  drawToday();if(!S&&!typing()&&!editing)drawList()};
KR.onLang=function(l){try{sessionStorage.setItem(wkey(),l)}catch(e){}stopListen();if(S)stop();else drawAll()};
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){if(!$('#prefs').hidden&&!typing())drawPrefs()};
if(KR.require()){KR.topbar('words');drawAll();KR.load().then(function(){
  var l=URLP.get('lang');if(l&&wlangs().indexOf(l)>=0){try{sessionStorage.setItem(wkey(),l)}catch(e){}if(l!==KR.lang()&&KR.langs().indexOf(l)>=0)KR.setLang(l)}
  drawAll();loadInfo();setTimeout(fixOld,3000);
  // из кабинета: words.html#day (и старые #new, #rev) — сразу занятие на сегодня: карточки, потом упражнения
  var hs=location.hash,pl=V.plan(DL());
  if(hs==='#day'||hs==='#new'||hs==='#rev'){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    if(pl.fresh.length+pl.learn.length+pl.rev.length)start('day');else if(pl.soon.length)start('rev')}
  if(hs==='#export'){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}var xb=document.querySelector('[data-x="export"]');if(xb)xb.click()}
})}
</script>
