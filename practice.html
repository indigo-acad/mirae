<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Доп. упражнения · MIRAÉ</title>
<meta name="theme-color" content="#0B1535">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="topbar"></div>
<header class="band"><div class="in"><small>Отработка</small><h1>Доп. упражнения</h1><p>Тренажёры, игры, проверочные и квесты, которые назначил преподаватель</p></div></header>
<main><div id="box"></div></main>
<script src="data/course.js"></script><script src="data/materials.js"></script><script src="data/l12-jiyo.js"></script><script src="data/l11-adaju.js"></script><script src="data/p12-jiyo-1.js"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/assistant.js"></script>
<script>
var cur='all',esc=KR.esc;
function draw(){
  KR.topbar('practice');
  var list=MATERIALS.filter(function(m){return m.section!=='course'||m.kind==='practice'}).filter(function(m){return KR.can(m.id)});
  var secs=Object.keys(SECTIONS).filter(function(k){return k!=='course'});
  var h='';
  if(!list.length){h='<div class="card glass"><h3>Пока пусто</h3><p class="muted">'+(KR.ctx.ok?'Преподаватель ещё не назначил тебе материалы. Когда назначит, они появятся здесь.':'Нет связи с сервером: задания не загружены.')+'</p></div>';document.getElementById('box').innerHTML=h;return}
  h+='<div class="card glass"><b>Раздел</b><div class="opts" style="margin-top:8px"><button data-f="all" class="'+(cur==='all'?'sel':'')+'" aria-pressed="'+(cur==='all')+'">Все</button>'+secs.filter(function(k){return list.some(function(m){return m.section===k||(k==='korean'&&m.kind==='practice')})}).map(function(k){return '<button data-f="'+k+'" class="'+(cur===k?'sel':'')+'" aria-pressed="'+(cur===k)+'">'+esc(SECTIONS[k])+'</button>'}).join('')+'</div>'+(KR.ctx.teacher?'<p class="note" style="margin-top:12px">Вы видите все материалы как преподаватель. Ученики видят только назначенные.</p>':'')+'</div>';
  var shown=list.filter(function(m){return cur==='all'||m.section===cur||(cur==='korean'&&m.kind==='practice')});
  h+='<div class="grid mats">'+shown.map(function(m){
    var a=KR.assignedInfo(m.id);
    var extra=(a&&a.due?' · срок '+esc(a.due):'')+(a&&a.note?' · '+esc(a.note):'');
    return '<div class="card glass"><span class="tag">'+esc(SECTIONS[m.section]||'')+(m.level?' · '+esc(m.level):'')+'</span><h3 style="margin:4px 0" class="ko">'+esc(m.title)+'</h3><div class="muted">'+esc((window.KINDS||{})[m.kind]||'')+extra+'</div><div class="done-row"><span></span><a class="btn pri" href="'+esc(m.path)+'">Открыть'+KR.icon('arrow',16)+'</a></div></div>'}).join('')+'</div>';
  document.getElementById('box').innerHTML=h;
}
document.addEventListener('click',function(e){var b=e.target.closest('button[data-f]');if(b){cur=b.dataset.f;draw()}});
if(KR.require()){KR.topbar('practice');KR.load().then(draw)}
</script>
</body>
</html>
