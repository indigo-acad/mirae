<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>Вход</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"></head><body>
<div id="topbar"></div>
<header class="band"><div class="in"><small>MIRAÉ</small><h1>Личный кабинет</h1><p>Вход для учеников MIRAÉ</p></div></header>
<main><div class="card login" style="margin-top:14px">
<input id="nm" class="name" placeholder="Логин" autocomplete="off">
<input id="pin" class="name" type="password" inputmode="numeric" maxlength="8" placeholder="PIN-код" autocomplete="off">
<p id="msg" class="muted" style="min-height:22px"></p>
<button class="pri" id="go" style="width:100%">Войти</button>
<p class="note" style="margin-top:12px">Логин и PIN выдаёт преподаватель. Если забыл PIN, напиши ей, она пришлёт новый.</p>
</div></main>
<script src="js/config.js"></script><script src="js/common.js"></script>
<script>
const $=s=>document.querySelector(s);KR.topbar("cabinet");
let busy=false;
$("#go").onclick=async()=>{if(busy)return;const n=$("#nm").value.trim(),p=$("#pin").value.trim(),m=$("#msg");
 if(!n||!/^\d{4,8}$/.test(p)){m.textContent="Введи логин и PIN из 4–8 цифр.";return}
 busy=true;m.textContent="Подождите…";
 const r=await KR.login(n,p);busy=false;
 if(r.ok){location.href="cabinet.html";return}
 m.textContent={none:"Такого ученика нет. Логин выдаёт преподаватель.",pin:"Неверный PIN."}[r.err]||"Не получилось. Попробуй ещё раз."};
document.addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click()});
</script></body></html>
